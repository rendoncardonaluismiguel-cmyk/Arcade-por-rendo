<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track & Field — Konami</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:     #E83030;
    --red2:    #FF5050;
    --green:   #44CC44;
    --blue:    #30AAEE;
    --cyan:    #00EEFF;
    --pink:    #FF88AA;
    --track1:  #E05040;
    --track2:  #44AA44;
    --dark:    #050810;
  }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    background:#050810; image-rendering:pixelated;
  }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .8s ease, transform .8s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.3) saturate(1.4);
    image-rendering:auto; z-index:0;
    animation: bgPulse 5s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100%{ filter:brightness(.3) saturate(1.4); }
    50%    { filter:brightness(.38) saturate(1.7); }
  }

  /* CRT scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 4px
    );
  }
  /* Vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 22%, rgba(5,8,16,.93) 100%),
      linear-gradient(to top, rgba(5,8,16,.99) 0%, transparent 32%),
      linear-gradient(to bottom, rgba(5,8,16,.55) 0%, transparent 22%);
  }

  /* Canvases */
  #track-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #runner-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #score-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui {
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
  }

  /* Score row */
  .arcade-hdr {
    display:flex; gap:12px; margin-bottom:8px;
    animation: dropIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes dropIn { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }
  .score-cell {
    background:rgba(0,0,0,.88);
    border:2px solid rgba(232,48,48,.4);
    padding:5px 14px; text-align:center; min-width:90px;
  }
  .score-lbl { font-size:.32rem; letter-spacing:.25em; color:rgba(255,255,255,.4); margin-bottom:4px; }
  .score-val { font-size:clamp(.7rem,2.6vw,1rem); color:var(--cyan); text-shadow:0 0 10px var(--cyan); }

  /* World record box */
  .wr-box {
    background:rgba(0,0,0,.88);
    border:2px solid var(--red);
    padding:5px 14px; text-align:center;
    box-shadow:0 0 15px rgba(232,48,48,.3);
    animation: dropIn .5s .1s cubic-bezier(.34,1.56,.64,1) both;
  }
  .wr-lbl { font-size:.28rem; letter-spacing:.3em; color:rgba(255,255,255,.35); margin-bottom:3px; }
  .wr-val { font-size:clamp(.6rem,2.2vw,.9rem); color:var(--red2); text-shadow:0 0 10px var(--red2); }

  /* Title card */
  .title-card {
    background:rgba(0,0,0,.92);
    border-top:4px solid var(--red);
    border-bottom:4px solid var(--red);
    padding:14px 36px 16px;
    text-align:center;
    box-shadow: 0 0 0 1px #000,
                0 0 40px rgba(232,48,48,.5),
                0 0 90px rgba(255,80,80,.2);
    min-width:min(90vw,460px);
    animation: cardIn .6s .12s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.5);opacity:0} to{transform:scaleY(1);opacity:1} }

  .tf-eyebrow {
    font-size:clamp(.3rem,1.1vw,.46rem);
    letter-spacing:.6em;
    color:var(--cyan);
    text-shadow:0 0 8px var(--cyan);
    margin-bottom:6px;
  }
  .tf-title {
    font-size:clamp(2.2rem,10vw,5.5rem);
    line-height:.88; letter-spacing:.04em;
    color:#fff;
    text-shadow: 4px 4px 0 var(--red),
                 0 0 25px rgba(232,48,48,.7),
                 0 0 60px rgba(255,80,80,.3);
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100%{ text-shadow:4px 4px 0 var(--red), 0 0 25px rgba(232,48,48,.7); }
    50%    { text-shadow:4px 4px 0 var(--red), 0 0 50px rgba(255,80,80,1), 0 0 90px rgba(255,80,80,.5); }
  }
  .tf-amp {
    font-size:clamp(1.8rem,8vw,4.5rem);
    color:var(--red2);
    text-shadow:3px 3px 0 #900, 0 0 20px rgba(255,80,80,.6);
  }
  .tf-field {
    font-size:clamp(2.2rem,10vw,5.5rem);
    line-height:.88; letter-spacing:.04em;
    color:#fff;
    text-shadow: 4px 4px 0 var(--green),
                 0 0 25px rgba(68,204,68,.6);
  }
  .tf-sub {
    font-size:clamp(.32rem,1.2vw,.5rem);
    letter-spacing:.4em;
    color:rgba(255,255,255,.3);
    margin-top:8px;
    border:1px solid rgba(255,255,255,.12);
    padding:3px 12px; display:inline-block;
  }

  /* Lives / medals row */
  .lives-row {
    margin-top:10px; display:flex; align-items:center; gap:5px;
    animation: livesPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes livesPop { from{transform:scale(0)} to{transform:scale(1)} }
  .lives-lbl { font-size:.34rem; letter-spacing:.2em; color:rgba(255,255,255,.4); }
  .medal { font-size:1.1rem; filter:drop-shadow(0 0 5px rgba(255,200,0,.8)); }

  /* Time countdown */
  .bonus-row {
    margin-top:5px; display:flex; align-items:center; gap:8px;
    font-size:.36rem; color:var(--red2);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(232,48,48,.5); }
  .bonus-val { text-shadow:0 0 8px var(--red2); animation:bonusBlink 1s step-start infinite; }
  @keyframes bonusBlink { 50%{opacity:.3} }

  /* Play button */
  .play-btn {
    margin-top:14px;
    padding:13px 40px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.08em;
    color:#fff; background:var(--red);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 #900, -4px 0 0 #900,
      0 4px 0 #900, 0 -4px 0 #ff6666,
      0 0 30px rgba(232,48,48,.5);
    transition:transform .12s;
    position:relative; overflow:hidden;
    animation: btnPop .6s .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-5deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:translateX(-100%); animation:shine 2.8s 1.2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}
  .play-btn:hover { transform:scale(1.08); box-shadow:4px 0 0 #900,-4px 0 0 #900,0 4px 0 #900,0 -4px 0 #ff6666,0 0 60px rgba(232,48,48,1); }
  .play-btn:active { transform:scale(.92) translate(2px,2px); }

  .insert-coin {
    margin-top:10px; font-size:.36rem; letter-spacing:.2em;
    color:var(--cyan); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:10px;
    font-family:'Orbitron',sans-serif; font-size:.65rem;
    letter-spacing:.2em; color:rgba(255,255,255,.22);
    text-align:center; line-height:2.2;
  }
  .key {
    display:inline-block; border:1px solid rgba(232,48,48,.25);
    border-radius:2px; padding:0 5px;
    color:rgba(232,48,48,.45); margin:0 2px; font-size:.6rem;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#050810;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }
  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#050810,#0a0510);
    border-bottom:2px solid var(--red);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.68rem; letter-spacing:.06em;
    color:var(--red2); text-shadow:2px 2px 0 #600, 0 0 10px rgba(232,48,48,.5);
  }
  .hdr-btn {
    font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--red2); border-color:var(--red2); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Track &amp; Field">
  <canvas id="track-canvas"></canvas>
  <canvas id="runner-canvas"></canvas>
  <canvas id="score-canvas"></canvas>

  <div class="ui">
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">1UP</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="wr-box">
        <div class="wr-lbl">WORLD RECORD</div>
        <div class="wr-val" id="wr-val">09sec93</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">050000</div>
      </div>
    </div>

    <div class="title-card">
      <div class="tf-eyebrow">✦ KONAMI ✦</div>
      <div class="tf-title">TRACK</div>
      <div class="tf-amp">&amp;</div>
      <div class="tf-field">FIELD</div>
      <div class="tf-sub">✦ ARCADE CLASSIC · 1983 ✦</div>
    </div>

    <div class="lives-row">
      <span class="lives-lbl">QUALIFY ×</span>
      <span class="medal">🥇</span>
      <span class="medal">🥇</span>
      <span class="medal">🥇</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">TIME</span>
      <span class="bonus-val" id="bonus-val">01:46</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">Z</span><span class="key">X</span> Correr (alternar rápido) &nbsp;|&nbsp;
      <span class="key">C</span> Saltar/Lanzar<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp;
      <span class="key">F</span> Fullscreen &nbsp;|&nbsp;
      <span class="key">Esc</span> Volver
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🏃 TRACK &amp; FIELD</span>
    <span style="font-family:'Orbitron',sans-serif;font-size:.65rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">KONAMI · NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── ANIMATED TRACK LANES ── */
(function(){
  const c = document.getElementById('track-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const LANES = [
    { y:.60, color:'#CC3322', speed:1.8, dir:1  },
    { y:.65, color:'#33AA33', speed:2.1, dir:1  },
    { y:.70, color:'#CC3322', speed:1.6, dir:1  },
    { y:.75, color:'#33AA33', speed:2.3, dir:1  },
    { y:.80, color:'#CC3322', speed:1.9, dir:1  },
    { y:.85, color:'#33AA33', speed:2.0, dir:1  },
  ];
  let offsets = LANES.map(()=>0);

  function frame(){
    ctx.clearRect(0,0,W,H);
    LANES.forEach((lane, i)=>{
      offsets[i] = (offsets[i] + lane.speed) % W;
      const y = lane.y * H;
      const h = H * .045;
      // Lane background
      ctx.globalAlpha = .12;
      ctx.fillStyle = lane.color;
      ctx.fillRect(0, y, W, h);
      // Lane markings (dashes scrolling)
      ctx.globalAlpha = .18;
      ctx.fillStyle = '#fff';
      const dashW = 50, dashH = 3, gap = 80;
      for(let x = -gap + (offsets[i] % (dashW+gap)); x < W+gap; x += dashW+gap){
        ctx.fillRect(x, y + h/2 - dashH/2, dashW, dashH);
      }
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── PIXEL RUNNERS ── */
(function(){
  const c = document.getElementById('runner-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Simple pixel-art runner drawn with rectangles
  function drawRunner(ctx, x, y, scale, color, frame){
    ctx.save();
    ctx.translate(x, y);
    const s = scale;
    // Legs animation
    const legA = frame%2===0;
    ctx.fillStyle = color;
    // Body
    ctx.fillRect(-s, -s*4, s*2, s*3);
    // Head
    ctx.fillStyle = '#FFCC99';
    ctx.fillRect(-s*.8, -s*5.5, s*1.6, s*1.6);
    // Arms
    ctx.fillStyle = color;
    if(legA){
      ctx.fillRect(-s*2, -s*3.5, s, s*1.5);
      ctx.fillRect(s, -s*2.5, s, s*1.5);
    } else {
      ctx.fillRect(-s*2, -s*2.5, s, s*1.5);
      ctx.fillRect(s, -s*3.5, s, s*1.5);
    }
    // Legs
    ctx.fillStyle = '#3399FF';
    if(legA){
      ctx.fillRect(-s*1.2, -s, s, s*2.5);
      ctx.fillRect(s*.2, 0, s, s*2);
    } else {
      ctx.fillRect(-s*1.2, 0, s, s*2);
      ctx.fillRect(s*.2, -s, s, s*2.5);
    }
    ctx.restore();
  }

  const runners = [
    { x:-60,  y:.65, speed:3.5, scale:7, color:'#EE4422', frame:0 },
    { x:-200, y:.72, speed:3.0, scale:7, color:'#FF88AA', frame:1 },
    { x:-400, y:.79, speed:3.8, scale:7, color:'#FFAA22', frame:0 },
    { x:-100, y:.86, speed:2.8, scale:6, color:'#44AAEE', frame:1 },
  ];

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t++;
    runners.forEach(r=>{
      r.x += r.speed;
      if(r.x > W + 80) r.x = -80;
      if(t % 8 === 0) r.frame = 1-r.frame;
      ctx.globalAlpha = .75;
      ctx.shadowBlur = 8;
      ctx.shadowColor = r.color;
      drawRunner(ctx, r.x, r.y*H, r.scale, r.color, r.frame);
      ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
})();

(function(){
  const c = document.getElementById('score-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  let scrollX = 0;
  const hudText = '  CPU 0758cm/sec   1UP 0645cm/sec   QUALIFY 14sec00   WORLD RECORD 09sec93  ';

  function frame(){
    ctx.clearRect(0,0,W,H);
    scrollX = (scrollX + 1.2) % (W*2);
    ctx.save();
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillStyle = 'rgba(0,238,255,.18)';
    ctx.fillText(hudText.repeat(4), -scrollX + 10, H*.55);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded = false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  }, 800);
}

function goBack(){
  const s = document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display = '';
  setTimeout(()=>s.classList.remove('hidden'), 10);
}

function toggleFS(){
  const el = document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
}

document.addEventListener('keydown', e=>{
  if(e.key==='f'||e.key==='F') toggleFS();
});

function loadEmulator(){
  emuLoaded = true;
  const romBytes = Uint8Array.from(atob(ROM_B64), c=>c.charCodeAt(0));
  const romUrl   = URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes = Uint8Array.from(atob(IMG_B64), c=>c.charCodeAt(0));
  const coverUrl = URL.createObjectURL(new Blob([imgBytes],{type:'image/jpeg'}));

  window.EJS_player          = '#game-container';
  window.EJS_core            = 'fceumm';
  window.EJS_gameUrl         = romUrl;
  window.EJS_gameID          = 'track-field-nes';
  window.EJS_gameName        = 'Track & Field (Konami)';
  window.EJS_coverURL        = coverUrl;
  window.EJS_pathtodata      = 'https://cdn.emulatorjs.org/stable/data/';
