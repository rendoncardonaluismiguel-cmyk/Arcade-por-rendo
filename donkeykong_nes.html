<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donkey Kong Classics — NES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;600;700&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:     #cc1100;
    --red2:    #ff3311;
    --yellow:  #ffcc00;
    --brown:   #8b4513;
    --tan:     #c8860a;
    --steel:   #c0c0c0;
    --dark:    #0a0508;
    --girder:  #dd4422;
  }

  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    image-rendering:pixelated; }

  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .7s ease, transform .7s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.04); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center top;
    filter: brightness(.35) saturate(1.3);
    image-rendering:pixelated;
    z-index:0;
    animation: bgShake 5s ease-in-out infinite;
  }
  @keyframes bgShake {
    0%,88%,100%{ transform:scale(1) translate(0,0); filter:brightness(.35) saturate(1.3); }
    90%{ transform:scale(1.01) translate(-2px,1px); filter:brightness(.48) saturate(1.6); }
    92%{ transform:scale(1.01) translate(2px,-1px); }
    94%{ transform:scale(1.01) translate(-1px,0);   filter:brightness(.35) saturate(1.3); }
  }

  /* pixel scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px
    );
  }

  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 48%, transparent 18%, rgba(10,5,8,.9) 100%),
      linear-gradient(to top, rgba(10,5,8,.98) 0%, transparent 28%),
      linear-gradient(to bottom, rgba(10,5,8,.55) 0%, transparent 18%);
  }

  /* ── CANVASES ── */
  #girder-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #barrel-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui { position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; }

  /* arcade score header */
  .arcade-hdr {
    display:flex; align-items:center; gap:16px; margin-bottom:10px;
    animation:hdrDrop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes hdrDrop { from{transform:translateY(-24px);opacity:0} to{transform:translateY(0);opacity:1} }
  .score-cell {
    background:rgba(0,0,0,.85);
    border:2px solid rgba(255,204,0,.3);
    padding:5px 14px; text-align:center;
  }
  .score-lbl { font-size:.35rem; letter-spacing:.25em; color:rgba(255,255,255,.4); margin-bottom:3px; }
  .score-val { font-size:clamp(.75rem,2.8vw,1.05rem); color:var(--yellow); text-shadow:0 0 8px var(--yellow); }

  /* DK title card */
  .title-card {
    background:rgba(0,0,0,.88);
    border-top:4px solid var(--red);
    border-bottom:4px solid var(--red);
    padding:12px 32px 14px;
    text-align:center;
    box-shadow:0 0 0 1px #000, 0 0 30px rgba(204,17,0,.45), 0 0 70px rgba(204,17,0,.18);
    min-width:min(88vw,420px);
    animation:cardIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.6);opacity:0} to{transform:scaleY(1);opacity:1} }

  .dk-text {
    font-size:clamp(3rem,14vw,7.5rem);
    line-height:.82; letter-spacing:.05em;
    color:var(--red2);
    text-shadow:5px 5px 0 #000, 0 0 25px rgba(255,51,17,.6);
    animation:dkThump 1.6s ease-in-out infinite;
  }
  @keyframes dkThump {
    0%,100%{ text-shadow:5px 5px 0 #000, 0 0 25px rgba(255,51,17,.6); }
    50%    { text-shadow:5px 5px 0 #000, 0 0 50px rgba(255,80,0,1); }
  }

  .donkey {
    font-size:clamp(1rem,4vw,2rem); letter-spacing:.5em;
    color:var(--yellow); text-shadow:3px 3px 0 #000, 0 0 12px rgba(255,204,0,.5);
    line-height:1.1;
  }
  .kong {
    font-size:clamp(2rem,9vw,5rem); letter-spacing:.15em;
    color:#fff; text-shadow:4px 4px 0 var(--red), 0 0 20px rgba(255,51,17,.5);
  }
  .classics-tag {
    font-size:clamp(.4rem,1.4vw,.58rem); letter-spacing:.3em;
    color:var(--steel); margin-top:6px;
    text-shadow:1px 1px 0 #000;
    border:1px solid rgba(192,192,192,.25); padding:3px 10px; display:inline-block;
  }
  .title-sub {
    font-size:.32rem; letter-spacing:.35em;
    color:rgba(255,255,255,.28); margin-top:6px;
    font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase;
  }

  /* lives row */
  .lives-row {
    margin-top:12px; display:flex; align-items:center; gap:6px;
    animation:livesIn .5s .25s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes livesIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .lives-lbl { font-size:.38rem; letter-spacing:.2em; color:rgba(255,255,255,.4); }
  .mario-life { font-size:1.1rem; filter:drop-shadow(0 0 4px rgba(255,80,0,.6)); }

  /* bonus timer */
  .bonus-row {
    margin-top:6px; display:flex; align-items:center; gap:8px;
    font-size:.38rem; color:var(--yellow);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(255,204,0,.55); }
  .bonus-val { text-shadow:0 0 8px var(--yellow); animation:bonusBlink 1s step-start infinite; }
  @keyframes bonusBlink { 50%{opacity:.4} }

  /* play button */
  .play-btn {
    margin-top:14px;
    padding:12px 36px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.08em;
    color:#000; background:var(--yellow);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 var(--tan), -4px 0 0 var(--tan),
      0 4px 0 var(--tan), 0 -4px 0 #ffe566,
      0 0 28px rgba(255,204,0,.45);
    transition:transform .1s;
    position:relative; overflow:hidden;
    animation:btnPop .6s .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-4deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:translateX(-100%); animation:shine 2.5s 1s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(200%)}}
  .play-btn:hover { transform:scale(1.07); box-shadow:4px 0 0 var(--tan),-4px 0 0 var(--tan),0 4px 0 var(--tan),0 -4px 0 #ffe566,0 0 55px rgba(255,204,0,.9); }
  .play-btn:active { transform:scale(.93) translate(2px,2px); }

  /* insert coin */
  .insert-coin {
    margin-top:10px; font-size:.38rem; letter-spacing:.2em;
    color:var(--yellow); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:10px;
    font-family:'Rajdhani',sans-serif; font-size:.7rem;
    letter-spacing:.22em; color:rgba(255,255,255,.24);
    text-align:center; line-height:2;
  }
  .key {
    display:inline-block; border:1px solid rgba(255,204,0,.22);
    border-radius:2px; padding:0 5px;
    color:rgba(255,204,0,.45); margin:0 2px; font-size:.65rem;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }

  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#0a0508,#140808);
    border-bottom:2px solid var(--red);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.7rem; letter-spacing:.06em;
    color:var(--yellow); text-shadow:2px 2px 0 var(--red), 0 0 10px rgba(255,204,0,.5);
  }
  .hdr-btn {
    font-family:'Rajdhani',sans-serif; font-size:.72rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--yellow); border-color:var(--yellow); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Donkey Kong">
  <canvas id="girder-canvas"></canvas>
  <canvas id="barrel-canvas"></canvas>

  <div class="ui">

    <!-- score header -->
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">1UP</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">284600</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">2UP</div>
        <div class="score-val">000000</div>
      </div>
    </div>

    <div class="title-card">
      <div class="donkey">DONKEY</div>
      <div class="dk-text">DK</div>
      <div class="kong">KONG</div>
      <div class="classics-tag">✦ CLASSICS ✦</div>
      <div class="title-sub">Nintendo Entertainment System · 1988</div>
    </div>

    <!-- lives & bonus -->
    <div class="lives-row">
      <span class="lives-lbl">MARIO ×</span>
      <span class="mario-life">🧑</span>
      <span class="mario-life">🧑</span>
      <span class="mario-life">🧑</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">BONUS</span>
      <span class="bonus-val" id="bonus-val">5000</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">←→</span> Mover &nbsp;|&nbsp;
      <span class="key">Z</span> A (saltar) &nbsp;|&nbsp;
      <span class="key">↑↓</span> Escaleras<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp; <span class="key">F</span> Pantalla completa
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🦍 DONKEY KONG CLASSICS</span>
    <span style="font-family:'Rajdhani',sans-serif;font-size:.68rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── SCORE COUNTER ── */
(function(){
  const el = document.getElementById('score1');
  let v=0, target=143200;
  const iv = setInterval(()=>{
    v = Math.min(v + 1800 + Math.floor(Math.random()*800), target);
    el.textContent = String(v).padStart(6,'0');
    if(v>=target) clearInterval(iv);
  }, 30);
})();

/* ── BONUS COUNTDOWN ── */
(function(){
  const el = document.getElementById('bonus-val');
  let v=5000;
  setInterval(()=>{
    v = Math.max(0, v-100);
    el.textContent = v;
    if(v===0) v=5000;
  }, 120);
})();

/* ── GIRDER PLATFORMS (scrolling) ── */
(function(){
  const c = document.getElementById('girder-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const GIRDER_H = 10;
  const platforms = [
    { y:.72, offset:0, speed:.6,  dir:1  },
    { y:.60, offset:80, speed:.5, dir:-1 },
    { y:.48, offset:40, speed:.7, dir:1  },
    { y:.36, offset:20, speed:.5, dir:-1 },
  ];

  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const p of platforms){
      p.offset = (p.offset + p.speed*p.dir + W*2) % (W*2);
      const y = p.y*H;
      const x = (p.dir>0 ? p.offset : W*2-p.offset) % W - W*.1;
      ctx.save();
      ctx.globalAlpha=.2;
      /* girder beam */
      ctx.fillStyle='#dd4422';
      ctx.fillRect(x, y, W*1.2, GIRDER_H);
      /* rivets */
      ctx.fillStyle='#ff6644';
      for(let rx=x+16;rx<x+W*1.2-8;rx+=40){
        ctx.fillRect(rx, y+1, 8, GIRDER_H-2);
      }
      /* shine */
      ctx.fillStyle='rgba(255,200,160,.15)';
      ctx.fillRect(x, y, W*1.2, 3);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── ROLLING BARRELS ── */
(function(){
  const c = document.getElementById('barrel-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  function mkBarrel(){
    const fromTop = Math.random()<.7;
    return {
      x: fromTop ? Math.random()*W*.3 : -60,
      y: fromTop ? -30 : H*.2+Math.random()*H*.4,
      vx: 2.5+Math.random()*3,
      vy: fromTop ? 1.5+Math.random()*2 : (Math.random()-.5)*.8,
      rot: 0,
      rotSpeed: .06+Math.random()*.08,
      r: 16+Math.random()*10,
      alpha:.55+Math.random()*.3,
      bounce: 0,
    };
  }

  const barrels = Array.from({length:8}, ()=>{
    const b=mkBarrel(); b.x=Math.random()*W; b.y=Math.random()*H*.7; return b;
  });

  function drawBarrel(ctx,x,y,r,rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    /* body */
    ctx.fillStyle='#8b4513';
    ctx.beginPath(); ctx.ellipse(0,0,r,r*.7,0,0,Math.PI*2); ctx.fill();
    /* hoops */
    ctx.strokeStyle='#5a2d0c'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.ellipse(0,0,r*.95,r*.65,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,r*.65,r*.45,0,0,Math.PI*2); ctx.stroke();
    /* highlight */
    ctx.fillStyle='rgba(255,180,80,.2)';
    ctx.beginPath(); ctx.ellipse(-r*.2,-r*.2,r*.35,r*.2,-.4,0,Math.PI*2); ctx.fill();
    /* wood slats */
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
    for(let i=0;i<4;i++){
      const a=rot*0+i*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*.1, Math.sin(a)*r*.7);
      ctx.lineTo(Math.cos(a)*r*.1, Math.sin(a)*r*.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    if(barrels.length<12&&Math.random()<.02) barrels.push(mkBarrel());
    for(let i=barrels.length-1;i>=0;i--){
      const b=barrels[i];
      b.x+=b.vx; b.y+=b.vy; b.vy+=.06; b.rot+=b.rotSpeed;
      /* bounce off floor level */
      const floor=H*.75+Math.random()*H*.08;
      if(b.y+b.r>floor){ b.y=floor-b.r; b.vy*=-.55; b.bounce++; }
      if(b.x>W+80||b.bounce>4){ barrels.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha=b.alpha*Math.min((b.x+80)/200,1);
      drawBarrel(ctx,b.x,b.y,b.r,b.rot);
      /* shadow */
      ctx.globalAlpha=b.alpha*.2;
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(b.x,floor+4,b.r*.8,b.r*.2,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },700);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/webp'}));
  window.EJS_player='#game-container';
  window.EJS_core='fceumm';
  window.EJS_gameUrl=romUrl;
  window.EJS_gameID='dkclassics';
  window.EJS_gameName='Donkey Kong Classics';
  window.EJS_coverURL=coverUrl;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color='#ffcc00';
  window.EJS_backgroundColor='#0a0508';
  window.EJS_startOnLoaded=true;
  window.EJS_language='es';
  window.EJS_Buttons={
    playPause:true,restart:true,mute:true,settings:true,
    fullscreen:true,saveState:true,loadState:true,
    screenRecord:false,gamepad:true,cheat:false,
    volume:true,saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
