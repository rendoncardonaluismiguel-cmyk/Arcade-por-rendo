<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-1 Race — Nintendo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:    #CC1111;
    --red2:   #FF3333;
    --pink:   #FF88AA;
    --gray:   #AAAAAA;
    --asphalt:#555566;
    --yellow: #FFDD00;
    --white:  #EEEEFF;
    --cyan:   #00EEFF;
    --dark:   #0A0005;
    --sky:    #FF88AA;
  }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    background:#0A0005; image-rendering:pixelated;
  }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .8s ease, transform .8s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.2) saturate(1.5);
    image-rendering:pixelated; z-index:0;
    animation: bgPulse 4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100%{ filter:brightness(.2) saturate(1.5); }
    50%    { filter:brightness(.3) saturate(1.8); }
  }

  /* CRT */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 4px
    );
  }
  /* Vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 18%, rgba(10,0,5,.95) 100%),
      linear-gradient(to top, rgba(10,0,5,.99) 0%, transparent 34%),
      linear-gradient(to bottom, rgba(10,0,5,.45) 0%, transparent 20%);
  }

  #road-canvas    { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #mountain-canvas{ position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #car-canvas     { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui {
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
  }

  .arcade-hdr {
    display:flex; gap:10px; margin-bottom:8px;
    animation: dropIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes dropIn { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }

  .score-cell {
    background:rgba(10,0,5,.92);
    border:2px solid rgba(204,17,17,.35);
    padding:5px 13px; text-align:center; min-width:88px;
  }
  .score-lbl { font-size:.3rem; letter-spacing:.25em; color:rgba(255,255,255,.38); margin-bottom:4px; }
  .score-val  { font-size:clamp(.65rem,2.4vw,.95rem); color:var(--yellow); text-shadow:0 0 10px var(--yellow); }

  .time-cell {
    background:rgba(10,0,5,.92);
    border:2px solid var(--cyan);
    padding:5px 13px; text-align:center;
    box-shadow:0 0 12px rgba(0,238,255,.2);
  }
  .time-lbl { font-size:.3rem; letter-spacing:.25em; color:var(--cyan); margin-bottom:3px; text-shadow:0 0 6px var(--cyan); }
  .time-val { font-size:clamp(.65rem,2.4vw,.95rem); color:#fff; }

  /* Title card */
  .title-card {
    background:rgba(10,0,5,.93);
    border-top:5px solid var(--red);
    border-bottom:5px solid var(--yellow);
    padding:12px 32px 15px;
    text-align:center;
    box-shadow: 0 0 0 1px #000,
                0 0 40px rgba(204,17,17,.55),
                0 0 80px rgba(255,51,51,.18);
    min-width:min(92vw,480px);
    animation: cardIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.5);opacity:0} to{transform:scaleY(1);opacity:1} }

  .f1-eyebrow {
    font-size:clamp(.28rem,1vw,.42rem);
    letter-spacing:.55em;
    color:var(--cyan);
    text-shadow:0 0 8px var(--cyan);
    margin-bottom:5px;
  }
  .f1-f {
    font-size:clamp(3.5rem,15vw,8rem);
    line-height:.82; letter-spacing:.02em;
    color:var(--red2);
    text-shadow: 6px 6px 0 #700,
                 0 0 30px rgba(255,51,51,.9),
                 0 0 70px rgba(255,51,51,.4);
    animation: titleRev 1.8s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes titleRev {
    0%,100%{ text-shadow:6px 6px 0 #700, 0 0 30px rgba(255,51,51,.9); transform:skewX(0deg); }
    50%    { text-shadow:6px 6px 0 #700, 0 0 60px rgba(255,100,100,1), 0 0 110px rgba(255,51,51,.5); transform:skewX(-3deg); }
  }
  .f1-dash {
    font-size:clamp(2.5rem,10vw,5.5rem);
    color:var(--white); display:inline-block;
    text-shadow:3px 3px 0 #444, 0 0 15px rgba(255,255,255,.4);
    margin:0 6px;
  }
  .f1-one {
    font-size:clamp(3.5rem,15vw,8rem);
    line-height:.82;
    color:var(--yellow);
    text-shadow: 6px 6px 0 #885500,
                 0 0 28px rgba(255,221,0,.9),
                 0 0 65px rgba(255,221,0,.4);
    display:inline-block;
  }
  .f1-race {
    font-size:clamp(1.5rem,7vw,4rem);
    letter-spacing:.12em;
    color:#fff;
    text-shadow:3px 3px 0 #333, 0 0 18px rgba(255,255,255,.3);
    margin-top:2px;
  }
  .f1-sub {
    font-size:clamp(.26rem,1vw,.42rem);
    letter-spacing:.4em;
    color:rgba(255,255,255,.28);
    margin-top:8px;
    border:1px solid rgba(204,17,17,.2);
    padding:3px 12px; display:inline-block;
  }

  /* Lap row */
  .lap-row {
    margin-top:10px; display:flex; align-items:center; gap:8px;
    animation: lapPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes lapPop { from{transform:scale(0) rotate(5deg)} to{transform:scale(1) rotate(0)} }
  .lap-lbl { font-size:.3rem; letter-spacing:.2em; color:rgba(255,255,255,.38); }
  .lap-val { font-size:clamp(.65rem,2.2vw,.9rem); color:var(--cyan); text-shadow:0 0 10px var(--cyan); }

  .bonus-row {
    margin-top:5px; display:flex; align-items:center; gap:8px;
    font-size:.34rem; color:var(--yellow);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(255,221,0,.5); }
  .bonus-val { text-shadow:0 0 8px var(--yellow); animation:blinkAnim 1.2s step-start infinite; }
  @keyframes blinkAnim { 50%{opacity:.3} }

  /* Checkered flag deco */
  .flag-row {
    display:flex; gap:0; margin-top:8px; overflow:hidden; width:min(92vw,480px);
    animation: flagIn .5s .5s both;
  }
  @keyframes flagIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .flag-cell {
    flex:1; height:8px;
  }

  /* Play button */
  .play-btn {
    margin-top:10px;
    padding:13px 38px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.06em;
    color:#fff; background:var(--red);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 #700, -4px 0 0 #700,
      0 4px 0 #700, 0 -4px 0 #ff8888,
      0 0 30px rgba(204,17,17,.55);
    transition:transform .12s;
    position:relative; overflow:hidden;
    animation: btnPop .6s .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-4deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:translateX(-100%); animation:shine 2.6s 1.2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}
  .play-btn:hover { transform:scale(1.08); box-shadow:4px 0 0 #700,-4px 0 0 #700,0 4px 0 #700,0 -4px 0 #ff8888,0 0 60px rgba(255,51,51,1); }
  .play-btn:active { transform:scale(.92) translate(2px,2px); }

  .insert-coin {
    margin-top:9px; font-size:.34rem; letter-spacing:.2em;
    color:var(--yellow); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:9px;
    font-family:'Orbitron',sans-serif; font-size:.65rem;
    letter-spacing:.18em; color:rgba(255,255,255,.2);
    text-align:center; line-height:2.2;
  }
  .key {
    display:inline-block; border:1px solid rgba(204,17,17,.25);
    border-radius:2px; padding:0 5px;
    color:rgba(255,80,80,.4); margin:0 2px; font-size:.6rem;
    font-family:'Press Start 2P',monospace;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#0A0005;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }
  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#0A0005,#150008);
    border-bottom:2px solid var(--red);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.68rem; letter-spacing:.05em;
    color:var(--red2); text-shadow:2px 2px 0 #700, 0 0 10px rgba(255,51,51,.5);
  }
  .hdr-btn {
    font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--yellow); border-color:var(--yellow); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="F-1 Race">
  <canvas id="road-canvas"></canvas>
  <canvas id="mountain-canvas"></canvas>
  <canvas id="car-canvas"></canvas>

  <div class="ui">
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">SCORE</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="time-cell">
        <div class="time-lbl">TIME</div>
        <div class="time-val" id="time-val">43</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">099900</div>
      </div>
    </div>

    <div class="title-card">
      <div class="f1-eyebrow">✦ NINTENDO · 1984 ✦</div>
      <div>
        <span class="f1-f">F</span>
        <span class="f1-dash">-</span>
        <span class="f1-one">1</span>
      </div>
      <div class="f1-race">RACE</div>
      <div class="f1-sub">NES ARCADE CLASSIC</div>
    </div>

    <!-- Checkered flag -->
    <div class="flag-row" id="flag-row"></div>

    <div class="lap-row">
      <span class="lap-lbl">LAP</span>
      <span class="lap-val" id="lap-val">1 / 5</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">SPEED</span>
      <span class="bonus-val" id="speed-val">220 km/h</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">←→</span> Girar &nbsp;|&nbsp;
      <span class="key">Z</span> Acelerar &nbsp;|&nbsp;
      <span class="key">X</span> Frenar<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp;
      <span class="key">F</span> Fullscreen &nbsp;|&nbsp;
      <span class="key">Esc</span> Volver
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🏎️ F-1 RACE</span>
    <span style="font-family:'Orbitron',sans-serif;font-size:.6rem;color:rgba(255,255,255,.22);letter-spacing:.15em;">NINTENDO · NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── PSEUDO-3D ROAD ── */
(function(){
  const c = document.getElementById('road-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  let offset=0, horizShift=0, t=0;

  // Segment colors alternating like F-1 Race
  const SEG_H = 6;
  const SEGS = 60;

  function frame(){
    ctx.clearRect(0,0,W,H);
    t += .025;
    offset = (offset + 3) % (SEG_H * 2);
    horizShift = Math.sin(t) * W * .08; // gentle curve

    const horizon = H * .42;
    const roadW_horizon = W * .12;
    const roadW_bottom  = W * .65;

    // Sky gradient (pink/red like the game)
    const skyGrad = ctx.createLinearGradient(0,0,0,horizon);
    skyGrad.addColorStop(0,'rgba(220,60,80,.18)');
    skyGrad.addColorStop(1,'rgba(120,20,30,.08)');
    ctx.globalAlpha=.35;
    ctx.fillStyle=skyGrad;
    ctx.fillRect(0,0,W,horizon);
    ctx.globalAlpha=1;

    // Road segments
    for(let s=0;s<SEGS;s++){
      const t0 = s/SEGS;
      const t1 = (s+1)/SEGS;
      const y0 = horizon + (H - horizon) * t0;
      const y1 = horizon + (H - horizon) * t1;
      const w0 = roadW_horizon + (roadW_bottom - roadW_horizon) * t0;
      const w1 = roadW_horizon + (roadW_bottom - roadW_horizon) * t1;
      const cx0 = W/2 + horizShift * t0;
      const cx1 = W/2 + horizShift * t1;

      const segIdx = Math.floor((s + Math.floor(offset / SEG_H))) % 2;
      ctx.globalAlpha = .22;
      ctx.fillStyle = segIdx===0 ? '#666677' : '#555566';
      ctx.beginPath();
      ctx.moveTo(cx0 - w0/2, y0);
      ctx.lineTo(cx0 + w0/2, y0);
      ctx.lineTo(cx1 + w1/2, y1);
      ctx.lineTo(cx1 - w1/2, y1);
      ctx.closePath();
      ctx.fill();

      // Rumble strips (red & white alternating at edges)
      if(s%4<2){
        ctx.globalAlpha=.18;
        ctx.fillStyle='#CC1111';
        ctx.fillRect(cx0-w0/2-12, y0, 12, y1-y0+1);
        ctx.fillRect(cx0+w0/2,    y0, 12, y1-y0+1);
      }

      // Center dashed line
      if(s%4===0){
        ctx.globalAlpha=.15;
        ctx.fillStyle='#fff';
        const mw=3, mx=cx0-mw/2;
        ctx.fillRect(mx, y0, mw, y1-y0);
      }
    }

    // Road edges solid lines
    ctx.globalAlpha=.2;
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(W/2+horizShift*0 - roadW_horizon/2, horizon);
    ctx.lineTo(W/2+horizShift   - roadW_bottom/2,  H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W/2+horizShift*0 + roadW_horizon/2, horizon);
    ctx.lineTo(W/2+horizShift   + roadW_bottom/2,  H);
    ctx.stroke();

    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── MOUNTAINS ── */
(function(){
  const c = document.getElementById('mountain-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  let scrollX=0;
  const horizon = () => H * .42;

  // Build mountain silhouette points
  function buildMountains(seed, count, amp, base){
    const pts=[];
    let x=0;
    for(let i=0;i<=count;i++){
      const px = (i/count)*W*2.5;
      const py = base - Math.abs(Math.sin(i*seed+seed)*amp) - Math.abs(Math.sin(i*seed*1.7)*amp*.5);
      pts.push([px,py]);
    }
    return pts;
  }
  const mtn1 = buildMountains(1.3, 18, 80, 0);
  const mtn2 = buildMountains(2.1, 22, 55, 15);

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t+=.008;
    scrollX = (scrollX + .5) % (W*1.2);
    const h = horizon();

    function drawMtnLayer(pts, color, alpha, scrollFactor){
      ctx.globalAlpha=alpha;
      ctx.fillStyle=color;
      ctx.beginPath();
      const ox = -(scrollX*scrollFactor) % (W*1.5);
      ctx.moveTo(ox, h);
      for(const [px,py] of pts){
        ctx.lineTo(ox+px, h+py);
      }
      ctx.lineTo(ox+W*2.5, h);
      ctx.closePath();
      ctx.fill();
      // Second repeat
      ctx.beginPath();
      const ox2 = ox + W*1.5;
      ctx.moveTo(ox2, h);
      for(const [px,py] of pts){
        ctx.lineTo(ox2+px, h+py);
      }
      ctx.lineTo(ox2+W*2.5, h);
      ctx.closePath();
      ctx.fill();
    }

    drawMtnLayer(mtn1,'#CC1111',.18, 1.2);
    drawMtnLayer(mtn2,'#991111',.14, .8);
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── F1 CARS ── */
(function(){
  const c = document.getElementById('car-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const horizon = () => H * .42;

  function drawF1Car(ctx, x, y, scale, color, noseCone){
    ctx.save();
    ctx.translate(x,y);
    const s=scale;
    // Main body
    ctx.fillStyle=color;
    ctx.shadowBlur=10; ctx.shadowColor=color;
    // Cockpit pod
    ctx.fillRect(-s*1.5,-s*1,s*3,s*2.2);
    // Nose cone (narrow front)
    ctx.fillStyle=noseCone||'#ffffff';
    ctx.beginPath();
    ctx.moveTo(-s*.5,-s*1);
    ctx.lineTo(s*.5,-s*1);
    ctx.lineTo(s*.3,-s*3.5);
    ctx.lineTo(-s*.3,-s*3.5);
    ctx.closePath();
    ctx.fill();
    // Front wing
    ctx.fillStyle='#333';
    ctx.fillRect(-s*2,-s*3.5,s*4,s*.5);
    // Rear wing
    ctx.fillRect(-s*1.8,s*.8,s*3.6,s*.5);
    // Cockpit
    ctx.fillStyle='rgba(0,200,255,.5)';
    ctx.fillRect(-s*.7,-s*.8,s*1.4,s*1.4);
    // Wheels
    ctx.fillStyle='#222';
    ctx.shadowBlur=0;
    ctx.fillRect(-s*2.2,-s*.5,s*.7,s*1.4);
    ctx.fillRect(s*1.5,-s*.5,s*.7,s*1.4);
    ctx.fillRect(-s*2.2,s*1.5,s*.7,s*1.4);
    ctx.fillRect(s*1.5,s*1.5,s*.7,s*1.4);
    // Wheel shine
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.fillRect(-s*2.1,-s*.3,s*.5,s*.5);
    ctx.fillRect(s*1.6,-s*.3,s*.5,s*.5);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  const COLORS=[
    {body:'#DD1111',nose:'#ffffff'},
    {body:'#1166DD',nose:'#ffff00'},
    {body:'#11AA33',nose:'#ffffff'},
    {body:'#DD8811',nose:'#ffffff'},
    {body:'#CC11CC',nose:'#88ff88'},
  ];

  // NPC cars approaching from horizon
  function mkCar(){
    const idx=Math.floor(Math.random()*COLORS.length);
    return {
      progress: Math.random(), // 0=horizon, 1=bottom
      lane: (Math.random()-.5)*.3,
      speed: .003+Math.random()*.004,
      color: COLORS[idx],
    };
  }
  const cars=Array.from({length:6},()=>mkCar());

  // Player car
  const player={wobble:0,wobbleV:.05};

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t++;

    const h=horizon();
    const roadW_horizon=W*.12, roadW_bottom=W*.65;

    // Sort cars by progress (further first)
    cars.sort((a,b)=>a.progress-b.progress);

    for(let i=cars.length-1;i>=0;i--){
      const car=cars[i];
      car.progress+=car.speed;
      if(car.progress>1.05){ cars.splice(i,1); cars.push(mkCar()); continue; }

      const p=car.progress;
      const cw=roadW_horizon+(roadW_bottom-roadW_horizon)*p;
      const cx=W/2+car.lane*cw;
      const cy=h+(H-h)*p;
      const scale=2+p*8;

      ctx.globalAlpha=Math.min(1,p*3);
      ctx.shadowBlur=scale*2; ctx.shadowColor=car.color.body;
      drawF1Car(ctx,cx,cy,scale,car.color.body,car.color.nose);
      ctx.shadowBlur=0;
    }

    // Player car at bottom center
    player.wobble+=player.wobbleV;
    const pw=Math.sin(player.wobble)*4;
    ctx.globalAlpha=.9;
    ctx.shadowBlur=20; ctx.shadowColor='#FF3333';
    drawF1Car(ctx, W/2+pw, H*.85, 14, '#FF1111','#ffffff');
    ctx.shadowBlur=0;

    // Exhaust sparks
    for(let i=0;i<3;i++){
      ctx.globalAlpha=.3+Math.random()*.2;
      ctx.fillStyle=`hsl(${20+Math.random()*30},100%,${50+Math.random()*30}%)`;
      const sx=W/2+pw+(Math.random()-.5)*8;
      const sy=H*.85+14+Math.random()*12;
      ctx.beginPath(); ctx.arc(sx,sy,1.5+Math.random()*2,0,Math.PI*2); ctx.fill();
    }

    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },800);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
document.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') toggleFS(); });

function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/png'}));

  window.EJS_player          = '#game-container';
  window.EJS_core            = 'fceumm';
  window.EJS_gameUrl         = romUrl;
  window.EJS_gameID          = 'f1-race-nes';
  window.EJS_gameName        = 'F-1 Race';
  window.EJS_coverURL        = coverUrl;
  window.EJS_pathtodata      = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color           = '#CC1111';
  window.EJS_backgroundColor = '#0A0005';
  window.EJS_startOnLoaded   = true;
  window.EJS_language        = 'es';
  window.EJS_Buttons = {
    playPause:true, restart:true, mute:true, settings:true,
    fullscreen:true, saveState:true, loadState:true,
    screenRecord:false, gamepad:true, cheat:false,
    volume:true, saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
