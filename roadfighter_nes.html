<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Fighter — Konami</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --green:  #2EAA2E;
    --green2: #44DD44;
    --gray:   #888;
    --road:   #555;
    --red:    #DD2222;
    --red2:   #FF4444;
    --cyan:   #00EEFF;
    --yellow: #FFD700;
    --dark:   #050808;
  }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    background:#050808; image-rendering:pixelated;
  }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .8s ease, transform .8s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.25) saturate(1.3);
    image-rendering:pixelated; z-index:0;
    animation: bgPulse 4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100%{ filter:brightness(.25) saturate(1.3); }
    50%    { filter:brightness(.34) saturate(1.6); }
  }

  /* CRT scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.16) 2px, rgba(0,0,0,.16) 4px
    );
  }
  /* Vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 18%, rgba(5,8,8,.94) 100%),
      linear-gradient(to top, rgba(5,8,8,.99) 0%, transparent 32%),
      linear-gradient(to bottom, rgba(5,8,8,.5) 0%, transparent 20%);
  }

  #road-canvas   { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #car-canvas    { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #speed-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui {
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
  }

  .arcade-hdr {
    display:flex; gap:10px; margin-bottom:8px;
    animation: dropIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes dropIn { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }

  .score-cell {
    background:rgba(0,0,0,.9);
    border:2px solid rgba(46,170,46,.35);
    padding:5px 13px; text-align:center; min-width:88px;
  }
  .score-lbl { font-size:.3rem; letter-spacing:.25em; color:rgba(255,255,255,.38); margin-bottom:4px; }
  .score-val  { font-size:clamp(.65rem,2.4vw,.95rem); color:var(--green2); text-shadow:0 0 10px var(--green2); }

  .fuel-cell {
    background:rgba(0,0,0,.9);
    border:2px solid var(--red);
    padding:5px 13px; text-align:center;
    box-shadow:0 0 12px rgba(221,34,34,.3);
  }
  .fuel-lbl { font-size:.3rem; letter-spacing:.25em; color:var(--red2); margin-bottom:3px; text-shadow:0 0 6px var(--red2); }
  .fuel-val  { font-size:clamp(.65rem,2.4vw,.95rem); color:#fff; }
  .fuel-bar  { margin-top:3px; height:5px; background:rgba(255,255,255,.1); width:100%; }
  .fuel-fill { height:100%; background:var(--red2); box-shadow:0 0 6px var(--red2); transition:width .3s; animation:fuelAnim 2s ease-in-out infinite; }
  @keyframes fuelAnim { 0%,100%{width:62%} 50%{width:48%} }

  /* Title card */
  .title-card {
    background:rgba(0,0,0,.93);
    border-top:4px solid var(--green);
    border-bottom:4px solid var(--green);
    padding:14px 32px 16px;
    text-align:center;
    box-shadow: 0 0 0 1px #000,
                0 0 40px rgba(46,170,46,.45),
                0 0 80px rgba(68,221,68,.15);
    min-width:min(92vw,480px);
    animation: cardIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.5);opacity:0} to{transform:scaleY(1);opacity:1} }

  .rf-eyebrow {
    font-size:clamp(.28rem,1vw,.42rem);
    letter-spacing:.55em;
    color:var(--cyan);
    text-shadow:0 0 8px var(--cyan);
    margin-bottom:6px;
  }
  .rf-road {
    font-size:clamp(2.5rem,11vw,6rem);
    line-height:.88; letter-spacing:.06em;
    color:#fff;
    text-shadow: 4px 4px 0 var(--green),
                 0 0 25px rgba(46,170,46,.8),
                 0 0 60px rgba(68,221,68,.3);
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100%{ text-shadow:4px 4px 0 var(--green), 0 0 25px rgba(46,170,46,.8); }
    50%    { text-shadow:4px 4px 0 var(--green), 0 0 50px rgba(68,221,68,1), 0 0 100px rgba(68,221,68,.4); }
  }
  .rf-fighter {
    font-size:clamp(2.5rem,11vw,6rem);
    line-height:.88; letter-spacing:.06em;
    color:var(--red2);
    text-shadow: 4px 4px 0 #800,
                 0 0 22px rgba(221,34,34,.8);
  }
  .rf-sub {
    font-size:clamp(.26rem,1vw,.42rem);
    letter-spacing:.4em;
    color:rgba(255,255,255,.28);
    margin-top:8px;
    border:1px solid rgba(255,255,255,.1);
    padding:3px 12px; display:inline-block;
  }

  /* Speed row */
  .speed-row {
    margin-top:10px; display:flex; align-items:center; gap:8px;
    animation: speedPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes speedPop { from{transform:scale(0)} to{transform:scale(1)} }
  .speed-lbl { font-size:.3rem; letter-spacing:.2em; color:rgba(255,255,255,.38); }
  .speed-val { font-size:clamp(.65rem,2.2vw,.9rem); color:var(--cyan); text-shadow:0 0 10px var(--cyan); animation:speedBlink 1.4s step-start infinite; }
  @keyframes speedBlink { 70%{opacity:.5} }

  .bonus-row {
    margin-top:5px; display:flex; align-items:center; gap:8px;
    font-size:.34rem; color:var(--yellow);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(255,215,0,.5); }
  .bonus-val { text-shadow:0 0 8px var(--yellow); }

  /* Play button */
  .play-btn {
    margin-top:14px;
    padding:13px 38px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.06em;
    color:#000; background:var(--green2);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 #1a661a, -4px 0 0 #1a661a,
      0 4px 0 #1a661a, 0 -4px 0 #88ff88,
      0 0 30px rgba(46,170,46,.5);
    transition:transform .12s;
    position:relative; overflow:hidden;
    animation: btnPop .6s .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-4deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:translateX(-100%); animation:shine 2.6s 1.2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}
  .play-btn:hover { transform:scale(1.08); box-shadow:4px 0 0 #1a661a,-4px 0 0 #1a661a,0 4px 0 #1a661a,0 -4px 0 #88ff88,0 0 60px rgba(46,170,46,1); }
  .play-btn:active { transform:scale(.92) translate(2px,2px); }

  .insert-coin {
    margin-top:9px; font-size:.34rem; letter-spacing:.2em;
    color:var(--green2); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:9px;
    font-family:'Orbitron',sans-serif; font-size:.65rem;
    letter-spacing:.18em; color:rgba(255,255,255,.2);
    text-align:center; line-height:2.2;
  }
  .key {
    display:inline-block; border:1px solid rgba(46,170,46,.25);
    border-radius:2px; padding:0 5px;
    color:rgba(68,221,68,.4); margin:0 2px; font-size:.6rem;
    font-family:'Press Start 2P',monospace;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#050808;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }
  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#050808,#080d08);
    border-bottom:2px solid var(--green);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.68rem; letter-spacing:.05em;
    color:var(--green2); text-shadow:2px 2px 0 #1a661a, 0 0 10px rgba(46,170,46,.5);
  }
  .hdr-btn {
    font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--green2); border-color:var(--green2); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Road Fighter">
  <canvas id="road-canvas"></canvas>
  <canvas id="car-canvas"></canvas>
  <canvas id="speed-canvas"></canvas>

  <div class="ui">
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">1P</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="fuel-cell">
        <div class="fuel-lbl">FUEL</div>
        <div class="fuel-val" id="fuel-val">050</div>
        <div class="fuel-bar"><div class="fuel-fill" id="fuel-fill"></div></div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">099550</div>
      </div>
    </div>

    <div class="title-card">
      <div class="rf-eyebrow">✦ KONAMI · 1984 ✦</div>
      <div class="rf-road">ROAD</div>
      <div class="rf-fighter">FIGHTER</div>
      <div class="rf-sub">NES ARCADE CLASSIC</div>
    </div>

    <div class="speed-row">
      <span class="speed-lbl">SPEED</span>
      <span class="speed-val" id="speed-val">400 km/h</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">STAGE</span>
      <span class="bonus-val" id="stage-val">1</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">←→</span> Mover &nbsp;|&nbsp;
      <span class="key">Z</span> Acelerar &nbsp;|&nbsp;
      <span class="key">X</span> Frenar<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp;
      <span class="key">F</span> Fullscreen &nbsp;|&nbsp;
      <span class="key">Esc</span> Volver
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🚗 ROAD FIGHTER</span>
    <span style="font-family:'Orbitron',sans-serif;font-size:.6rem;color:rgba(255,255,255,.22);letter-spacing:.15em;">KONAMI · NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── SCROLLING ROAD ── */
(function(){
  const c = document.getElementById('road-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  let dashOffset = 0;
  const ROAD_W = .38; // fraction of width
  const ROAD_X = (1 - ROAD_W) / 2;

  function frame(){
    ctx.clearRect(0,0,W,H);
    dashOffset = (dashOffset + 4) % 60;

    const rx = ROAD_X * W;
    const rw = ROAD_W * W;

    // Road surface
    ctx.globalAlpha = .13;
    ctx.fillStyle = '#666';
    ctx.fillRect(rx, 0, rw, H);

    // Center dashes
    ctx.globalAlpha = .2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.setLineDash([30, 30]);
    ctx.lineDashOffset = -dashOffset;
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Road edges
    ctx.globalAlpha = .25;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rx, 0); ctx.lineTo(rx, H);
    ctx.moveTo(rx+rw, 0); ctx.lineTo(rx+rw, H);
    ctx.stroke();

    // Green verges
    ctx.globalAlpha = .1;
    ctx.fillStyle = '#2EAA2E';
    ctx.fillRect(0, 0, rx, H);
    ctx.fillRect(rx+rw, 0, W-(rx+rw), H);

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── PIXEL CARS ── */
(function(){
  const c = document.getElementById('car-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const ROAD_W = .38;
  const ROAD_X = (1 - ROAD_W) / 2;

  const CAR_COLORS = ['#FF3333','#00CCFF','#FFFFFF','#FFAA00','#FF88FF'];

  function mkCar(){
    const laneCount = 3;
    const lane = Math.floor(Math.random() * laneCount);
    const rx = ROAD_X;
    const rw = ROAD_W;
    const laneW = rw / laneCount;
    return {
      x: 0, // set below
      y: -60,
      vy: 2.5 + Math.random() * 2.5,
      lane,
      color: CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)],
      w: 20, h: 32,
    };
  }

  function setLaneX(car){
    const rx = ROAD_X * W;
    const rw = ROAD_W * W;
    const laneW = rw / 3;
    car.x = rx + car.lane * laneW + laneW/2;
  }

  const cars = Array.from({length:5},()=>{
    const car = mkCar();
    car.y = Math.random() * (window.innerHeight||600);
    setLaneX(car);
    return car;
  });

  // Player car (bottom)
  const player = { x:0, y:0, w:22, h:36, wobble:0, wobbleV:.04 };

  function drawCar(ctx, x, y, w, h, color, isPlayer){
    ctx.save();
    ctx.translate(x, y);
    // Body
    ctx.fillStyle = color;
    ctx.shadowBlur = 10; ctx.shadowColor = color;
    ctx.fillRect(-w/2, -h/2, w, h);
    ctx.shadowBlur = 0;
    // Windshield
    ctx.fillStyle = 'rgba(150,220,255,.7)';
    ctx.fillRect(-w/2+3, -h/2+4, w-6, h*.28);
    // Rear window
    ctx.fillStyle = 'rgba(150,220,255,.5)';
    ctx.fillRect(-w/2+3, h/2-h*.25, w-6, h*.18);
    // Wheels
    ctx.fillStyle = '#222';
    ctx.fillRect(-w/2-3, -h/2+4, 5, 10);
    ctx.fillRect(w/2-2,  -h/2+4, 5, 10);
    ctx.fillRect(-w/2-3, h/2-14, 5, 10);
    ctx.fillRect(w/2-2,  h/2-14, 5, 10);
    if(isPlayer){
      // Headlights
      ctx.fillStyle = 'rgba(255,255,200,.9)';
      ctx.beginPath(); ctx.arc(-w/2+4, -h/2, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( w/2-4, -h/2, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t++;

    // Spawn
    if(t%55===0 && cars.length<8){
      const car = mkCar(); setLaneX(car); cars.push(car);
    }

    // NPC cars
    for(let i=cars.length-1;i>=0;i--){
      const car=cars[i];
      setLaneX(car); // recompute on resize
      car.y += car.vy;
      if(car.y > H+60){ cars.splice(i,1); continue; }
      ctx.globalAlpha = .7;
      drawCar(ctx, car.x, car.y, car.w, car.h, car.color, false);
    }

    // Player car
    player.x = W/2;
    player.y = H * .82;
    player.wobble += player.wobbleV;
    const wOff = Math.sin(player.wobble) * 1.5;
    ctx.globalAlpha = .85;
    drawCar(ctx, player.x + wOff, player.y, player.w, player.h, '#FF3333', true);

    // Speed lines
    ctx.globalAlpha = .06;
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    for(let i=0;i<6;i++){
      const lx = (W*.38 + W*.1*i);
      const ly = ((t*3 + i*80) % (H+80)) - 40;
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+30); ctx.stroke();
    }

    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

(function(){
  const c = document.getElementById('speed-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Scrolling km/h HUD text
  let scrollX = 0;
  const hudText = '  400 km/h  ◆  STAGE 1  ◆  FUEL 050  ◆  1P 009550  ◆  ROAD FIGHTER  ◆  KONAMI 1984  ◆  ';

  function frame(){
    ctx.clearRect(0,0,W,H);
    scrollX = (scrollX + 1.4) % (W * 2.5);
    ctx.save();
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillStyle = 'rgba(46,170,46,.14)';
    ctx.fillText(hudText.repeat(3), -scrollX + 10, H * .53);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded = false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  }, 800);
}
function goBack(){
  const s = document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
document.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') toggleFS(); });

function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/png'}));

  window.EJS_player          = '#game-container';
  window.EJS_core            = 'fceumm';
  window.EJS_gameUrl         = romUrl;
  window.EJS_gameID          = 'road-fighter-nes';
  window.EJS_gameName        = 'Road Fighter (Konami)';
  window.EJS_coverURL        = coverUrl;
  window.EJS_pathtodata      = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color           = '#2EAA2E';
  window.EJS_backgroundColor = '#050808';
  window.EJS_startOnLoaded   = true;
  window.EJS_language        = 'es';
  window.EJS_Buttons = {
    playPause:true, restart:true, mute:true, settings:true,
    fullscreen:true, saveState:true, loadState:true,
    screenRecord:false, gamepad:true, cheat:false,
    volume:true, saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
