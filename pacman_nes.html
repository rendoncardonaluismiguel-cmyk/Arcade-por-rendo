<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man — Namco</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --yellow:  #FFE000;
    --yellow2: #FFD700;
    --yellow3: #FFA500;
    --blue:    #0033FF;
    --blue2:   #001AFF;
    --cyan:    #00FFFF;
    --pink:    #FFB8FF;
    --red:     #FF0000;
    --orange:  #FFB852;
    --dark:    #000010;
    --ghost1:  #FFB8FF; /* Pinky */
    --ghost2:  #00FFDE; /* Inky */
    --ghost3:  #FFB852; /* Clyde */
  }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    background:#000010;
    image-rendering:pixelated;
  }

  /* ─── SPLASH ─── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .8s ease, transform .8s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }

  /* Cover image background */
  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center top;
    filter: brightness(.28) saturate(1.5) hue-rotate(-5deg);
    image-rendering:auto;
    z-index:0;
    animation: bgPulse 4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100%{ filter:brightness(.28) saturate(1.5); }
    50%    { filter:brightness(.36) saturate(1.8); }
  }

  /* CRT scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 4px
    );
  }

  /* Vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(0,0,16,.92) 100%),
      linear-gradient(to top, rgba(0,0,16,.99) 0%, transparent 30%),
      linear-gradient(to bottom, rgba(0,0,16,.6) 0%, transparent 20%);
  }

  /* Maze canvas */
  #maze-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  /* Dots canvas */
  #dots-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  /* Ghost canvas */
  #ghost-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  /* Pacman canvas */
  #pac-canvas   { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ─── UI ─── */
  .ui {
    position:relative; z-index:3;
    display:flex; flex-direction:column;
    align-items:center; gap:0;
  }

  /* Score row */
  .arcade-hdr {
    display:flex; gap:12px; margin-bottom:8px;
    animation: dropIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes dropIn { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }
  .score-cell {
    background:rgba(0,0,16,.9);
    border:2px solid rgba(255,224,0,.3);
    padding:5px 14px; text-align:center; min-width:90px;
  }
  .score-lbl { font-size:.32rem; letter-spacing:.25em; color:rgba(255,255,255,.4); margin-bottom:4px; }
  .score-val { font-size:clamp(.7rem,2.6vw,1rem); color:var(--yellow); text-shadow:0 0 10px var(--yellow2); }

  /* Title card */
  .title-card {
    background:rgba(0,0,16,.92);
    border-top:4px solid var(--yellow);
    border-bottom:4px solid var(--yellow);
    padding:14px 36px 16px;
    text-align:center;
    box-shadow: 0 0 0 1px #000,
                0 0 35px rgba(255,224,0,.5),
                0 0 80px rgba(255,180,0,.2);
    min-width:min(90vw,440px);
    animation: cardIn .6s .12s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.5);opacity:0} to{transform:scaleY(1);opacity:1} }

  .pac-title {
    font-size:clamp(3.2rem,13vw,7rem);
    line-height:.85;
    letter-spacing:.04em;
    color:var(--yellow);
    text-shadow: 5px 5px 0 #a07000,
                 0 0 20px rgba(255,224,0,.7),
                 0 0 50px rgba(255,180,0,.4);
    animation: titlePulse 1.8s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100%{ text-shadow:5px 5px 0 #a07000, 0 0 20px rgba(255,224,0,.7), 0 0 50px rgba(255,180,0,.4); }
    50%    { text-shadow:5px 5px 0 #a07000, 0 0 40px rgba(255,224,0,1),   0 0 90px rgba(255,200,0,.7); }
  }

  .pac-sub {
    font-size:clamp(.5rem,2vw,.85rem);
    letter-spacing:.35em;
    color:var(--cyan);
    text-shadow:0 0 10px var(--cyan);
    margin-top:6px;
  }
  .pac-namco {
    font-size:clamp(.32rem,1.2vw,.5rem);
    letter-spacing:.5em;
    color:rgba(255,255,255,.3);
    margin-top:5px;
    border:1px solid rgba(255,255,255,.15);
    padding:3px 12px;
    display:inline-block;
  }

  /* Lives */
  .lives-row {
    margin-top:10px; display:flex; align-items:center; gap:4px;
    animation: livesPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes livesPop { from{transform:scale(0)} to{transform:scale(1)} }
  .lives-lbl { font-size:.34rem; letter-spacing:.2em; color:rgba(255,255,255,.4); }
  .life-icon { font-size:1.2rem; filter:drop-shadow(0 0 5px rgba(255,224,0,.8)); }

  /* Score countdown */
  .bonus-row {
    margin-top:5px; display:flex; align-items:center; gap:8px;
    font-size:.36rem; color:var(--cyan);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(0,255,255,.5); }
  .bonus-val { text-shadow:0 0 8px var(--cyan); animation:bonusBlink 1s step-start infinite; }
  @keyframes bonusBlink { 50%{opacity:.3} }

  /* Play button */
  .play-btn {
    margin-top:14px;
    padding:13px 40px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.08em;
    color:#000; background:var(--yellow);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 #b89800, -4px 0 0 #b89800,
      0 4px 0 #b89800, 0 -4px 0 #ffe866,
      0 0 30px rgba(255,224,0,.5);
    transition:transform .12s;
    position:relative; overflow:hidden;
    animation: btnPop .6s .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-5deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:translateX(-100%); animation:shine 2.8s 1.2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}
  .play-btn:hover { transform:scale(1.08); box-shadow:4px 0 0 #b89800,-4px 0 0 #b89800,0 4px 0 #b89800,0 -4px 0 #ffe866,0 0 60px rgba(255,224,0,1); }
  .play-btn:active { transform:scale(.92) translate(2px,2px); }

  /* Insert coin */
  .insert-coin {
    margin-top:10px; font-size:.36rem; letter-spacing:.2em;
    color:var(--yellow); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  /* Controls */
  .controls-hint {
    margin-top:10px;
    font-family:'Orbitron',sans-serif; font-size:.65rem;
    letter-spacing:.2em; color:rgba(255,255,255,.22);
    text-align:center; line-height:2.2;
  }
  .key {
    display:inline-block; border:1px solid rgba(255,224,0,.2);
    border-radius:2px; padding:0 5px;
    color:rgba(255,224,0,.4); margin:0 2px; font-size:.6rem;
  }

  /* ─── EMULATOR ─── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000010;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }

  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#000010,#000820);
    border-bottom:2px solid var(--yellow);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.68rem; letter-spacing:.06em;
    color:var(--yellow); text-shadow:2px 2px 0 #a07000, 0 0 10px rgba(255,224,0,.5);
  }
  .hdr-btn {
    font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--yellow); border-color:var(--yellow); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Pac-Man">
  <canvas id="maze-canvas"></canvas>
  <canvas id="dots-canvas"></canvas>
  <canvas id="ghost-canvas"></canvas>
  <canvas id="pac-canvas"></canvas>

  <div class="ui">
    <!-- Score row -->
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">1UP</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">999999</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">2UP</div>
        <div class="score-val">000000</div>
      </div>
    </div>

    <!-- Title -->
    <div class="title-card">
      <div class="pac-title">PAC-MAN</div>
      <div class="pac-sub">⬤ NAMCO ⬤</div>
      <div class="pac-namco">✦ ARCADE CLASSIC ✦ 1980</div>
    </div>

    <!-- Lives & Bonus -->
    <div class="lives-row">
      <span class="lives-lbl">LIVES ×</span>
      <span class="life-icon">🟡</span>
      <span class="life-icon">🟡</span>
      <span class="life-icon">🟡</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">BONUS</span>
      <span class="bonus-val" id="bonus-val">10000</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">↑↓←→</span> Mover &nbsp;|&nbsp;
      <span class="key">Z</span> A &nbsp;|&nbsp;
      <span class="key">X</span> B<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp;
      <span class="key">F</span> Fullscreen &nbsp;|&nbsp;
      <span class="key">Esc</span> Volver
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🟡 PAC-MAN</span>
    <span style="font-family:'Orbitron',sans-serif;font-size:.65rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">NAMCO · SNES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── MAZE LINES (subtle scrolling) ── */
(function(){
  const c = document.getElementById('maze-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Simple maze-like horizontal corridors
  const corridors = [
    { y:.18, xStart:-.05, width:.5,  speed:.4,  dir: 1 },
    { y:.25, xStart:.55, width:.5,   speed:.35, dir:-1 },
    { y:.40, xStart:-.1, width:.55,  speed:.5,  dir: 1 },
    { y:.55, xStart:.5,  width:.5,   speed:.4,  dir:-1 },
    { y:.70, xStart:-.05,width:.48,  speed:.45, dir: 1 },
    { y:.82, xStart:.52, width:.5,   speed:.38, dir:-1 },
  ];

  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha = .12;
    ctx.strokeStyle = '#0044ff';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#0066ff';

    for(const co of corridors){
      co.xStart = ((co.xStart + co.speed * co.dir * .001) + 2) % 2 - 1;
      const x = co.xStart * W;
      const w = co.width * W;
      const y = co.y * H;
      // Draw corridor wall
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.stroke();
      // Bottom wall with gap
      ctx.beginPath();
      ctx.moveTo(x, y + 22);
      ctx.lineTo(x + w * .35, y + 22);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w * .55, y + 22);
      ctx.lineTo(x + w, y + 22);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── DOTS TRAIL ── */
(function(){
  const c = document.getElementById('dots-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Static dot grid (background ambiance)
  const dotGrid = [];
  function buildGrid(){
    dotGrid.length=0;
    const cols = Math.ceil(W/28);
    const rows = Math.ceil(H/28);
    for(let r=0;r<rows;r++){
      for(let co=0;co<cols;co++){
        dotGrid.push({
          x: co*28 + 14,
          y: r*28 + 14,
          eaten: Math.random() < .45,
          blinkPhase: Math.random()*Math.PI*2,
        });
      }
    }
  }
  buildGrid();
  addEventListener('resize', buildGrid);

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t += .015;
    for(const d of dotGrid){
      if(!d.eaten){
        const flicker = .5 + .5*Math.sin(t*1.5 + d.blinkPhase);
        ctx.globalAlpha = .08 + flicker * .07;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(d.x, d.y, 2.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── GHOSTS ── */
(function(){
  const c = document.getElementById('ghost-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const GHOST_COLORS = ['#FFB8FF','#00FFDE','#FFB852','#FF0000'];
  const GHOST_NAMES  = ['Pinky','Inky','Clyde','Blinky'];

  function mkGhost(i){
    return {
      x: Math.random()*W,
      y: Math.random()*H*.7 + H*.1,
      vx: (1.8 + Math.random()*2) * (Math.random()<.5?1:-1),
      vy: (0.6 + Math.random()*1) * (Math.random()<.5?1:-1),
      color: GHOST_COLORS[i % GHOST_COLORS.length],
      size: 22 + Math.random()*12,
      frightened: false,
      frightTimer: 0,
      eyeAnim: 0,
    };
  }

  const ghosts = Array.from({length:5}, (_,i)=>mkGhost(i));

  function drawGhost(ctx, x, y, r, color, frightened, t){
    ctx.save();
    ctx.translate(x,y);

    const bodyColor = frightened
      ? (Math.floor(t*.5)%2===0 ? '#0000FF' : '#FFFFFF')
      : color;

    // Ghost body
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0);
    // Wavy bottom
    const waves = 3;
    const wW = (r*2)/waves;
    ctx.lineTo(r, r);
    for(let w=0;w<waves;w++){
      const cx1 = r - wW*(w+.25);
      const cx2 = r - wW*(w+.75);
      const bY  = r + (w%2===0 ? -6 : 0);
      ctx.quadraticCurveTo(cx1, bY, r - wW*(w+.5), r*.6 + (w%2===0?0:4));
      ctx.quadraticCurveTo(cx2, bY, r - wW*(w+1), r);
    }
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.fill();

    if(!frightened){
      // Eyes whites
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.ellipse(-r*.32,-r*.22,r*.22,r*.28,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( r*.32,-r*.22,r*.22,r*.28,0,0,Math.PI*2); ctx.fill();
      // Pupils
      ctx.fillStyle='#0044ff';
      ctx.beginPath(); ctx.arc(-r*.28,-r*.22,r*.12,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( r*.36,-r*.22,r*.12,0,Math.PI*2); ctx.fill();
    } else {
      // Scared face
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(-r*.3,0,r*.12,0,Math.PI*2); ctx.stroke();
      ctx.beginPath();
      ctx.arc( r*.3,0,r*.12,0,Math.PI*2); ctx.stroke();
    }

    ctx.restore();
  }

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t += .06;
    for(const g of ghosts){
      g.x += g.vx; g.y += g.vy;
      // Bounce off walls
      if(g.x < g.size || g.x > W-g.size) g.vx *= -1;
      if(g.y < g.size || g.y > H-g.size) g.vy *= -1;
      // Random direction change
      if(Math.random() < .008){
        g.vy *= -1;
        if(Math.random()<.3) g.vx *= -1;
      }

      ctx.globalAlpha = .65;
      ctx.shadowBlur = 15;
      ctx.shadowColor = g.color;
      drawGhost(ctx, g.x, g.y, g.size, g.color, g.frightened, t);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── PAC-MAN ── */
(function(){
  const c = document.getElementById('pac-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const pac = {
    x: 80, y: 0, vx:3.5, vy:0,
    r: 20, mouth:0.15, mDir:1,
    dir: 1 // 1=right, -1=left
  };
  pac.y = H/2;

  let t = 0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t += .14;

    // Animate mouth
    pac.mouth += pac.mDir * .08;
    if(pac.mouth > .45 || pac.mouth < .03) pac.mDir *= -1;

    // Move pac
    pac.x += pac.vx * pac.dir;
    pac.y += Math.sin(t*.5) * 1.2;

    // Wrap/bounce
    if(pac.x > W + pac.r){
      pac.x = -pac.r;
      pac.y = pac.r*2 + Math.random()*(H - pac.r*4);
    }
    if(pac.x < -pac.r){
      pac.x = W + pac.r;
      pac.dir = 1;
      pac.y = pac.r*2 + Math.random()*(H - pac.r*4);
    }

    // Draw Pac-Man
    ctx.save();
    ctx.translate(pac.x, pac.y);
    if(pac.dir < 0) ctx.scale(-1,1);

    const startAngle = pac.mouth * Math.PI;
    const endAngle   = (2 - pac.mouth) * Math.PI;

    // Glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#FFD700';

    ctx.fillStyle = '#FFE000';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,pac.r,startAngle,endAngle);
    ctx.closePath();
    ctx.fill();

    // Eye
    ctx.shadowBlur = 0;
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(pac.r*.25,-pac.r*.55,pac.r*.18,0,Math.PI*2);
    ctx.fill();

    ctx.restore();

    // Draw dot trail
    ctx.globalAlpha = .18;
    ctx.fillStyle='#fff';
    const dotSpacing = 28;
    if(pac.dir > 0){
      for(let dx = pac.x - dotSpacing; dx > -dotSpacing; dx -= dotSpacing){
        ctx.beginPath();
        ctx.arc(dx, pac.y, 3, 0, Math.PI*2);
        ctx.fill();
      }
    } else {
      for(let dx = pac.x + dotSpacing; dx < W + dotSpacing; dx += dotSpacing){
        ctx.beginPath();
        ctx.arc(dx, pac.y, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded = false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  }, 800);
}

function goBack(){
  const s = document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display = '';
  setTimeout(()=>s.classList.remove('hidden'), 10);
}

function toggleFS(){
  const el = document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
}

// Keyboard shortcut: F = fullscreen, Esc handled by browser
document.addEventListener('keydown', e=>{
  if(e.key==='f'||e.key==='F') toggleFS();
});

function loadEmulator(){
  emuLoaded = true;
  const romBytes  = Uint8Array.from(atob(ROM_B64), c=>c.charCodeAt(0));
  const romUrl    = URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes  = Uint8Array.from(atob(IMG_B64), c=>c.charCodeAt(0));
  const coverUrl  = URL.createObjectURL(new Blob([imgBytes],{type:'image/jpeg'}));

  window.EJS_player       = '#game-container';
  window.EJS_core         = 'fceumm';   // NES core
  window.EJS_gameUrl      = romUrl;
  window.EJS_gameID       = 'pacman-nes';
  window.EJS_gameName     = 'Pac-Man (Namco)';
  window.EJS_coverURL     = coverUrl;
  window.EJS_pathtodata   = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color        = '#FFE000';
  window.EJS_backgroundColor = '#000010';
  window.EJS_startOnLoaded   = true;
  window.EJS_language        = 'es';
  window.EJS_Buttons = {
    playPause:true, restart:true, mute:true, settings:true,
    fullscreen:true, saveState:true, loadState:true,
    screenRecord:false, gamepad:true, cheat:false,
    volume:true, saveSavFiles:true
  };

  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
