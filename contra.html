<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contra — NES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Rajdhani:wght@300;600;700&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --red:     #e8001a;
    --orange:  #ff6a00;
    --yellow:  #ffe600;
    --green:   #2eb82e;
    --dark:    #04080a;
    --army:    #3a4a1a;
    --steel:   #8aacb0;
  }

  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Black Ops One', cursive; color:#fff; }

  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .7s ease, transform .7s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.04); pointer-events:none; }

  /* fullscreen bg */
  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.38) saturate(1.2);
    image-rendering: pixelated;
    z-index:0;
    animation: bgShake 8s ease-in-out infinite;
  }
  @keyframes bgShake {
    0%,92%,100%{ transform:scale(1) translate(0,0); filter:brightness(.38) saturate(1.2); }
    93%{ transform:scale(1.01) translate(-1px,1px); filter:brightness(.5) saturate(1.5); }
    94%{ transform:scale(1.01) translate(1px,-1px); filter:brightness(.38) saturate(1.2); }
    96%{ transform:scale(1.01) translate(-1px,0); filter:brightness(.48) saturate(1.4); }
  }

  /* pixel scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px
    );
  }

  /* vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, transparent 18%, rgba(4,8,10,.88) 100%),
      linear-gradient(to top, rgba(4,8,10,.98) 0%, transparent 30%);
  }

  /* ── CANVASES ── */
  #bullet-canvas   { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #explode-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui { position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; }

  /* Konami code display */
  .konami-strip {
    background:rgba(0,0,0,.8);
    border:1px solid rgba(255,230,0,.3);
    padding:5px 16px;
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(.45rem,1.5vw,.62rem);
    letter-spacing:.15em;
    color:var(--yellow);
    margin-bottom:10px;
    animation: konamiGlow 2s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes konamiGlow {
    0%,100%{ box-shadow:none; color:var(--yellow); }
    50%    { box-shadow:0 0 12px rgba(255,230,0,.4); color:#fff; }
  }

  /* title */
  .title-wrap {
    text-align:center;
    animation: titleSlam .5s cubic-bezier(.2,2,.3,1) both;
  }
  @keyframes titleSlam {
    from{ transform:scale(2) translateY(-20px); opacity:0; }
    to  { transform:scale(1) translateY(0);     opacity:1; }
  }

  .contra-main {
    font-size:clamp(4rem,18vw,10rem);
    line-height:.82; letter-spacing:.06em;
    background:linear-gradient(180deg,#fff 0%,var(--yellow) 25%,var(--orange) 55%,var(--red) 85%,#6a0008 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(4px 5px 0 rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255,106,0,.5));
    animation:contraFire 1.8s ease-in-out infinite;
  }
  @keyframes contraFire {
    0%,100%{ filter:drop-shadow(4px 5px 0 rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255,106,0,.5)); }
    50%    { filter:drop-shadow(4px 5px 0 rgba(0,0,0,.7)) drop-shadow(0 0 55px rgba(255,230,0,.8)); }
  }

  .tagline {
    font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:clamp(.6rem,2.2vw,.9rem);
    letter-spacing:.4em; color:var(--steel);
    text-transform:uppercase; margin-top:4px;
  }
  .title-sub {
    font-family:'Rajdhani',sans-serif; font-size:.72rem;
    letter-spacing:.4em; color:rgba(255,255,255,.28);
    margin-top:4px; text-transform:uppercase;
  }

  /* lives & weapons HUD */
  .hud-row {
    margin-top:14px;
    display:flex; align-items:center; gap:10px;
    animation:hudIn .5s .2s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes hudIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  .hud-box {
    background:rgba(0,0,0,.75);
    border:2px solid rgba(255,230,0,.25);
    padding:5px 12px; text-align:center;
    font-family:'Share Tech Mono',monospace;
  }
  .hud-label { font-size:.48rem; letter-spacing:.25em; color:rgba(255,255,255,.4); margin-bottom:2px; }
  .hud-val   { font-size:clamp(.8rem,2.8vw,1.1rem); color:var(--yellow); text-shadow:0 0 8px var(--yellow); }

  .weapon-pill {
    background:var(--red); color:#fff;
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(.55rem,1.8vw,.72rem);
    padding:4px 10px; letter-spacing:.1em;
    border:1px solid rgba(255,255,255,.2);
    animation:wpFlash 2.5s ease-in-out infinite;
  }
  @keyframes wpFlash { 0%,100%{background:var(--red)} 50%{background:#ff4500} }

  /* play button — military stencil */
  .play-btn {
    margin-top:16px;
    padding:13px 52px;
    font-family:'Black Ops One',cursive;
    font-size:clamp(.9rem,3.5vw,1.2rem);
    letter-spacing:.25em; text-transform:uppercase;
    color:#000;
    background:linear-gradient(180deg, var(--yellow) 0%, var(--orange) 100%);
    border:none; cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,8% 100%,0 70%);
    box-shadow:0 0 25px rgba(255,106,0,.5), 0 0 60px rgba(232,0,26,.2);
    transition:transform .1s, box-shadow .1s;
    position:relative; overflow:hidden;
    animation:btnIn .6s .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:translateX(-100%); animation:shine 2.8s 1s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(200%)}}
  .play-btn:hover { transform:scale(1.06); box-shadow:0 0 45px rgba(255,230,0,.8), 0 0 80px rgba(255,106,0,.4); }
  .play-btn:active { transform:scale(.95); }

  /* "30 lives" tip */
  .tip {
    margin-top:10px;
    font-family:'Share Tech Mono',monospace; font-size:.55rem;
    letter-spacing:.2em; color:rgba(255,230,0,.4);
    animation:tipBlink 1.4s step-start infinite;
    text-align:center;
  }
  @keyframes tipBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:10px;
    font-family:'Rajdhani',sans-serif; font-size:.7rem;
    letter-spacing:.22em; color:rgba(255,255,255,.23);
    text-align:center; line-height:2;
  }
  .key {
    display:inline-block; border:1px solid rgba(255,255,255,.2);
    border-radius:2px; padding:0 5px;
    color:rgba(255,255,255,.4); margin:0 2px; font-size:.65rem;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }

  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,var(--dark),#0a1208);
    border-bottom:2px solid var(--orange);
  }
  #emu-header .logo {
    font-family:'Black Ops One',cursive; font-size:1rem; letter-spacing:.12em;
    color:var(--yellow); text-shadow:2px 2px 0 #000, 0 0 12px rgba(255,106,0,.6);
  }
  .hdr-btn {
    font-family:'Rajdhani',sans-serif; font-size:.72rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--yellow); border-color:var(--yellow); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Contra">
  <canvas id="bullet-canvas"></canvas>
  <canvas id="explode-canvas"></canvas>

  <div class="ui">

    <div class="konami-strip" id="konami-display">↑ ↑ ↓ ↓ ← → ← → B A — 30 LIVES</div>

    <div class="title-wrap">
      <div class="contra-main">CONTRA</div>
      <div class="tagline">Alien Armed Assault</div>
      <div class="title-sub">Nintendo Entertainment System · 1987</div>
    </div>

    <div class="hud-row">
      <div class="hud-box">
        <div class="hud-label">PLAYER</div>
        <div class="hud-val">1UP</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">SCORE</div>
        <div class="hud-val" id="score-val">000000</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">LIVES</div>
        <div class="hud-val" id="lives-val">× 03</div>
      </div>
      <div class="weapon-pill" id="weapon-val">S · SPREAD</div>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ &nbsp;INICIAR JUEGO</button>

    <div class="tip">[ ↑↑↓↓←→←→BA + START = 30 VIDAS ]</div>

    <div class="controls-hint">
      <span class="key">←→↑↓</span> Mover/apuntar &nbsp;|&nbsp;
      <span class="key">Z</span> A (disparo) &nbsp;<span class="key">X</span> B (salto)<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp; <span class="key">F</span> Pantalla completa
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">💥 CONTRA</span>
    <span style="font-family:'Rajdhani',sans-serif;font-size:.68rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── SCORE COUNTER ── */
(function(){
  const el = document.getElementById('score-val');
  let v=0, target=184600;
  const iv = setInterval(()=>{
    v = Math.min(v + 2800 + Math.floor(Math.random()*1200), target);
    el.textContent = String(v).padStart(6,'0');
    if(v>=target) clearInterval(iv);
  }, 28);
})();

  const WEAPONS = ['S · SPREAD','M · MACHINE','F · FIREBALL','L · LASER','R · RAPID'];
  const el = document.getElementById('weapon-val');
  let idx = 0;
  setInterval(()=>{ idx=(idx+1)%WEAPONS.length; el.textContent=WEAPONS[idx]; }, 2200);
})();

/* ── KONAMI CODE DETECTOR ── */
(function(){
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let pos = 0;
  const livesEl = document.getElementById('lives-val');
  document.addEventListener('keydown', e=>{
    if(e.key===KONAMI[pos]){ pos++;
      if(pos===KONAMI.length){
        livesEl.textContent='× 30';
        livesEl.style.color='#ff2200';
        livesEl.style.textShadow='0 0 15px #ff2200';
        document.getElementById('konami-display').textContent='★ 30 LIVES ACTIVATED! ★';
        document.getElementById('konami-display').style.color='#ff2200';
        pos=0;
      }
    } else pos=0;
  });
})();

/* ── BULLET STREAM ── */
(function(){
  const c = document.getElementById('bullet-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const DIRS = [
    {ax:1,ay:0},{ax:-1,ay:0},{ax:0,ay:-1},
    {ax:.7,ay:-.7},{ax:-.7,ay:-.7},{ax:.7,ay:.3},{ax:-.7,ay:.3},
  ];
  const bullets = [];

  function mkBullet(){
    const side = Math.random();
    const d = DIRS[Math.floor(Math.random()*DIRS.length)];
    const speed = 7+Math.random()*9;
    let x,y;
    if(side<.4){ x=-8; y=Math.random()*innerHeight; }
    else if(side<.8){ x=innerWidth+8; y=Math.random()*innerHeight; }
    else { x=Math.random()*innerWidth; y=innerHeight+8; }
    const isBig = Math.random()<.08;
    return {
      x,y,
      vx:d.ax*speed*(x<0?1:x>innerWidth?-1:Math.random()<.5?1:-1),
      vy:d.ay*speed*(y>innerHeight?-1:1),
      len:isBig?24:8+Math.random()*12,
      r:isBig?3.5:1.2+Math.random()*1.8,
      color:Math.random()<.55?'#ffe600':Math.random()<.6?'#ff6a00':'#ff2200',
      alpha:.6+Math.random()*.4,
      trail:[],
    };
  }

  for(let i=0;i<25;i++){ const b=mkBullet(); b.x=Math.random()*W; b.y=Math.random()*H; bullets.push(b); }

  function frame(){
    ctx.clearRect(0,0,W,H);
    if(bullets.length<35 && Math.random()<.4) bullets.push(mkBullet());
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>10) b.trail.shift();
      b.x+=b.vx; b.y+=b.vy;
      if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60){ bullets.splice(i,1); continue; }
      ctx.save();
      /* trail */
      for(let t=0;t<b.trail.length;t++){
        ctx.globalAlpha=b.alpha*(t/b.trail.length)*.35;
        ctx.fillStyle=b.color;
        ctx.beginPath(); ctx.arc(b.trail[t].x,b.trail[t].y,b.r*(t/b.trail.length),0,Math.PI*2); ctx.fill();
      }
      /* bullet */
      ctx.globalAlpha=b.alpha;
      ctx.strokeStyle=b.color; ctx.lineWidth=b.r*2;
      ctx.shadowColor=b.color; ctx.shadowBlur=10;
      ctx.beginPath();
      const ang=Math.atan2(b.vy,b.vx);
      ctx.moveTo(b.x,b.y);
      ctx.lineTo(b.x-Math.cos(ang)*b.len, b.y-Math.sin(ang)*b.len);
      ctx.stroke();
      /* core */
      ctx.fillStyle='#fff'; ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── EXPLOSIONS ── */
(function(){
  const c = document.getElementById('explode-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const explosions = [];
  function spawnExplosion(){
    explosions.push({
      x:Math.random()*W, y:Math.random()*H,
      r:0, maxR:20+Math.random()*50,
      particles:Array.from({length:8+Math.floor(Math.random()*8)},()=>({
        a:Math.random()*Math.PI*2,
        speed:1.5+Math.random()*3.5,
        x:0,y:0,
        color:['#ffe600','#ff6a00','#ff2200','#fff'][Math.floor(Math.random()*4)],
        r:1+Math.random()*2.5,
        life:1,
      })),
      alpha:1, life:1,
    });
    setTimeout(spawnExplosion, 800+Math.random()*2200);
  }
  spawnExplosion();

  function frame(){
    ctx.clearRect(0,0,W,H);
    for(let i=explosions.length-1;i>=0;i--){
      const e=explosions[i];
      e.r+=2.5; e.life-=.025; e.alpha=e.life;
      if(e.life<=0){ explosions.splice(i,1); continue; }
      /* ring */
      ctx.save();
      ctx.globalAlpha=e.alpha*.5;
      ctx.strokeStyle='#ff6a00'; ctx.lineWidth=2; ctx.shadowColor='#ff6a00'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.stroke();
      /* particles */
      for(const p of e.particles){
        p.x+=Math.cos(p.a)*p.speed; p.y+=Math.sin(p.a)*p.speed; p.life-=.02;
        ctx.globalAlpha=e.alpha*p.life;
        ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(e.x+p.x,e.y+p.y,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },700);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/jpeg'}));
  window.EJS_player='#game-container';
  window.EJS_core='fceumm';
  window.EJS_gameUrl=romUrl;
  window.EJS_gameID='contra';
  window.EJS_gameName='Contra';
  window.EJS_coverURL=coverUrl;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color='#ff6a00';
  window.EJS_backgroundColor='#04080a';
  window.EJS_startOnLoaded=true;
  window.EJS_language='es';
  window.EJS_Buttons={
    playPause:true,restart:true,mute:true,settings:true,
    fullscreen:true,saveState:true,loadState:true,
    screenRecord:false,gamepad:true,cheat:false,
    volume:true,saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
