<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castlevania — NES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=Rajdhani:wght@300;600&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --gold:    #c8920a;
    --gold2:   #f0c040;
    --gold3:   #ffe89a;
    --blood:   #8b0000;
    --blood2:  #cc1111;
    --bone:    #d4c9a8;
    --dark:    #080508;
    --crypt:   #100c14;
  }

  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Cinzel', serif; color:#fff; }

  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.04); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center top;
    filter: brightness(.32) saturate(1.1) sepia(.25);
    z-index:0;
    animation: bgBreath 6s ease-in-out infinite;
  }
  @keyframes bgBreath {
    0%,100%{ filter:brightness(.32) saturate(1.1) sepia(.25); }
    50%    { filter:brightness(.40) saturate(1.3) sepia(.15); }
  }

  /* dark oil-painting vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 12%, rgba(8,5,8,.9) 100%),
      linear-gradient(to top,  rgba(8,5,8,.99) 0%, transparent 25%),
      linear-gradient(to bottom, rgba(8,5,8,.6) 0%, transparent 18%);
  }

  /* ── CANVASES ── */
  #bat-canvas    { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #candle-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui { position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; }

  /* ornamental divider top */
  .ornament {
    font-size:clamp(.9rem,3vw,1.5rem);
    color:var(--gold);
    filter:drop-shadow(0 0 8px rgba(200,146,10,.6));
    letter-spacing:.4em;
    margin-bottom:6px;
    animation: ornGlow 3s ease-in-out infinite;
  }
  @keyframes ornGlow {
    0%,100%{ filter:drop-shadow(0 0 8px rgba(200,146,10,.6)); }
    50%    { filter:drop-shadow(0 0 18px rgba(240,192,64,.9)); }
  }

  /* title */
  .title-wrap { text-align:center; animation: titleRise .8s cubic-bezier(.2,1,.3,1) both; }
  @keyframes titleRise { from{transform:translateY(30px) scale(.92);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }

  .castle {
    font-family:'Cinzel Decorative', serif;
    font-size:clamp(2.4rem,10vw,5.8rem);
    font-weight:900; letter-spacing:.06em; line-height:.9;
    background:linear-gradient(180deg, var(--gold3) 0%, var(--gold2) 35%, var(--gold) 65%, #6a4800 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(3px 4px 0 rgba(0,0,0,.8)) drop-shadow(0 0 25px rgba(200,146,10,.4));
    animation:goldPulse 2.5s ease-in-out infinite;
  }
  @keyframes goldPulse {
    0%,100%{ filter:drop-shadow(3px 4px 0 rgba(0,0,0,.8)) drop-shadow(0 0 25px rgba(200,146,10,.4)); }
    50%    { filter:drop-shadow(3px 4px 0 rgba(0,0,0,.8)) drop-shadow(0 0 50px rgba(240,192,64,.7)); }
  }
  .vania {
    font-family:'Cinzel Decorative', serif;
    font-size:clamp(1.6rem,7vw,4rem);
    font-weight:400; letter-spacing:.25em; line-height:1;
    color:var(--bone);
    text-shadow:2px 3px 0 rgba(0,0,0,.8), 0 0 20px rgba(212,201,168,.3);
  }
  .title-sub {
    font-family:'Rajdhani',sans-serif; font-size:.72rem;
    letter-spacing:.45em; color:rgba(255,255,255,.28);
    margin-top:6px; text-transform:uppercase;
  }

  /* divider bottom */
  .divider {
    width:clamp(180px,50vw,380px); height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:12px 0;
    box-shadow:0 0 8px rgba(200,146,10,.4);
  }

  /* HP hearts */
  .hp-row {
    display:flex; align-items:center; gap:3px; margin-bottom:10px;
    animation: hpIn .6s .25s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes hpIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .heart { font-size:clamp(.8rem,2.5vw,1.1rem); }
  .heart.empty { opacity:.2; }
  .whip-label {
    margin-left:10px;
    font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.25em;
    color:var(--gold2); text-shadow:0 0 8px var(--gold);
    border:1px solid rgba(200,146,10,.3); padding:3px 8px;
    animation:whipPulse 2s ease-in-out infinite;
  }
  @keyframes whipPulse { 0%,100%{border-color:rgba(200,146,10,.3)} 50%{border-color:rgba(240,192,64,.7)} }

  /* play button — baroque frame style */
  .play-btn {
    margin-top:4px;
    padding:13px 50px;
    font-family:'Cinzel',serif; font-size:clamp(.8rem,2.8vw,1rem);
    font-weight:600; letter-spacing:.3em; text-transform:uppercase;
    color:#000;
    background:linear-gradient(180deg, var(--gold3) 0%, var(--gold2) 50%, var(--gold) 100%);
    border:none; cursor:pointer;
    clip-path:polygon(16px 0%,calc(100% - 16px) 0%,100% 50%,calc(100% - 16px) 100%,16px 100%,0% 50%);
    box-shadow:0 0 25px rgba(200,146,10,.5), 0 0 60px rgba(200,146,10,.15);
    transition:transform .12s, box-shadow .12s;
    position:relative; overflow:hidden;
    animation:btnAppear .7s .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnAppear { from{transform:scale(0) rotate(-3deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:translateX(-100%); animation:shine 3s 1s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(200%)}}
  .play-btn:hover { transform:scale(1.06); box-shadow:0 0 45px rgba(240,192,64,.9), 0 0 90px rgba(200,146,10,.4); }
  .play-btn:active { transform:scale(.96); }

  /* prophecy */
  .prophecy {
    margin-top:12px;
    font-family:'Cinzel',serif; font-size:clamp(.5rem,1.6vw,.65rem);
    letter-spacing:.28em; color:rgba(200,146,10,.45);
    font-style:italic; text-align:center;
    animation:propFade 4s ease-in-out infinite;
  }
  @keyframes propFade { 0%,100%{opacity:.3} 50%{opacity:.8} }

  .controls-hint {
    margin-top:12px;
    font-family:'Rajdhani',sans-serif; font-size:.7rem;
    letter-spacing:.22em; color:rgba(255,255,255,.22);
    text-align:center; line-height:2;
  }
  .key {
    display:inline-block; border:1px solid rgba(200,146,10,.25);
    border-radius:2px; padding:0 5px;
    color:rgba(200,146,10,.5); margin:0 2px; font-size:.65rem;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }

  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,var(--dark),var(--crypt));
    border-bottom:1px solid rgba(200,146,10,.3);
  }
  #emu-header .logo {
    font-family:'Cinzel Decorative',serif; font-size:.85rem; letter-spacing:.1em;
    background:linear-gradient(90deg,var(--gold2),var(--gold3));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 8px rgba(200,146,10,.5));
  }
  .hdr-btn {
    font-family:'Rajdhani',sans-serif; font-size:.72rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--gold2); border-color:var(--gold2); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Castlevania">
  <canvas id="bat-canvas"></canvas>
  <canvas id="candle-canvas"></canvas>

  <div class="ui">
    <div class="ornament">✦ ⚜ ✦ ⚜ ✦</div>

    <div class="title-wrap">
      <div class="castle">CASTLE</div>
      <div class="vania">VANIA</div>
      <div class="title-sub">Nintendo Entertainment System · 1986</div>
    </div>

    <div class="divider"></div>

    <div class="hp-row">
      <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
      <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
      <span class="heart empty">❤️</span><span class="heart empty">❤️</span><span class="heart empty">❤️</span>
      <div class="whip-label">⛓ WHIP LV.3</div>
    </div>

    <button class="play-btn" onclick="launchGame()">⚔️ &nbsp;INICIAR JUEGO</button>

    <div class="prophecy">✦ What is a man? A miserable little pile of secrets! ✦</div>

    <div class="controls-hint">
      <span class="key">←→</span> Mover &nbsp;|&nbsp;
      <span class="key">↑</span> Subir escalera &nbsp;|&nbsp;
      <span class="key">↓</span> Agacharse<br>
      <span class="key">Z</span> A (látigo) &nbsp;<span class="key">X</span> B (salto) &nbsp;
      <span class="key">↑+Z</span> Sub-arma<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp; <span class="key">F</span> Pantalla completa
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">⚔️ CASTLEVANIA</span>
    <span style="font-family:'Rajdhani',sans-serif;font-size:.68rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── BATS ── */
(function(){
  const c = document.getElementById('bat-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  function mkBat(){
    return {
      x: Math.random()*innerWidth,
      y: Math.random()*innerHeight*.5,
      vx:(Math.random()-.5)*1.8,
      vy:(Math.random()-.5)*.9,
      wing:0, wingSpeed:.12+Math.random()*.1,
      wingDir:1, wingMax:.7+Math.random()*.5,
      size:5+Math.random()*9,
      alpha:.35+Math.random()*.35,
      wave:Math.random()*Math.PI*2,
    };
  }
  const bats = Array.from({length:22}, mkBat);

  function drawBat(ctx,x,y,size,wingAngle){
    ctx.beginPath();
    /* body */
    ctx.ellipse(x,y,size*.35,size*.25,0,0,Math.PI*2);
    ctx.fill();
    /* left wing */
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x-size*1.1,y-size*Math.sin(wingAngle)*.9,x-size*1.4,y+size*.2);
    ctx.quadraticCurveTo(x-size*.9,y+size*.15,x,y+size*.1);
    ctx.fill();
    /* right wing */
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+size*1.1,y-size*Math.sin(wingAngle)*.9,x+size*1.4,y+size*.2);
    ctx.quadraticCurveTo(x+size*.9,y+size*.15,x,y+size*.1);
    ctx.fill();
  }

  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const b of bats){
      b.wave+=.015;
      b.wing+=b.wingSpeed*b.wingDir;
      if(b.wing>b.wingMax||b.wing<0) b.wingDir*=-1;
      b.x+=b.vx+Math.sin(b.wave)*.5;
      b.y+=b.vy+Math.cos(b.wave*.7)*.3;
      if(b.x<-30)b.x=W+30; if(b.x>W+30)b.x=-30;
      if(b.y<-30)b.y=H*.6; if(b.y>H*.7)b.y=-20;
      ctx.save();
      ctx.globalAlpha=b.alpha;
      ctx.fillStyle='#1a0a1a';
      ctx.shadowColor='rgba(100,0,150,.5)'; ctx.shadowBlur=6;
      drawBat(ctx,b.x,b.y,b.size,b.wing);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── CANDLE FLAMES + DRIPPING WAX ── */
(function(){
  const c = document.getElementById('candle-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  /* floating embers */
  const embers = Array.from({length:35},()=>({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    vy:-(0.4+Math.random()*.8),
    vx:(Math.random()-.5)*.4,
    r:1+Math.random()*2.2,
    alpha:Math.random(),
    phase:Math.random()*Math.PI*2,
    color:Math.random()<.6?'#c8920a':Math.random()<.5?'#f0c040':'#ff4400',
  }));

  /* blood drips */
  const drips = [];
  function mkDrip(){
    return {
      x:Math.random()*W, y:0,
      vy:1.2+Math.random()*2, len:10+Math.random()*30,
      alpha:.4+Math.random()*.4, r:1.5+Math.random()*2,
      life:1, decay:.007+Math.random()*.008,
    };
  }
  for(let i=0;i<8;i++){const d=mkDrip();d.y=Math.random()*H;drips.push(d);}

  function frame(){
    ctx.clearRect(0,0,W,H);
    const t=Date.now()/1000;

    /* embers */
    for(const e of embers){
      e.y+=e.vy; e.x+=e.vx+Math.sin(t*1.5+e.phase)*.3;
      if(e.y<-10){ e.y=H+10; e.x=Math.random()*W; }
      const flicker=.4+.6*Math.abs(Math.sin(t*4+e.phase));
      ctx.save();
      ctx.globalAlpha=flicker*.55;
      ctx.fillStyle=e.color;
      ctx.shadowColor=e.color; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    /* blood drips */
    if(drips.length<15&&Math.random()<.15) drips.push(mkDrip());
    for(let i=drips.length-1;i>=0;i--){
      const d=drips[i];
      d.y+=d.vy; d.life-=d.decay;
      if(d.y>H+40||d.life<=0){drips.splice(i,1);continue;}
      ctx.save();
      ctx.globalAlpha=d.alpha*d.life;
      ctx.fillStyle='#8b0000';
      ctx.shadowColor='#cc1111'; ctx.shadowBlur=6;
      /* teardrop shape */
      ctx.beginPath();
      ctx.moveTo(d.x,d.y-d.len);
      ctx.quadraticCurveTo(d.x+d.r*2,d.y,d.x,d.y+d.r*1.5);
      ctx.quadraticCurveTo(d.x-d.r*2,d.y,d.x,d.y-d.len);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },1100);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/jpeg'}));
  window.EJS_player='#game-container';
  window.EJS_core='fceumm';
  window.EJS_gameUrl=romUrl;
  window.EJS_gameID='castlevania';
  window.EJS_gameName='Castlevania';
  window.EJS_coverURL=coverUrl;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color='#c8920a';
  window.EJS_backgroundColor='#080508';
  window.EJS_startOnLoaded=true;
  window.EJS_language='es';
  window.EJS_Buttons={
    playPause:true,restart:true,mute:true,settings:true,
    fullscreen:true,saveState:true,loadState:true,
    screenRecord:false,gamepad:true,cheat:false,
    volume:true,saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
