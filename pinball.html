/* Dark overlay — NES screenshot needs to be readable */
.cover-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.82) 0%,
      rgba(0,0,0,0.45) 12%,
      rgba(0,0,0,0.1) 28%,
      transparent 42%,
      transparent 60%,
      rgba(0,0,0,0.3) 74%,
      rgba(0,0,0,0.88) 88%,
      rgba(0,0,0,0.98) 100%
    ),
    linear-gradient(90deg,
      rgba(0,0,0,0.6) 0%,transparent 20%,transparent 80%,rgba(0,0,0,0.6) 100%
    );
}

/* CRT scanlines — heavy, to match NES aesthetic */
.scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.3) 1px,rgba(0,0,0,0.3) 2px);
  animation:scan-flick 5s ease-in-out infinite;
}
@keyframes scan-flick{0%,94%,100%{opacity:1}95%{opacity:0.7}96.5%{opacity:1}98%{opacity:0.85}}

/* CRT curvature vignette */
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    radial-gradient(ellipse 85% 85% at 50% 50%,transparent 25%,rgba(0,0,0,0.78) 100%),
    radial-gradient(ellipse 100% 100% at 50% 50%,transparent 60%,rgba(0,0,20,0.3) 100%);
}

/* Neon border frame */
.neon-frame{
  position:absolute;inset:clamp(6px,1.5vw,12px);z-index:3;pointer-events:none;
  border:2px solid rgba(255,68,170,0.3);
  box-shadow:
    0 0 10px rgba(255,68,170,0.2),
    inset 0 0 10px rgba(255,68,170,0.1),
    0 0 30px rgba(68,136,255,0.15);
  animation:frame-glow 3s ease-in-out infinite;
}
@keyframes frame-glow{
  0%,100%{border-color:rgba(255,68,170,0.25);box-shadow:0 0 8px rgba(255,68,170,0.15),inset 0 0 8px rgba(255,68,170,0.08);}
  50%{border-color:rgba(68,136,255,0.35);box-shadow:0 0 16px rgba(68,136,255,0.25),inset 0 0 14px rgba(68,136,255,0.1);}
}
/* Frame corners */
.fc{position:absolute;width:clamp(16px,4vw,24px);height:clamp(16px,4vw,24px);}
.fc.tl{top:-1px;left:-1px;border-top:3px solid var(--pink);border-left:3px solid var(--pink);box-shadow:0 0 8px var(--pink);}
.fc.tr{top:-1px;right:-1px;border-top:3px solid var(--blue2);border-right:3px solid var(--blue2);box-shadow:0 0 8px var(--blue2);}
.fc.bl{bottom:-1px;left:-1px;border-bottom:3px solid var(--blue2);border-left:3px solid var(--blue2);box-shadow:0 0 8px var(--blue2);}
.fc.br{bottom:-1px;right:-1px;border-bottom:3px solid var(--pink);border-right:3px solid var(--pink);box-shadow:0 0 8px var(--pink);}

/* Bouncing ball animation */
.ball{
  position:absolute;z-index:3;pointer-events:none;
  width:clamp(10px,2.8vw,18px);height:clamp(10px,2.8vw,18px);
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,var(--blue3));
  box-shadow:0 0 8px var(--blue2),0 0 16px rgba(68,136,255,0.4);
  animation:ball-bounce var(--bs,2.2s) cubic-bezier(0.36,0,0.66,0) infinite var(--bd,0s);
}
@keyframes ball-bounce{
  0%,100%{transform:translate(0,0)}
  12%{transform:translate(8px,-clamp(20px,8vw,50px))}
  25%{transform:translate(20px,0)}
  37%{transform:translate(30px,-clamp(15px,5vw,35px))}
  50%{transform:translate(50px,0)}
  62%{transform:translate(60px,-clamp(25px,9vw,60px))}
  75%{transform:translate(40px,0)}
  87%{transform:translate(20px,-clamp(12px,4vw,28px))}
}

/* Bumper flash circles */
.bumper{
  position:absolute;z-index:3;pointer-events:none;
  border-radius:50%;border:2px solid;
  animation:bumper-flash var(--bf,1.8s) ease-in-out infinite var(--bfd,0s);
}
@keyframes bumper-flash{
  0%,100%{opacity:0.3;transform:scale(1)}
  50%{opacity:0.9;transform:scale(1.08)}
}

/* Score ticker */
.score-ticker{
  position:absolute;z-index:3;pointer-events:none;
  font-family:'Press Start 2P',monospace;
  color:var(--yellow2);
  text-shadow:0 0 6px var(--yellow),0 0 12px rgba(251,204,19,0.4);
  animation:score-count 0.05s steps(1) infinite;
  letter-spacing:1px;
}
@keyframes score-count{0%{opacity:1}50%{opacity:0.85}}

/* Flippers */
.flipper{
  position:absolute;z-index:3;pointer-events:none;
  height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--green2),var(--green));
  box-shadow:0 0 6px var(--green),0 0 12px var(--glow-green);
  animation:flipper-hit var(--fh,0.8s) ease-in-out infinite var(--fhd,0s);
  transform-origin:var(--fo,left) center;
}
@keyframes flipper-hit{
  0%,100%{transform:rotate(var(--fr1,-25deg))}
  30%,70%{transform:rotate(var(--fr2,15deg))}
}

/* ── TITLE TOP ── */
.title-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.5vw,10px);
  animation:title-in 0.8s cubic-bezier(0.22,1,0.36,1) forwards;opacity:0;
}
@keyframes title-in{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:none}}

.title-pinball{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(26px,8.5vw,52px);
  line-height:1;
  text-align:center;
  background:linear-gradient(135deg,
    var(--yellow2) 0%,var(--yellow) 20%,
    var(--pink3) 40%,var(--pink2) 55%,
    var(--pink) 70%,var(--blue2) 88%,
    var(--blue3) 100%
  );
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 16px var(--glow-pink));
  animation:pinball-glow 2.5s ease-in-out infinite;
}
@keyframes pinball-glow{
  0%,100%{filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 14px var(--glow-pink));}
  50%{filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 30px rgba(255,68,170,0.75)) drop-shadow(0 0 60px rgba(68,136,255,0.2));}
}

/* Score display */
.hiscore-panel{
  display:flex;align-items:center;gap:clamp(6px,2vw,12px);
  background:rgba(0,0,0,0.78);
  border:2px solid rgba(251,204,19,0.3);
  padding:clamp(4px,1.2vw,7px) clamp(10px,3vw,18px);
  box-shadow:0 0 10px rgba(251,204,19,0.1);
}
.hs-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hs-label{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(4px,1.1vw,6px);
  color:var(--orange2);letter-spacing:1px;text-transform:uppercase;
}
.hs-val{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(8px,2.2vw,12px);
  color:var(--yellow2);
  text-shadow:0 0 6px var(--yellow),0 0 12px rgba(251,204,19,0.3);
  animation:hs-flicker 3s ease-in-out infinite;
}
@keyframes hs-flicker{0%,92%,100%{opacity:1}93%{opacity:0.5}95%{opacity:1}97%{opacity:0.7}}
.hs-sep{width:2px;height:clamp(22px,5vw,32px);background:rgba(251,204,19,0.2);}

.meta-row{
  display:flex;align-items:center;gap:clamp(6px,2vw,10px);
  background:rgba(0,0,0,0.72);
  border:1px solid rgba(255,68,170,0.25);
  padding:clamp(4px,1vw,5px) clamp(10px,2.5vw,16px);
}
.meta-dot{width:5px;height:5px;border-radius:50%;background:var(--pink2);box-shadow:0 0 5px var(--pink);animation:dot-bl 1.5s ease-in-out infinite;}
.meta-dot.b{background:var(--blue2);box-shadow:0 0 5px var(--blue2);animation-delay:0.75s;}
@keyframes dot-bl{0%,100%{opacity:0.3}50%{opacity:1}}
.meta-text{font-family:'Share Tech Mono',monospace;font-size:clamp(7px,1.8vw,9px);letter-spacing:4px;color:rgba(255,136,204,0.65);text-transform:uppercase;}

/* ── PLAY BUTTON BOTTOM ── */
.btn-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:btn-in 0.8s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;opacity:0;
}
@keyframes btn-in{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}

#play-btn{
  position:relative;overflow:hidden;
  padding:clamp(13px,3.2vw,17px) clamp(28px,8vw,52px);
  background:rgba(0,0,0,0.72);
  border:2px solid var(--pink);
  border-bottom:2px solid var(--blue2);
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(10px,2.8vw,14px);
  color:var(--yellow2);
  letter-spacing:clamp(2px,1vw,4px);
  text-transform:uppercase;
  text-shadow:0 0 8px var(--yellow),2px 2px 0 rgba(0,0,0,0.8);
  box-shadow:0 0 18px var(--glow-pink),inset 0 0 12px rgba(255,68,170,0.04);
  animation:btn-arcade 1.8s ease-in-out infinite;
}
@keyframes btn-arcade{
  0%,100%{box-shadow:0 0 14px var(--glow-pink),inset 0 0 10px rgba(255,68,170,0.03);}
  50%{box-shadow:0 0 32px rgba(255,68,170,0.6),0 0 60px rgba(68,136,255,0.15),inset 0 0 18px rgba(255,68,170,0.07);}
}
#play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,136,204,0.12),rgba(68,136,255,0.08),transparent);
  transform:translateX(-100%);animation:arcade-sw 2.5s ease-in-out infinite;
}
@keyframes arcade-sw{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ct{position:absolute;border-style:solid;opacity:0.9;}
.ct.tl{top:-1px;left:-1px;width:9px;height:9px;border-color:var(--pink);border-width:2px 0 0 2px;}
.ct.tr{top:-1px;right:-1px;width:9px;height:9px;border-color:var(--yellow);border-width:2px 2px 0 0;}
.ct.bl{bottom:-1px;left:-1px;width:9px;height:9px;border-color:var(--yellow);border-width:0 0 2px 2px;}
.ct.br{bottom:-1px;right:-1px;width:9px;height:9px;border-color:var(--pink);border-width:0 2px 2px 0;}
#play-btn:active{background:rgba(255,68,170,0.1);}

.creds{font-family:'Share Tech Mono',monospace;font-size:clamp(5px,1.3vw,7px);letter-spacing:3px;color:rgba(200,80,150,0.2);text-transform:uppercase;}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{height:36px;min-height:36px;background:#000;border-bottom:2px solid var(--pink);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;}
#topbar .logo{color:var(--yellow);font-size:10px;letter-spacing:4px;font-family:'Press Start 2P',monospace;text-shadow:0 0 8px var(--yellow);}
.tbtn{background:none;border:1px solid rgba(255,68,170,0.3);color:rgba(255,136,204,0.8);font-size:15px;padding:3px 9px;cursor:pointer;border-radius:2px;}
.tbtn:active{background:rgba(255,68,170,0.1);}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(0,0,0,0.25) 1px,rgba(0,0,0,0.25) 2px);}
#game{width:100%;height:100%;display:block;}
#loader{position:absolute;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.llogo{font-family:'Press Start 2P',monospace;color:var(--yellow);font-size:12px;letter-spacing:5px;text-shadow:0 0 10px var(--yellow),0 0 20px var(--glow-yellow);}
#lbar-wrap{width:clamp(180px,55vw,260px);height:6px;background:#0a0000;overflow:hidden;border:2px solid rgba(255,68,170,0.25);}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yellow));transition:width 0.3s;box-shadow:0 0 8px var(--pink);}
#lmsg{font-family:'Share Tech Mono',monospace;color:rgba(255,136,204,0.45);font-size:9px;letter-spacing:3px;text-align:center;}
#lerr{display:none;color:#ff4444;font-size:9px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>

  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE NES...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('portrait').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
