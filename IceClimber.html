<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Climber — Nintendo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --ice:    #A8E4FF;
    --ice2:   #D4F4FF;
    --blue:   #1A6FD8;
    --blue2:  #4AA8FF;
    --pink:   #FF4499;
    --pink2:  #FF88CC;
    --orange: #FF8822;
    --white:  #EEEEFF;
    --dark:   #000818;
    --snow:   #C8E8FF;
  }

  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    background:#000818; image-rendering:pixelated;
  }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .8s ease, transform .8s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.22) saturate(1.4) hue-rotate(5deg);
    image-rendering:auto; z-index:0;
    animation: bgPulse 4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100%{ filter:brightness(.22) saturate(1.4) hue-rotate(5deg); }
    50%    { filter:brightness(.32) saturate(1.7) hue-rotate(5deg); }
  }

  /* CRT scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 4px
    );
  }
  /* Vignette */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,8,24,.94) 100%),
      linear-gradient(to top, rgba(0,8,24,.99) 0%, transparent 34%),
      linear-gradient(to bottom, rgba(0,8,24,.5) 0%, transparent 22%);
  }

  #snow-canvas      { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #platform-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #climber-canvas   { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui {
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
  }

  .arcade-hdr {
    display:flex; gap:10px; margin-bottom:8px;
    animation: dropIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes dropIn { from{transform:translateY(-30px);opacity:0} to{transform:translateY(0);opacity:1} }

  .score-cell {
    background:rgba(0,8,24,.92);
    border:2px solid rgba(168,228,255,.3);
    padding:5px 13px; text-align:center; min-width:88px;
  }
  .score-lbl { font-size:.3rem; letter-spacing:.25em; color:rgba(255,255,255,.38); margin-bottom:4px; }
  .score-val  { font-size:clamp(.65rem,2.4vw,.95rem); color:var(--ice); text-shadow:0 0 10px var(--ice2); }

  .stage-cell {
    background:rgba(0,8,24,.92);
    border:2px solid var(--blue2);
    padding:5px 13px; text-align:center;
    box-shadow:0 0 12px rgba(26,111,216,.3);
  }
  .stage-lbl { font-size:.3rem; letter-spacing:.25em; color:var(--blue2); margin-bottom:3px; text-shadow:0 0 6px var(--blue2); }
  .stage-val { font-size:clamp(.65rem,2.4vw,.95rem); color:#fff; }

  /* Title card */
  .title-card {
    background:rgba(0,8,24,.93);
    border-top:4px solid var(--ice);
    border-bottom:4px solid var(--blue2);
    padding:14px 32px 16px;
    text-align:center;
    box-shadow: 0 0 0 1px #000,
                0 0 40px rgba(168,228,255,.45),
                0 0 80px rgba(74,168,255,.18);
    min-width:min(92vw,480px);
    animation: cardIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn { from{transform:scaleY(.5);opacity:0} to{transform:scaleY(1);opacity:1} }

  .ic-eyebrow {
    font-size:clamp(.28rem,1vw,.42rem);
    letter-spacing:.55em;
    color:var(--pink2);
    text-shadow:0 0 8px var(--pink2);
    margin-bottom:6px;
  }
  .ic-ice {
    font-size:clamp(2.8rem,12vw,6.5rem);
    line-height:.88; letter-spacing:.06em;
    color:var(--ice);
    text-shadow: 4px 4px 0 var(--blue),
                 0 0 28px rgba(168,228,255,.9),
                 0 0 65px rgba(74,168,255,.4);
    animation: icePulse 2s ease-in-out infinite;
  }
  @keyframes icePulse {
    0%,100%{ text-shadow:4px 4px 0 var(--blue), 0 0 28px rgba(168,228,255,.9); }
    50%    { text-shadow:4px 4px 0 var(--blue), 0 0 55px rgba(212,244,255,1), 0 0 100px rgba(74,168,255,.5); }
  }
  .ic-climber {
    font-size:clamp(2rem,9vw,5rem);
    line-height:.9; letter-spacing:.04em;
    color:var(--pink);
    text-shadow: 3px 3px 0 #880044,
                 0 0 22px rgba(255,68,153,.8);
  }
  .ic-sub {
    font-size:clamp(.26rem,1vw,.42rem);
    letter-spacing:.4em;
    color:rgba(255,255,255,.28);
    margin-top:8px;
    border:1px solid rgba(168,228,255,.15);
    padding:3px 12px; display:inline-block;
  }

  /* Height row */
  .height-row {
    margin-top:10px; display:flex; align-items:center; gap:8px;
    animation: heightPop .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes heightPop { from{transform:scale(0) translateY(10px)} to{transform:scale(1) translateY(0)} }
  .height-lbl { font-size:.3rem; letter-spacing:.2em; color:rgba(255,255,255,.38); }
  .height-val { font-size:clamp(.65rem,2.2vw,.9rem); color:var(--ice); text-shadow:0 0 10px var(--ice2); }

  .bonus-row {
    margin-top:5px; display:flex; align-items:center; gap:8px;
    font-size:.34rem; color:var(--orange);
  }
  .bonus-lbl { letter-spacing:.2em; color:rgba(255,136,34,.5); }
  .bonus-val { text-shadow:0 0 8px var(--orange); animation:bonusBlink 1.3s step-start infinite; }
  @keyframes bonusBlink { 50%{opacity:.3} }

  /* Play button */
  .play-btn {
    margin-top:14px;
    padding:13px 38px;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(.5rem,1.8vw,.7rem);
    letter-spacing:.06em;
    color:#000; background:var(--ice);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 #4488aa, -4px 0 0 #4488aa,
      0 4px 0 #4488aa, 0 -4px 0 #eefaff,
      0 0 30px rgba(168,228,255,.55);
    transition:transform .12s;
    position:relative; overflow:hidden;
    animation: btnPop .6s .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes btnPop { from{transform:scale(0) rotate(-4deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:translateX(-100%); animation:shine 2.6s 1.2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(220%)}}
  .play-btn:hover { transform:scale(1.08); box-shadow:4px 0 0 #4488aa,-4px 0 0 #4488aa,0 4px 0 #4488aa,0 -4px 0 #eefaff,0 0 60px rgba(168,228,255,1); }
  .play-btn:active { transform:scale(.92) translate(2px,2px); }

  .insert-coin {
    margin-top:9px; font-size:.34rem; letter-spacing:.2em;
    color:var(--ice2); animation:coinBlink 1.1s step-start infinite;
  }
  @keyframes coinBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:9px;
    font-family:'Orbitron',sans-serif; font-size:.65rem;
    letter-spacing:.18em; color:rgba(255,255,255,.2);
    text-align:center; line-height:2.2;
  }
  .key {
    display:inline-block; border:1px solid rgba(168,228,255,.2);
    border-radius:2px; padding:0 5px;
    color:rgba(168,228,255,.4); margin:0 2px; font-size:.6rem;
    font-family:'Press Start 2P',monospace;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000818;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }
  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#000818,#001020);
    border-bottom:2px solid var(--ice);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.68rem; letter-spacing:.05em;
    color:var(--ice); text-shadow:2px 2px 0 var(--blue), 0 0 10px rgba(168,228,255,.5);
  }
  .hdr-btn {
    font-family:'Orbitron',sans-serif; font-size:.7rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--ice); border-color:var(--ice); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Ice Climber">
  <canvas id="snow-canvas"></canvas>
  <canvas id="platform-canvas"></canvas>
  <canvas id="climber-canvas"></canvas>

  <div class="ui">
    <div class="arcade-hdr">
      <div class="score-cell">
        <div class="score-lbl">1P</div>
        <div class="score-val" id="score1">000000</div>
      </div>
      <div class="stage-cell">
        <div class="stage-lbl">MOUNTAIN</div>
        <div class="stage-val" id="stage-val">01</div>
      </div>
      <div class="score-cell">
        <div class="score-lbl">HI-SCORE</div>
        <div class="score-val">099900</div>
      </div>
    </div>

    <div class="title-card">
      <div class="ic-eyebrow">✦ NINTENDO · NES ✦</div>
      <div class="ic-ice">ICE</div>
      <div class="ic-climber">CLIMBER</div>
      <div class="ic-sub">ARCADE CLASSIC · 1984</div>
    </div>

    <div class="height-row">
      <span class="height-lbl">HEIGHT</span>
      <span class="height-val" id="height-val">0000 m</span>
    </div>
    <div class="bonus-row">
      <span class="bonus-lbl">BONUS</span>
      <span class="bonus-val" id="bonus-val">5000</span>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="insert-coin">— INSERT COIN —</div>

    <div class="controls-hint">
      <span class="key">←→</span> Mover &nbsp;|&nbsp;
      <span class="key">Z</span> Saltar &nbsp;|&nbsp;
      <span class="key">X</span> Martillo<br>
      <span class="key">Enter</span> Start &nbsp;|&nbsp;
      <span class="key">F</span> Fullscreen &nbsp;|&nbsp;
      <span class="key">Esc</span> Volver
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🏔️ ICE CLIMBER</span>
    <span style="font-family:'Orbitron',sans-serif;font-size:.6rem;color:rgba(255,255,255,.22);letter-spacing:.15em;">NINTENDO · NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── FALLING SNOW ── */
(function(){
  const c = document.getElementById('snow-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  function mkFlake(randomY){
    return {
      x: Math.random()*W,
      y: randomY ? Math.random()*H : -10,
      vx: (Math.random()-.5)*.8,
      vy: .5+Math.random()*1.5,
      r: 1.5+Math.random()*3,
      alpha: .3+Math.random()*.5,
      wobble: Math.random()*Math.PI*2,
      wobbleV: .02+Math.random()*.03,
    };
  }
  const flakes = Array.from({length:80}, ()=>mkFlake(true));

  function frame(){
    ctx.clearRect(0,0,W,H);
    if(flakes.length<120 && Math.random()<.15) flakes.push(mkFlake(false));
    for(let i=flakes.length-1;i>=0;i--){
      const f=flakes[i];
      f.wobble+=f.wobbleV;
      f.x+=f.vx+Math.sin(f.wobble)*.4;
      f.y+=f.vy;
      if(f.y>H+10){ flakes.splice(i,1); continue; }
      ctx.globalAlpha=f.alpha;
      ctx.fillStyle=f.r>3?'#A8E4FF':'#ffffff';
      ctx.shadowBlur=f.r>2.5?6:0;
      ctx.shadowColor='#A8E4FF';
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── ICE PLATFORMS ── */
(function(){
  const c = document.getElementById('platform-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Platforms scroll upward slowly
  const platforms = [];
  function mkPlatform(y){
    const cols = 6 + Math.floor(Math.random()*6);
    const blockW = 28, blockH = 14;
    const totalW = cols * blockW;
    const x = Math.random()*(W - totalW);
    return { x, y, cols, blockW, blockH, hasMid: Math.random()>.5, midX: Math.floor(Math.random()*cols) };
  }
  // Seed initial platforms
  for(let i=0;i<9;i++) platforms.push(mkPlatform(H*.1 + i*(H*.1)));
  let scrollY = 0;

  function drawBlock(ctx, x, y, w, h, hasHole){
    if(hasHole) return;
    // Block body
    const grad = ctx.createLinearGradient(x,y,x,y+h);
    grad.addColorStop(0,'#C8EEFF');
    grad.addColorStop(.4,'#88CCEE');
    grad.addColorStop(1,'#4499BB');
    ctx.fillStyle=grad;
    ctx.shadowBlur=4; ctx.shadowColor='rgba(168,228,255,.5)';
    ctx.fillRect(x+1,y+1,w-2,h-2);
    ctx.shadowBlur=0;
    // Ice shine
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillRect(x+2,y+2,w-4,3);
    // Dark edge
    ctx.strokeStyle='rgba(0,80,140,.5)';
    ctx.lineWidth=1;
    ctx.strokeRect(x+.5,y+.5,w-1,h-1);
    // Sparkle
    if(Math.random()<.01){
      ctx.fillStyle='rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(x+w*.3,y+h*.3,1.5,0,Math.PI*2); ctx.fill();
    }
  }

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t++;
    scrollY = (scrollY + .4) % (H*.1);

    // Spawn new at top, remove below
    if(platforms.length<10) platforms.push(mkPlatform(-30));
    for(let i=platforms.length-1;i>=0;i--){
      platforms[i].y += .4;
      if(platforms[i].y > H+30) platforms.splice(i,1);
    }

    for(const p of platforms){
      ctx.globalAlpha = .55;
      for(let col=0;col<p.cols;col++){
        const hasHole = p.hasMid && col===p.midX;
        drawBlock(ctx, p.x+col*p.blockW, p.y, p.blockW, p.blockH, hasHole);
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── PIXEL CLIMBERS ── */
(function(){
  const c = document.getElementById('climber-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  // Popo (blue) and Nana (pink)
  function drawClimber(ctx, x, y, color, hatColor, frame, dir){
    ctx.save();
    ctx.translate(x,y);
    if(dir<0) ctx.scale(-1,1);
    const s=3;
    // Body
    ctx.fillStyle=color;
    ctx.fillRect(-s*2,-s*5,s*4,s*4);
    // Parka hood
    ctx.fillStyle='#fff';
    ctx.fillRect(-s*2,-s*8,s*4,s*3);
    // Hat
    ctx.fillStyle=hatColor;
    ctx.fillRect(-s*1.5,-s*9.5,s*3,s*2);
    // Face
    ctx.fillStyle='#FFCC99';
    ctx.fillRect(-s,-s*7.5,s*2,s*2);
    // Eyes
    ctx.fillStyle='#000';
    ctx.fillRect(-s*.8,-s*7,s*.4,s*.5);
    ctx.fillRect(s*.3,-s*7,s*.4,s*.5);
    // Mallet
    ctx.fillStyle='#CC8833';
    if(frame%2===0){
      ctx.fillRect(s*2,-s*6,s,s*3);
      ctx.fillStyle='#888';
      ctx.fillRect(s*1.5,-s*6.5,s*2,s);
    } else {
      ctx.fillRect(s*2,-s*4,s,s*3);
      ctx.fillStyle='#888';
      ctx.fillRect(s*1.5,-s*4.5,s*2,s);
    }
    // Legs
    ctx.fillStyle='#fff';
    if(frame%2===0){
      ctx.fillRect(-s*1.5,-s,s,s*2);
      ctx.fillRect(s*.3,-s*1.5,s,s*2);
    } else {
      ctx.fillRect(-s*1.5,-s*1.5,s,s*2);
      ctx.fillRect(s*.3,-s,s,s*2);
    }
    // Boots
    ctx.fillStyle='#333399';
    ctx.fillRect(-s*1.5,s*.5,s*1.2,s);
    ctx.fillRect(s*.3,s*.3,s*1.2,s);
    ctx.restore();
  }

  // Polar bear enemy
  function drawBear(ctx, x, y, frame){
    ctx.save();
    ctx.translate(x,y);
    const s=3;
    ctx.fillStyle='#E8F0FF';
    // Body
    ctx.beginPath(); ctx.arc(0,-s*2,s*3,0,Math.PI*2); ctx.fill();
    // Head
    ctx.beginPath(); ctx.arc(0,-s*6,s*2,0,Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-s*.7,-s*6.3,s*.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.7,-s*6.3,s*.3,0,Math.PI*2); ctx.fill();
    // Nose
    ctx.fillStyle='#FF8888';
    ctx.beginPath(); ctx.arc(0,-s*5.8,s*.2,0,Math.PI*2); ctx.fill();
    // Feet
    ctx.fillStyle='#CCD8EE';
    ctx.fillRect(-s*2.5,s*.5,s*2,s*.8);
    ctx.fillRect(s*.5,s*.5,s*2,s*.8);
    ctx.restore();
  }

  const popo = { x:0, y:0, vx:1.8, vy:0, frame:0, dir:1, bouncing:false };
  const nana = { x:0, y:0, vx:1.4, vy:0, frame:1, dir:-1, bouncing:false };
  const bears = [];

  function mkBear(){
    return { x: Math.random()<.5?-40:W+40, y: H*.3+Math.random()*H*.4, vx:0, frame:0 };
  }
  for(let i=0;i<2;i++){
    const b=mkBear(); b.x=Math.random()*W; bears.push(b);
  }

  let t=0;
  function frame(){
    ctx.clearRect(0,0,W,H);
    t++;

    // Popo
    popo.x += popo.vx * popo.dir;
    popo.y = H*.7 + Math.sin(t*.08)*30;
    if(popo.x>W+40){popo.dir=-1;} if(popo.x<-40){popo.dir=1;}
    if(t%6===0) popo.frame=1-popo.frame;

    // Nana
    nana.x += nana.vx * nana.dir;
    nana.y = H*.55 + Math.sin(t*.06+1)*25;
    if(nana.x>W+40){nana.dir=-1;} if(nana.x<-40){nana.dir=1;}
    if(t%6===0) nana.frame=1-nana.frame;

    // Bears
    if(t%240===0 && bears.length<4) bears.push(mkBear());
    for(const b of bears){
      b.x += b.vx||0;
    }

    ctx.globalAlpha=.8;
    ctx.shadowBlur=12; ctx.shadowColor='#4499BB';
    drawClimber(ctx, popo.x, popo.y, '#1A6FD8','#1A6FD8', popo.frame, popo.dir);
    ctx.shadowColor='#FF4499';
    drawClimber(ctx, nana.x, nana.y, '#FF4499','#FF4499', nana.frame, nana.dir);
    ctx.shadowBlur=0;

    ctx.globalAlpha=.55;
    for(const b of bears){
      drawBear(ctx, b.x, b.y, b.frame);
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },800);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
document.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') toggleFS(); });

function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/webp'}));

  window.EJS_player          = '#game-container';
  window.EJS_core            = 'fceumm';
  window.EJS_gameUrl         = romUrl;
  window.EJS_gameID          = 'ice-climber-nes';
  window.EJS_gameName        = 'Ice Climber';
  window.EJS_coverURL        = coverUrl;
  window.EJS_pathtodata      = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color           = '#A8E4FF';
  window.EJS_backgroundColor = '#000818';
  window.EJS_startOnLoaded   = true;
  window.EJS_language        = 'es';
  window.EJS_Buttons = {
    playPause:true, restart:true, mute:true, settings:true,
    fullscreen:true, saveState:true, loadState:true,
    screenRecord:false, gamepad:true, cheat:false,
    volume:true, saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
