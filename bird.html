<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d8a2d">
<title>Flappy Bird — GBA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green:#4ec94e;--green2:#6ddc6d;--green-dark:#1a5c1a;--green-deeper:#0d3d0d;
  --yellow:#f5d800;--yellow2:#ffe840;--yellow3:#fff5a0;
  --pipe:#4a9e30;--pipe2:#5cbf38;
  --sky:#74d2f0;--sky2:#a8e4f8;
  --red:#e83020;
  --white:#ffffff;
  --dark:#0d1a0d;
  --topbar:44px;
}
html,body{width:100%;height:100%;background:var(--green-deeper);overflow:hidden;font-family:'Share Tech Mono',monospace;color:#fff;touch-action:none;}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--topbar);
  background:rgba(10,20,10,0.92);
  backdrop-filter:blur(12px);
  border-bottom:2px solid var(--green-dark);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}
#topbar .title{
  font-family:'Press Start 2P',monospace;
  font-size:.72rem;letter-spacing:.04em;
  color:var(--yellow2);
  text-shadow:2px 2px 0 var(--green-dark),0 0 12px rgba(245,216,0,.4);
  image-rendering:pixelated;
}
#topbar .badge{
  font-size:.5rem;background:var(--pipe);color:#fff;
  border-radius:2px;padding:3px 6px;margin-left:8px;letter-spacing:.07em;
  font-family:'Press Start 2P',monospace;border:1px solid var(--pipe2);
}
#topbar .controls{display:flex;gap:10px;}
#topbar button{
  background:rgba(255,255,255,0.06);border:1px solid rgba(78,201,78,.25);
  color:#8de88d;border-radius:4px;padding:5px 13px;
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  cursor:pointer;letter-spacing:.05em;
  transition:background .15s,border-color .15s,color .15s;
  display:flex;align-items:center;gap:6px;
  image-rendering:pixelated;
}
#topbar button:hover{background:rgba(78,201,78,.18);border-color:var(--green2);color:var(--green2);}

/* ── COVER ── */
#cover{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  cursor:pointer;transition:opacity .5s ease;
  background:var(--green);
}
#cover.hide{opacity:0;pointer-events:none;}

/* pixel sky gradient */
#cover-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  image-rendering:auto;
}
#cover-bg::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,30,13,.4) 0%,transparent 30%,transparent 55%,rgba(10,22,10,.95) 100%);
}
/* pixel scanlines - lighter for retro feel */
#cover-bg::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0,rgba(0,0,0,.06) 1px,transparent 1px,transparent 4px);
  pointer-events:none;
  image-rendering:pixelated;
}

#cover-fade{
  position:absolute;bottom:0;left:0;right:0;height:52%;
  background:linear-gradient(transparent,rgba(10,22,10,.99) 100%);
  pointer-events:none;
}

/* ── animated pipes ── */
.pipe-group{position:absolute;pointer-events:none;display:flex;flex-direction:column;align-items:center;}
.pipe-body{background:linear-gradient(90deg,var(--pipe) 0%,var(--pipe2) 40%,var(--pipe) 70%,#3a8020 100%);border:2px solid #2a6010;}
.pipe-cap{background:linear-gradient(90deg,#3a9024 0%,var(--pipe2) 40%,#3a9024 100%);border:2px solid #2a6010;border-radius:3px;}

/* ── floating bird ── */
#flappy-bird{
  position:absolute;pointer-events:none;
  font-size:3rem;
  left:25%;top:30%;
  animation:bird-flap 0.8s ease-in-out infinite, bird-float 3s ease-in-out infinite;
  filter:drop-shadow(2px 4px 6px rgba(0,0,0,.4));
}
@keyframes bird-flap{
  0%,100%{transform:rotate(-8deg) scaleY(1);}
  50%{transform:rotate(12deg) scaleY(0.92);}
}
@keyframes bird-float{
  0%,100%{top:28%;}
  50%{top:36%;}
}

/* ── ground stripes ── */
#ground{
  position:absolute;bottom:0;left:0;right:0;
  height:40px;
  background:repeating-linear-gradient(90deg,#c8a040 0px,#c8a040 20px,#b89030 20px,#b89030 40px);
  border-top:4px solid #8a6010;
  z-index:2;
}

/* ── medal score display ── */
.score-display{
  position:relative;z-index:3;
  background:rgba(245,216,0,.12);border:2px solid rgba(245,216,0,.3);
  border-radius:6px;padding:4px 14px;margin-bottom:8px;
  font-family:'Press Start 2P',monospace;font-size:.5rem;
  color:var(--yellow2);letter-spacing:.08em;
  text-shadow:1px 1px 0 rgba(0,0,0,.5);
}

/* ── INFO ── */
#cover-info{position:relative;z-index:4;text-align:center;padding-bottom:70px;padding-inline:20px;}

.cover-eyebrow{
  font-family:'Press Start 2P',monospace;font-size:.45rem;letter-spacing:.15em;
  color:var(--sky2);text-transform:uppercase;margin-bottom:10px;
  text-shadow:1px 1px 0 rgba(0,0,0,.5);
}

#cover-info h1{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(1.3rem,6vw,3rem);
  letter-spacing:.04em;line-height:1.3;
  color:var(--white);
  text-shadow:
    3px 3px 0 var(--green-dark),
    6px 6px 0 rgba(0,0,0,.5),
    0 0 30px rgba(255,255,255,.2);
  image-rendering:pixelated;
}
#cover-info h1 em{
  font-style:normal;display:block;
  color:var(--yellow2);
  text-shadow:3px 3px 0 #8a6000,6px 6px 0 rgba(0,0,0,.5),0 0 20px rgba(245,216,0,.5);
}

/* tap instruction */
.tap-hint{
  font-family:'Press Start 2P',monospace;font-size:.45rem;
  color:rgba(255,255,255,.55);letter-spacing:.1em;
  margin-top:10px;
  animation:blink-hint 1.2s step-end infinite;
}
@keyframes blink-hint{0%,100%{opacity:.6;}50%{opacity:0;}}

.cover-platform{font-size:.55rem;color:rgba(255,255,255,.3);letter-spacing:.15em;margin-top:8px;font-family:'Press Start 2P',monospace;}

#play-btn{
  margin-top:24px;
  display:inline-flex;align-items:center;gap:10px;
  background:var(--yellow);color:#3a2000;
  border:none;border-radius:4px;
  padding:12px 36px;
  font-family:'Press Start 2P',monospace;font-size:.75rem;letter-spacing:.08em;
  cursor:pointer;
  box-shadow:0 5px 0 #a07000,0 7px 0 rgba(0,0,0,.3),0 0 20px rgba(245,216,0,.3);
  animation:pbtn-pulse 1.4s ease-in-out infinite;
  transition:transform .08s,box-shadow .08s;
  image-rendering:pixelated;
}
@keyframes pbtn-pulse{
  0%,100%{box-shadow:0 5px 0 #a07000,0 7px 0 rgba(0,0,0,.3),0 0 20px rgba(245,216,0,.25);}
  50%{box-shadow:0 5px 0 #a07000,0 7px 0 rgba(0,0,0,.3),0 0 40px rgba(245,216,0,.6);}
}
#play-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a07000,0 2px 0 rgba(0,0,0,.3);}
#play-btn:hover{filter:brightness(1.08);}

/* ── EMULATOR ── */
#emu-wrap{position:fixed;top:var(--topbar);left:0;right:0;bottom:0;display:none;background:#000;}
#emu-wrap.visible{display:block;}
#game{width:100%;height:100%;}

/* ── LOADER ── */
#loader{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse at center,#0d2a0d 0%,#000 70%);
}
#loader.gone{display:none;}
.loader-bird{font-size:2.8rem;animation:bird-flap .8s ease-in-out infinite;}
.loader-title{
  font-family:'Press Start 2P',monospace;font-size:1rem;letter-spacing:.06em;
  color:var(--yellow2);
  text-shadow:3px 3px 0 var(--green-dark),0 0 20px rgba(245,216,0,.4);
}
.loader-sub{font-size:.5rem;letter-spacing:.2em;color:var(--green2);font-family:'Press Start 2P',monospace;}
.spinner{
  width:42px;height:42px;
  border:3px solid rgba(78,201,78,.12);
  border-top-color:var(--green2);border-right-color:var(--yellow2);
  border-radius:50%;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-bar-wrap{width:min(280px,70vw);height:6px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;image-rendering:pixelated;}
#lbar{height:100%;width:0%;background:repeating-linear-gradient(90deg,var(--green) 0,var(--green) 10px,var(--green2) 10px,var(--green2) 20px);border-radius:2px;transition:width .3s ease;}
#lmsg{font-size:.48rem;color:rgba(255,255,255,.38);letter-spacing:.12em;text-align:center;font-family:'Press Start 2P',monospace;}
#lerr{display:none;font-size:.6rem;color:#ff7777;text-align:center;max-width:280px;white-space:pre-line;line-height:1.6;}
</style>
</head>
<body>

<div id="topbar">
  <div class="title">Flappy Bird <span class="badge">GBA</span></div>
  <div class="controls">
    <button id="muteBtn" onclick="toggleMute()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      MUTE
    </button>
    <button onclick="toggleFS()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      FULLSCREEN
    </button>
  </div>
</div>

<div id="cover" onclick="startGame()">
  <div id="cover-bg"></div>
  <div id="cover-fade"></div>

  <!-- animated bird -->
  <div id="flappy-bird">🐦</div>

  <!-- ground -->
  <div id="ground"></div>

  <div id="cover-info">
    <p class="cover-eyebrow">▶ TAP TO FLAP ◀</p>
    <h1>FLAPPY<em>BIRD</em></h1>
    <div class="score-display">🏅 HI SCORE: 000</div>
    <p class="tap-hint">— PRESS TO START —</p>
    <p class="cover-platform">GBA · 2014 · HOMEBREW</p>
    <button id="play-btn">
      ▶ &nbsp; FLAP!
    </button>
  </div>
</div>

<div id="emu-wrap">
  <div id="loader">
    <div class="loader-bird">🐦</div>
    <div class="loader-title">FLAPPY BIRD</div>
    <div class="loader-sub">LOADING GBA CORE...</div>
    <div class="spinner"></div>
    <div class="load-bar-wrap"><div id="lbar"></div></div>
    <p id="lmsg">INICIANDO...</p>
    <p id="lerr"></p>
  </div>
  <div id="game"></div>
</div>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArQIACH0CAAgAAAAAZGtBUk0AAAA=";

document.getElementById('cover-bg').style.backgroundImage = 'url("data:image/png;base64,' + IMG_B64 + '")';

let started = false, muted = false;

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}

function startGame(){
  if(started)return;
  started=true;
  document.getElementById('cover').classList.add('hide');
  document.getElementById('emu-wrap').classList.add('visible');

  setProgress(10,'DECODING ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('ROM Error: '+e.message);return;}

  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);

  setProgress(40,'LOADING GBA EMULATOR...');
  window.EJS_player='#game';
  window.EJS_core='mgba';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Flappy Bird GBA';
  window.EJS_color='#4ec94e';
  window.EJS_backgroundColor='#0d2a0d';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'LOADING... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'🐦 READY TO FLAP!');
    setTimeout(()=>{document.getElementById('loader').classList.add('gone');},700);
  };

  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('Could not load EmulatorJS.\nCheck your internet connection.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  setTimeout(()=>document.getElementById('loader').classList.add('gone'),15000);
}

// NOTE: This GBA homebrew uses the RIGHT D-PAD button to flap (not A/space)
document.getElementById('cover').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(!started&&(e.key==='Enter'||e.key===' '))startGame();
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='m'||e.key==='M')toggleMute();
});

function toggleMute(){
  muted=!muted;
  const btn=document.getElementById('muteBtn');
  btn.innerHTML=muted
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg> UNMUTE'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> MUTE';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('portrait').catch(()=>{});}
  else document.exitFullscreen?.();
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
