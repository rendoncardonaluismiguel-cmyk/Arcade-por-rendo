<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#0a0a0a">
<title>Super Mario Kart — SNES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --red:#e52521;--red2:#ff3d3a;
  --yellow:#fbcc13;--yellow2:#ffe566;
  --blue:#1a6fb5;--blue2:#2892d7;
  --white:#ffffff;--dark:#0a0a0a;
  --asphalt:#111114;--track:#1a1a1f;
}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;touch-action:none;}

/* ===== SPLASH ===== */
#splash{
  position:fixed;inset:0;z-index:999;
  background:var(--dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}

/* Sky gradient top half */
.sky{
  position:absolute;top:0;left:0;right:0;height:55%;
  background:linear-gradient(180deg,#1a3a8a 0%,#2860c8 40%,#5090e0 70%,#90c0f0 100%);
  pointer-events:none;
}

/* Clouds */
.cloud{
  position:absolute;border-radius:50px;background:rgba(255,255,255,0.85);
  filter:blur(2px);animation:cloud-move var(--cs,18s) linear infinite var(--cd,0s);
}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;}
.cloud1{width:80px;height:22px;top:8%;--cs:22s;}
.cloud1::before{width:36px;height:36px;top:-16px;left:12px;}
.cloud1::after{width:28px;height:28px;top:-12px;left:38px;}
.cloud2{width:60px;height:18px;top:18%;--cs:16s;--cd:-6s;opacity:0.7;}
.cloud2::before{width:28px;height:28px;top:-12px;left:8px;}
.cloud2::after{width:22px;height:22px;top:-9px;left:28px;}
.cloud3{width:50px;height:16px;top:12%;--cs:26s;--cd:-12s;opacity:0.75;}
.cloud3::before{width:24px;height:24px;top:-10px;left:6px;}
.cloud3::after{width:18px;height:18px;top:-8px;left:22px;}
@keyframes cloud-move{
  from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 160px))}
}

/* Asphalt / track */
.track{
  position:absolute;bottom:0;left:0;right:0;height:48%;
  background:linear-gradient(180deg,#222228 0%,#111115 100%);
  pointer-events:none;
}
/* Track center line dashes */
.track-line{
  position:absolute;bottom:0;left:0;right:0;top:0;
  display:flex;flex-direction:column;justify-content:center;
  overflow:hidden;
}
.dashes{
  display:flex;gap:0;
  animation:dash-scroll 0.5s linear infinite;
  white-space:nowrap;
}
@keyframes dash-scroll{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.dash{
  display:inline-block;width:60px;height:6px;
  background:var(--yellow);margin-right:20px;flex-shrink:0;
  box-shadow:0 0 4px var(--yellow);
}

/* Speed lines */
.speedlines{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.sl{
  position:absolute;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  transform-origin:left center;
  animation:sl-zoom var(--sld,0.8s) ease-out infinite var(--sldelay,0s);
}
@keyframes sl-zoom{
  0%{opacity:0;width:0;left:50%}
  20%{opacity:1}
  100%{opacity:0;width:60%;left:50%}
}

/* Checkered flags corners */
.checker{
  position:absolute;
  width:clamp(40px,12vw,70px);
  height:clamp(40px,12vw,70px);
  pointer-events:none;opacity:0.85;
}
.checker canvas{width:100%;height:100%;}
.ch-tl{top:0;left:0;}
.ch-tr{top:0;right:0;transform:scaleX(-1);}
.ch-bl{bottom:0;left:0;transform:scaleY(-1);}
.ch-br{bottom:0;right:0;transform:scale(-1,-1);}

/* Floating items (coins + stars) */
.items-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.item{
  position:absolute;font-size:clamp(14px,4vw,20px);
  animation:item-float var(--ifd,4s) ease-in-out infinite var(--ifdelay,0s);
  opacity:0;
}
@keyframes item-float{
  0%{opacity:0;transform:translateY(20px) rotate(0deg) scale(0.8)}
  15%{opacity:1}
  85%{opacity:0.8}
  100%{opacity:0;transform:translateY(-50px) rotate(360deg) scale(1.1)}
}

/* Rainbow stripe */
.rainbow{
  position:absolute;top:50%;left:0;right:0;
  height:3px;margin-top:-1px;
  background:linear-gradient(90deg,
    #ff0000,#ff6600,#ffcc00,#00cc00,#0066ff,#6600cc,#cc00cc,
    #ff0000,#ff6600,#ffcc00,#00cc00,#0066ff,#6600cc,#cc00cc);
  background-size:200% 100%;
  animation:rainbow-slide 2s linear infinite;
  opacity:0.7;box-shadow:0 0 6px rgba(255,200,0,0.4);
  pointer-events:none;
}
@keyframes rainbow-slide{from{background-position:0%}to{background-position:100%}}

/* Vignette */
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 30%,rgba(0,0,0,0.65) 100%);
}

/* ===== CONTENT ===== */
.splash-content{
  position:relative;z-index:10;display:flex;flex-direction:column;
  align-items:center;gap:clamp(10px,2.5vw,16px);padding:16px;
  animation:content-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;
}
@keyframes content-pop{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}

/* MARIO icon */
.mario-icon{font-size:clamp(40px,12vw,64px);animation:mario-bounce 0.6s ease-in-out infinite alternate;line-height:1;}
@keyframes mario-bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

/* Title */
.title-super{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(7px,2.2vw,11px);
  color:var(--white);
  letter-spacing:clamp(4px,1.5vw,8px);
  text-shadow:2px 2px 0 var(--red),3px 3px 0 #800;
}
.title-mario{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(26px,9vw,52px);
  color:var(--yellow);
  letter-spacing:-1px;
  line-height:1.1;
  text-align:center;
  text-shadow:
    3px 3px 0 var(--red),
    5px 5px 0 #8b1a1a,
    0 0 30px rgba(251,204,19,0.5);
  animation:title-wobble 3s ease-in-out infinite;
}
@keyframes title-wobble{
  0%,100%{transform:rotate(-1deg)}
  50%{transform:rotate(1deg)}
}
.title-kart{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(20px,7vw,40px);
  color:var(--red2);
  letter-spacing:2px;
  text-shadow:
    3px 3px 0 #800,
    5px 5px 0 #400,
    0 0 20px rgba(229,37,33,0.5);
  animation:title-wobble 3s ease-in-out infinite 0.3s;
}

/* Start lights row */
.lights-row{
  display:flex;gap:clamp(8px,2vw,12px);align-items:center;
  background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,255,255,0.15);
  border-radius:4px;
  padding:clamp(6px,1.5vw,10px) clamp(12px,3vw,20px);
}
.light{
  width:clamp(12px,3.5vw,18px);
  height:clamp(12px,3.5vw,18px);
  border-radius:50%;
  border:2px solid rgba(0,0,0,0.5);
}
.light.red{
  background:radial-gradient(circle at 35% 35%,#ff6666,var(--red));
  box-shadow:0 0 8px var(--red2),0 0 16px rgba(229,37,33,0.4);
  animation:light-blink 1.5s ease-in-out infinite;
}
.light.red:nth-child(2){animation-delay:0.2s;}
.light.red:nth-child(3){animation-delay:0.4s;}
@keyframes light-blink{0%,100%{opacity:1}50%{opacity:0.35}}
.light.off{background:#1a0000;box-shadow:none;}
.light-label{font-size:clamp(6px,1.5vw,8px);letter-spacing:2px;color:rgba(255,255,255,0.4);}

/* Platform badge */
.platform-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.12);
  padding:5px 18px;
  border-radius:2px;
}
.plat-text{font-size:clamp(7px,1.8vw,9px);letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;}
.trophy{font-size:12px;}

/* PLAY button */
.play-wrap{position:relative;margin-top:4px;}
#play-btn{
  position:relative;overflow:hidden;
  padding:clamp(14px,3.5vw,18px) clamp(28px,8vw,56px);
  background:linear-gradient(180deg,var(--red2) 0%,var(--red) 60%,#b01a18 100%);
  border:none;cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(10px,2.8vw,13px);
  color:var(--yellow);
  letter-spacing:clamp(2px,1vw,4px);
  text-transform:uppercase;
  text-shadow:1px 1px 0 #8b1a1a,2px 2px 0 #400;
  box-shadow:
    0 6px 0 #8b1a1a,
    0 8px 0 #400,
    0 0 30px rgba(229,37,33,0.4);
  border-radius:4px;
  animation:btn-ready 1.5s ease-in-out infinite;
  transform:translateY(0);
  transition:transform 0.1s,box-shadow 0.1s;
}
@keyframes btn-ready{
  0%,100%{box-shadow:0 6px 0 #8b1a1a,0 8px 0 #400,0 0 20px rgba(229,37,33,0.3);}
  50%{box-shadow:0 6px 0 #8b1a1a,0 8px 0 #400,0 0 40px rgba(255,61,58,0.6),0 0 60px rgba(229,37,33,0.2);}
}
/* Shine sweep */
#play-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:btn-shine 2.5s ease-in-out infinite;
}
@keyframes btn-shine{0%{left:-100%}50%,100%{left:150%}}
#play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8b1a1a,0 3px 0 #400,0 0 20px rgba(229,37,33,0.3);}

/* Pixel border top/bot */
.pixel-border{
  position:absolute;left:0;right:0;height:8px;
  display:flex;pointer-events:none;z-index:5;
}
.pixel-border.top{top:0;}
.pixel-border.bot{bottom:0;transform:scaleY(-1);}
.pb{flex:1;height:100%;background:var(--c,#e52521);}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{
  height:36px;min-height:36px;
  background:linear-gradient(90deg,#0a0010,#1a000a,#0a0010);
  border-bottom:2px solid var(--red);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;
}
#topbar .logo{color:var(--yellow);font-size:9px;letter-spacing:3px;font-family:'Press Start 2P',monospace;text-shadow:1px 1px 0 var(--red);}
.tbtn{background:none;border:1px solid rgba(229,37,33,0.4);color:rgba(255,255,255,0.7);font-size:15px;padding:3px 9px;cursor:pointer;border-radius:2px;}
.tbtn:active{background:rgba(229,37,33,0.2);color:#fff;}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);}
#game{width:100%;height:100%;display:block;}
#loader{position:absolute;inset:0;z-index:10;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.llogo{font-family:'Press Start 2P',monospace;color:var(--yellow);font-size:10px;letter-spacing:4px;text-shadow:2px 2px 0 var(--red);}
#lbar-wrap{width:260px;height:8px;background:#1a1a1a;overflow:hidden;border-radius:2px;border:1px solid #333;}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--yellow));transition:width 0.3s;box-shadow:0 0 8px var(--yellow);}
#lmsg{color:rgba(255,255,255,0.5);font-size:8px;letter-spacing:2px;text-align:center;}
#lerr{display:none;color:#ff4444;font-size:9px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>
</head>
<body>

<div id="splash">
  <!-- Pixel border strips top & bot -->
  <div class="pixel-border top" id="pbTop"></div>
  <div class="pixel-border bot" id="pbBot"></div>

  <!-- Background layers -->
  <div class="sky"></div>
  <div class="cloud cloud1" style="left:-100px"></div>
  <div class="cloud cloud2" style="left:-80px"></div>
  <div class="cloud cloud3" style="left:-60px"></div>

  <div class="track">
    <div class="track-line"><div class="dashes" id="dashes"></div></div>
  </div>

  <div class="rainbow"></div>

  <div class="speedlines" id="speedlines"></div>

  <!-- Checkered corners -->
  <div class="checker ch-tl"><canvas id="ch1"></canvas></div>
  <div class="checker ch-tr"><canvas id="ch2"></canvas></div>
  <div class="checker ch-bl"><canvas id="ch3"></canvas></div>
  <div class="checker ch-br"><canvas id="ch4"></canvas></div>

  <div class="items-layer" id="items"></div>
  <div class="vignette"></div>

  <div class="splash-content">
    <div class="mario-icon">🏎️</div>

    <div>
      <div class="title-super">SUPER</div>
      <div class="title-mario">MARIO</div>
      <div class="title-kart">KART</div>
    </div>

    <div class="lights-row">
      <span class="light-label">LAP</span>
      <div class="light red"></div>
      <div class="light red"></div>
      <div class="light red"></div>
      <div class="light off"></div>
      <div class="light off"></div>
      <span class="light-label">START</span>
    </div>

    <div class="platform-row">
      <span class="trophy">🏆</span>
      <span class="plat-text">Super Nintendo · 1992</span>
      <span class="trophy">🏆</span>
    </div>

    <div class="play-wrap">
      <button id="play-btn" onclick="boot()">▶ &nbsp;¡ARRANCAR!</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <span class="logo">MARIO KART</span>
    <div style="display:flex;gap:6px;">
      <button class="tbtn" onclick="toggleMute()" id="muteBtn">🔊</button>
      <button class="tbtn" onclick="toggleFS()">⛶</button>
    </div>
  </div>
  <div id="screen">
    <div id="loader">
      <div class="llogo">SUPER MARIO KART</div>
      <div id="lbar-wrap"><div id="lbar"></div></div>
      <div id="lmsg">INICIANDO...</div>
      <div id="lerr"></div>
    </div>
    <div id="game"></div>
  </div>
</div>

<script>
// Pixel border strips — alternating red/yellow/blue
(function(){
  const colors=['#e52521','#fbcc13','#1a6fb5','#e52521','#fbcc13','#ffffff','#e52521','#1a6fb5'];
  ['pbTop','pbBot'].forEach(id=>{
    const el=document.getElementById(id);
    for(let i=0;i<40;i++){
      const d=document.createElement('div');
      d.className='pb';d.style.setProperty('--c',colors[i%colors.length]);
      el.appendChild(d);
    }
  });
})();

// Dash lane markings
(function(){
  const c=document.getElementById('dashes');
  for(let i=0;i<30;i++){const d=document.createElement('div');d.className='dash';c.appendChild(d);}
})();

// Checkered canvas corners
(function(){
  ['ch1','ch2','ch3','ch4'].forEach(id=>{
    const canvas=document.getElementById(id);
    const sz=canvas.parentElement.offsetWidth||60;
    canvas.width=sz;canvas.height=sz;
    const ctx=canvas.getContext('2d');
    const tile=sz/6;
    for(let r=0;r<6;r++) for(let c=0;c<6;c++){
      ctx.fillStyle=(r+c)%2===0?'#fff':'#000';
      ctx.fillRect(c*tile,r*tile,tile,tile);
    }
  });
})();

// Speed lines
(function(){
  const c=document.getElementById('speedlines');
  const angles=[-25,-15,-8,0,8,15,25,-20,-10,-5,5,10,20];
  angles.forEach((ang,i)=>{
    const l=document.createElement('div');l.className='sl';
    l.style.cssText=`transform:rotate(${ang}deg);--sld:${(Math.random()*0.6+0.5).toFixed(2)}s;--sldelay:${(Math.random()*2).toFixed(1)}s;`;
    c.appendChild(l);
  });
})();

// Floating items
(function(){
  const c=document.getElementById('items');
  const icons=['🪙','⭐','🪙','🍄','🪙','⭐','🪙','💥','🪙','⭐'];
  icons.forEach((icon,i)=>{
    const d=document.createElement('div');d.className='item';
    d.textContent=icon;
    d.style.cssText=`left:${8+i*9}%;top:${30+Math.random()*40}%;--ifd:${(Math.random()*3+3).toFixed(1)}s;--ifdelay:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(d);
  });

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function boot(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';loadEmulator();}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');document.getElementById('lbar').style.background='#ff2200';}
function loadEmulator(){
  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}
  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);
  setProgress(40,'CARGANDO EMULADOR SNES...');
  window.EJS_player='#game';window.EJS_core='snes9x';
  window.EJS_gameUrl=romURL;window.EJS_gameName='Super Mario Kart';
  window.EJS_color='#fbcc13';window.EJS_backgroundColor='#0a0a0a';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,zoom:false,crt:false,ratio:false,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE SNES... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'¡LETS-A GO!');
    setTimeout(()=>{document.getElementById('loader').style.display='none';},600);
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión a internet.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE SNES...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
