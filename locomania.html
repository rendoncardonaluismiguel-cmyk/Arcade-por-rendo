<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1205">
<title>Locomania — GBA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Share+Tech+Mono&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --rust:#c03010;--rust2:#e04020;--rust3:#ff6040;
  --coal:#1a1008;--coal2:#2a1a08;--coal3:#3a2808;
  --brass:#b07010;--brass2:#d4980a;--brass3:#f0c030;--brass4:#fff0a0;
  --steam:#d8e8d0;--steam2:#f0f8ee;
  --green-dark:#0a1205;--green2:#1a2a10;
  --iron:#484038;--iron2:#706050;--iron3:#a09080;
  --smoke:#b0b8a8;
  --topbar:44px;
}
html,body{width:100%;height:100%;background:var(--coal);overflow:hidden;font-family:'Share Tech Mono',monospace;color:#fff;touch-action:none;}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--topbar);
  background:rgba(10,8,4,0.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(176,112,16,.35);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}
#topbar .title{
  font-family:'Rye',serif;
  font-size:1.05rem;letter-spacing:.08em;
  color:var(--brass3);
  text-shadow:0 0 14px rgba(176,112,16,.5),1px 1px 0 rgba(0,0,0,.9);
}
#topbar .badge{
  font-size:.56rem;background:var(--rust);color:#fff;
  border-radius:3px;padding:2px 7px;margin-left:8px;letter-spacing:.07em;
  font-family:'Share Tech Mono',monospace;
}
#topbar .controls{display:flex;gap:10px;}
#topbar button{
  background:rgba(176,112,16,.08);border:1px solid rgba(176,112,16,.22);
  color:var(--iron3);border-radius:5px;padding:5px 13px;
  font-family:'Share Tech Mono',monospace;font-size:.7rem;
  cursor:pointer;letter-spacing:.05em;
  transition:background .15s,border-color .15s,color .15s;
  display:flex;align-items:center;gap:6px;
}
#topbar button:hover{background:rgba(176,112,16,.18);border-color:var(--brass3);color:var(--brass3);}

/* ── COVER ── */
#cover{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  cursor:pointer;transition:opacity .65s ease;
  background:var(--green-dark);
}
#cover.hide{opacity:0;pointer-events:none;}

/* cover image */
#cover-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center 30%;
  filter:saturate(0.9) brightness(0.82) contrast(1.08);
}
/* dark overlay with warm coal tint */
#cover-bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 35%,transparent 30%,rgba(10,8,4,.55) 100%),
    linear-gradient(180deg,rgba(10,8,4,.5) 0%,transparent 28%,transparent 50%,rgba(10,8,4,.92) 100%);
}
/* subtle film grain */
#cover-bg::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 3px);
  pointer-events:none;
}

#cover-fade{
  position:absolute;bottom:0;left:0;right:0;height:60%;
  background:linear-gradient(transparent,rgba(10,8,4,.99) 100%);
  pointer-events:none;
}
/* warm ember glow at base */
#cover-fade::before{
  content:'';position:absolute;bottom:0;left:15%;right:15%;height:35%;
  background:radial-gradient(ellipse at 50% 100%,rgba(160,60,10,.2) 0%,transparent 70%);
}

/* ── STEAM PUFFS ── */
.steam-puff{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(210,230,205,.7),rgba(210,230,205,.2) 60%,transparent 100%);
  animation:puff-rise var(--pd,5s) ease-out infinite var(--pdd,0s);
  opacity:0;
}
@keyframes puff-rise{
  0%{opacity:0;transform:translateY(0) scale(.4);}
  15%{opacity:.7;}
  60%{opacity:.3;}
  100%{opacity:0;transform:translateY(-90px) translateX(var(--px,10px)) scale(2.2);}
}

/* ── EMBER SPARKS ── */
.spark{
  position:absolute;border-radius:50%;pointer-events:none;
  width:3px;height:3px;
  animation:spark-fly var(--sd,3s) ease-out infinite var(--sdd,0s);
  opacity:0;
}
@keyframes spark-fly{
  0%{opacity:0;transform:translate(0,0) scale(1);}
  10%{opacity:1;}
  100%{opacity:0;transform:translate(var(--sx,20px),var(--sy,-60px)) scale(0);}
}

/* ── TRACK LINES ── */
#tracks{
  position:absolute;bottom:0;left:0;right:0;height:28px;
  pointer-events:none;z-index:2;overflow:hidden;
}
#tracks::before,#tracks::after{
  content:'';position:absolute;left:0;right:0;height:4px;
  background:linear-gradient(90deg,
    transparent 0%,
    var(--iron) 5%,var(--iron2) 10%,var(--iron) 15%,transparent 15%,
    transparent 20%,
    var(--iron) 25%,var(--iron2) 30%,var(--iron) 35%,transparent 35%,
    transparent 40%,
    var(--iron) 45%,var(--iron2) 50%,var(--iron) 55%,transparent 55%,
    transparent 60%,
    var(--iron) 65%,var(--iron2) 70%,var(--iron) 75%,transparent 75%,
    transparent 80%,
    var(--iron) 85%,var(--iron2) 90%,var(--iron) 95%,transparent 100%
  );
  border-radius:2px;
}
#tracks::before{top:4px;}
#tracks::after{top:16px;}

/* ── INFO ── */
#cover-info{position:relative;z-index:4;text-align:center;padding-bottom:64px;padding-inline:22px;}

.cover-eyebrow{
  font-family:'Special Elite',serif;font-size:.7rem;letter-spacing:.22em;
  color:var(--iron3);text-transform:uppercase;margin-bottom:8px;
}
.cover-eyebrow span{color:var(--brass3);}

#cover-info h1{
  font-family:'Rye',serif;
  font-size:clamp(2.8rem,12vw,6.5rem);
  letter-spacing:.06em;line-height:1;
  color:var(--brass3);
  text-shadow:
    0 0 50px rgba(176,112,16,.65),
    0 0 100px rgba(192,48,16,.25),
    3px 3px 0 rgba(0,0,0,.95),
    1px 1px 0 var(--coal);
  animation:loco-glow 4s ease-in-out infinite;
}
@keyframes loco-glow{
  0%,100%{text-shadow:0 0 40px rgba(176,112,16,.55),3px 3px 0 rgba(0,0,0,.95);}
  50%{text-shadow:0 0 70px rgba(212,152,10,.9),0 0 30px rgba(220,60,20,.3),3px 3px 0 rgba(0,0,0,.95);}
}

/* decorative rule */
.deco-rule{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:8px 0 6px;
}
.deco-rule::before,.deco-rule::after{
  content:'';flex:1;max-width:80px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brass) 60%);
}
.deco-rule::after{transform:scaleX(-1);}
.deco-rule span{
  font-family:'Special Elite',serif;font-size:.6rem;
  color:var(--brass2);letter-spacing:.2em;white-space:nowrap;
}

.cover-platform{font-size:.62rem;color:rgba(255,255,255,.32);letter-spacing:.2em;margin-top:4px;font-family:'Special Elite',serif;}

#play-btn{
  margin-top:28px;
  display:inline-flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--brass3) 0%,var(--brass2) 50%,#8a5800 100%);
  color:var(--coal);border:none;border-radius:5px;
  padding:13px 42px;
  font-family:'Rye',serif;font-size:1.05rem;letter-spacing:.1em;
  cursor:pointer;
  box-shadow:
    0 5px 0 #5a3800,
    0 7px 0 rgba(0,0,0,.4),
    0 0 28px rgba(176,112,16,.45),
    inset 0 1px 0 rgba(255,255,255,.2);
  animation:pbtn-glow 3.5s ease-in-out infinite;
  transition:transform .1s,box-shadow .1s;
  position:relative;overflow:hidden;
}
#play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-100%);animation:btn-shine 3.5s ease-in-out infinite;
}
@keyframes btn-shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(150%)}}
@keyframes pbtn-glow{
  0%,100%{box-shadow:0 5px 0 #5a3800,0 7px 0 rgba(0,0,0,.4),0 0 28px rgba(176,112,16,.45),inset 0 1px 0 rgba(255,255,255,.2);}
  50%{box-shadow:0 5px 0 #5a3800,0 7px 0 rgba(0,0,0,.4),0 0 55px rgba(212,152,10,.8),inset 0 1px 0 rgba(255,255,255,.2);}
}
#play-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #5a3800,0 2px 0 rgba(0,0,0,.4);}
#play-btn:hover{filter:brightness(1.08);}

/* ── EMULATOR ── */
#emu-wrap{position:fixed;top:var(--topbar);left:0;right:0;bottom:0;display:none;background:#000;}
#emu-wrap.visible{display:block;}
#game{width:100%;height:100%;}

/* ── LOADER ── */
#loader{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,#1a100a 0%,#000 70%);
}
#loader.gone{display:none;}
.loader-title{
  font-family:'Rye',serif;font-size:1.5rem;letter-spacing:.1em;
  color:var(--brass3);
  text-shadow:0 0 22px rgba(176,112,16,.55),2px 2px 0 rgba(0,0,0,.9);
}
.loader-sub{font-size:.6rem;letter-spacing:.22em;color:var(--iron3);font-family:'Special Elite',serif;}
.spinner{
  width:44px;height:44px;
  border:2px solid rgba(176,112,16,.12);
  border-top-color:var(--brass3);border-right-color:var(--rust2);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-bar-wrap{width:min(290px,70vw);height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,var(--rust),var(--brass3),var(--steam));border-radius:2px;transition:width .3s ease;}
#lmsg{font-size:.65rem;color:rgba(255,255,255,.35);letter-spacing:.15em;text-align:center;}
#lerr{display:none;font-size:.7rem;color:#ff7777;text-align:center;max-width:300px;white-space:pre-line;line-height:1.5;}
</style>
</head>

<div id="topbar">
  <div class="title">Locomania <span class="badge">GBA</span></div>
  <div class="controls">
    <button id="muteBtn" onclick="toggleMute()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      MUTE
    </button>
    <button onclick="toggleFS()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      FULLSCREEN
    </button>
  </div>
</div>

<div id="cover" onclick="startGame()">
  <div id="cover-bg"></div>
  <div id="cover-fade"></div>

  <!-- steam puffs from smokestack -->
  <div class="steam-puff" style="width:28px;height:28px;left:46%;bottom:55%;--pd:4s;--pdd:-1s;--px:8px;"></div>
  <div class="steam-puff" style="width:20px;height:20px;left:48%;bottom:53%;--pd:5s;--pdd:-2.5s;--px:-6px;"></div>
  <div class="steam-puff" style="width:34px;height:34px;left:44%;bottom:50%;--pd:6s;--pdd:-0.5s;--px:12px;"></div>
  <div class="steam-puff" style="width:22px;height:22px;left:50%;bottom:57%;--pd:4.5s;--pdd:-3s;--px:-10px;"></div>

  <!-- sparks -->
  <div class="spark" style="left:42%;bottom:32%;background:#ff8020;--sd:2.5s;--sdd:-0.8s;--sx:-18px;--sy:-55px;"></div>
  <div class="spark" style="left:55%;bottom:30%;background:#ffcc00;--sd:3s;--sdd:-1.5s;--sx:14px;--sy:-50px;"></div>
  <div class="spark" style="left:38%;bottom:35%;background:#ff6010;--sd:2s;--sdd:-0.3s;--sx:22px;--sy:-45px;"></div>

  <!-- track decoration -->
  <div id="tracks"></div>

  <div id="cover-info">
    <p class="cover-eyebrow">🚂 <span>Homebrew · GBA · 2005</span> 🚂</p>
    <h1>Locomania</h1>
    <div class="deco-rule"><span>⚙ STEAM POWERED ⚙</span></div>
    <p class="cover-platform">GBA · 232KB · PUZZLE</p>
    <button id="play-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      ¡A BORDO!
    </button>
  </div>
</div>

<div id="emu-wrap">
  <div id="loader">
    <div class="loader-title">Locomania</div>
    <div class="loader-sub">🚂 &nbsp; CALENTANDO CALDERAS &nbsp; 🚂</div>
    <div class="spinner"></div>
    <div class="load-bar-wrap"><div id="lbar"></div></div>
    <p id="lmsg">INICIANDO...</p>
    <p id="lerr"></p>
  </div>
  <div id="game"></div>
</div>

document.getElementById('cover-bg').style.backgroundImage = 'url("data:image/webp;base64,' + IMG_B64 + '")';

let started = false, muted = false;

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}

function startGame(){
  if(started)return;
  started=true;
  document.getElementById('cover').classList.add('hide');
  document.getElementById('emu-wrap').classList.add('visible');

  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}

  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);

  setProgress(40,'CARGANDO EMULADOR GBA...');
  window.EJS_player='#game';
  window.EJS_core='mgba';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Locomania';
  window.EJS_color='#d4980a';
  window.EJS_backgroundColor='#0a0804';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'🚂 ¡TREN EN MARCHA!');
    setTimeout(()=>{document.getElementById('loader').classList.add('gone');},700);
  };

  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión a internet.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  setTimeout(()=>document.getElementById('loader').classList.add('gone'),15000);
}

document.getElementById('cover').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(!started&&(e.key==='Enter'||e.key===' '))startGame();
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='m'||e.key==='M')toggleMute();
});

function toggleMute(){
  muted=!muted;
  const btn=document.getElementById('muteBtn');
  btn.innerHTML=muted
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg> UNMUTE'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> MUTE';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else document.exitFullscreen?.();
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
