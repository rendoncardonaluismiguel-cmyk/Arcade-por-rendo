<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#000510">
<title>Super JetPak DX — GBC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}

#splash{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:flex-end;justify-content:center;
  background:#000510;
  padding-bottom:clamp(22px,6.5vw,48px);
}

/* Deep space bg */
.space-bg{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 30% 40%, rgba(0,40,120,0.4) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 75% 60%, rgba(0,20,80,0.3) 0%, transparent 60%),
    linear-gradient(180deg,#000008 0%,#000510 35%,#00080f 70%,#010205 100%);
}

/* Stars */
.stars{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 8% 12%,rgba(255,255,255,0.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 22% 5%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(2px 2px at 38% 18%,rgba(255,255,255,0.9) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 8%,rgba(255,255,255,0.7) 0%,transparent 100%),
    radial-gradient(1px 1px at 70% 14%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(2px 2px at 85% 6%,rgba(255,255,255,0.8) 0%,transparent 100%),
    radial-gradient(1px 1px at 92% 22%,rgba(255,255,255,0.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 14% 38%,rgba(255,255,255,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 46% 32%,rgba(255,255,255,0.5) 0%,transparent 100%),
    radial-gradient(2px 2px at 78% 28%,rgba(200,220,255,0.7) 0%,transparent 100%),
    /* Green stars — JetPak style */
    radial-gradient(2px 2px at 18% 22%,rgba(100,255,100,0.8) 0%,transparent 100%),
    radial-gradient(2px 2px at 62% 16%,rgba(100,255,100,0.7) 0%,transparent 100%),
    radial-gradient(2px 2px at 88% 35%,rgba(100,255,100,0.6) 0%,transparent 100%);
  animation:stars-twinkle 4s ease-in-out infinite alternate;
}
@keyframes stars-twinkle{0%{opacity:1}100%{opacity:0.6}}

.cover-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  object-position:center center;
}

.bottom-fade{
  position:absolute;bottom:0;left:0;right:0;
  height:35%;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(0,5,15,0.55) 40%,rgba(0,3,10,0.92) 100%);
}

.scanlines{
  position:absolute;inset:0;pointer-events:none;opacity:0.1;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.28) 3px,rgba(0,0,0,0.28) 4px);
}

/* GBC badge */
.gbc-badge{
  position:absolute;top:clamp(10px,3vw,20px);right:clamp(10px,3vw,20px);
  background:rgba(0,5,15,0.82);
  border:2px solid rgba(80,200,255,0.55);
  padding:4px 14px;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:clamp(11px,3vw,16px);
  color:#60d8ff;
  letter-spacing:4px;
  box-shadow:0 0 10px rgba(60,180,255,0.2),2px 2px 0 rgba(0,0,0,0.6);
  pointer-events:none;
}

/* Play button — space blue with cyan glow */
#play-btn{
  position:relative;z-index:10;overflow:hidden;
  padding:clamp(13px,3.5vw,20px) clamp(28px,8.5vw,62px);
  background:linear-gradient(180deg,#0060c0 0%,#0040a0 50%,#002070 100%);
  border:none;
  border-top:3px solid rgba(100,200,255,0.35);
  border-bottom:4px solid rgba(0,0,0,0.6);
  cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:clamp(18px,5vw,30px);
  color:#fff;
  letter-spacing:clamp(3px,1.2vw,7px);
  text-transform:uppercase;
  text-shadow:1px 2px 4px rgba(0,0,0,0.6),0 0 12px rgba(100,200,255,0.4);
  border-radius:50px;
  box-shadow:
    0 0 28px rgba(0,120,255,0.7),
    0 0 60px rgba(0,100,220,0.25),
    0 6px 0 rgba(0,0,0,0.6);
  animation:btn-launch 2s ease-in-out infinite;
}
@keyframes btn-launch{
  0%,100%{box-shadow:0 0 28px rgba(0,120,255,0.7),0 0 60px rgba(0,100,220,0.25),0 6px 0 rgba(0,0,0,0.6);}
  50%{box-shadow:0 0 50px rgba(60,180,255,0.9),0 0 100px rgba(100,200,255,0.3),0 6px 0 rgba(0,0,0,0.6);}
}
#play-btn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,0.22) 0%,transparent 100%);
  border-radius:50px 50px 0 0;
}
#play-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,0.5);}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{
  height:36px;min-height:36px;
  background:linear-gradient(90deg,#000508,#000c14,#000508);
  border-bottom:2px solid #0060c0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;flex-shrink:0;
  box-shadow:0 2px 12px rgba(0,120,255,0.2);
}
#topbar .logo{color:#60d8ff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:3px;text-shadow:0 0 8px rgba(0,120,255,0.5);}
.tbtn{background:#000508;border:1px solid rgba(0,120,255,0.4);color:#60d8ff;font-size:14px;padding:4px 10px;cursor:pointer;border-radius:4px;}
.tbtn:active{transform:translate(1px,1px);}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);}
#game{width:100%;height:100%;display:block;}
#loader{
  position:absolute;inset:0;z-index:10;
  background:linear-gradient(180deg,#000308,#000510);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.llogo{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#60d8ff;font-size:20px;letter-spacing:5px;text-shadow:0 0 10px rgba(0,120,255,0.5);}
#lbar-wrap{width:clamp(180px,60vw,280px);height:12px;background:rgba(0,0,0,0.5);overflow:hidden;border:2px solid rgba(0,120,255,0.45);border-radius:6px;box-shadow:0 0 8px rgba(0,120,255,0.2);}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,#002070,#0060c0,#60d8ff,#80ff80);background-size:300% 100%;transition:width 0.3s;animation:lbar-shift 1s linear infinite;border-radius:4px;}
@keyframes lbar-shift{0%{background-position:0%}100%{background-position:100%}}
#lmsg{color:#60d8ff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:3px;text-align:center;}
#lerr{display:none;color:#ff6040;font-size:8px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>
</head>

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function boot(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';loadEmulator();}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}
function loadEmulator(){
  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}
  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);
  setProgress(40,'CARGANDO EMULADOR GBC...');
  window.EJS_player='#game';
  window.EJS_core='gambatte';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Super JetPak DX';
  window.EJS_color='#0060c0';
  window.EJS_backgroundColor='#000510';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE GBC... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'🚀 DESPEGUE! — GOOD LUCK ASTRONAUT!');
    setTimeout(()=>{document.getElementById('loader').style.display='none';},600);
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE GBC...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('portrait').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
