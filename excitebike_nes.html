<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excitebike — NES</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;600;700&display=swap');

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --orange:  #f56a00;
    --orange2: #ff9a3c;
    --red:     #cc1100;
    --white:   #f0f0f0;
    --gray:    #aaaaaa;
    --dark:    #111111;
    --track:   #555566;
  }

  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Press Start 2P', monospace; color:#fff;
    image-rendering:pixelated; }

  /* ── SPLASH ── */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    transition: opacity .7s ease, transform .7s ease;
  }
  #splash.hidden { opacity:0; transform:scale(1.04); pointer-events:none; }

  #bg-img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    filter: brightness(.45) saturate(.9);
    image-rendering:pixelated;
    z-index:0;
    animation: bgZoom 6s ease-in-out infinite alternate;
  }
  @keyframes bgZoom {
    from{ transform:scale(1) translateX(0); }
    to  { transform:scale(1.06) translateX(-1%); }
  }

  /* pixel scanlines */
  #splash::before {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,0,0,.20) 3px, rgba(0,0,0,.20) 4px
    );
  }

  /* vignette — lighter sides to match the gray gradient of the cover */
  #splash::after {
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(10,10,10,.88) 100%),
      linear-gradient(to top, rgba(10,10,10,.97) 0%, transparent 30%);
  }

  /* ── CANVASES ── */
  #track-canvas  { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #dust-canvas   { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }

  /* ── UI ── */
  .ui { position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; }

  /* speed-o-meter bar */
  .speed-bar {
    display:flex; align-items:center; gap:8px; margin-bottom:12px;
    animation: barDrop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes barDrop { from{transform:translateY(-24px);opacity:0} to{transform:translateY(0);opacity:1} }
  .speed-label { font-size:.4rem; letter-spacing:.2em; color:var(--gray); }
  .speed-track {
    width:clamp(100px,28vw,200px); height:10px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,150,60,.3);
    position:relative; overflow:hidden;
  }
  .speed-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--orange),var(--orange2),#fff);
    box-shadow:0 0 8px var(--orange);
    animation:speedUp 1.4s ease-out forwards;
  }
  @keyframes speedUp { to{width:88%} }
  .speed-val { font-size:.45rem; color:var(--orange2); text-shadow:0 0 8px var(--orange); }

  /* title panel */
  .title-panel {
    background:rgba(0,0,0,.82);
    border-top:3px solid var(--orange);
    border-bottom:3px solid var(--orange);
    padding:10px 28px 12px;
    text-align:center;
    box-shadow:0 0 0 1px #000, 0 0 30px rgba(245,106,0,.4), 0 0 70px rgba(245,106,0,.15);
    animation:panelIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
    min-width:min(88vw,440px);
  }
  @keyframes panelIn { from{transform:scaleX(.7);opacity:0} to{transform:scaleX(1);opacity:1} }

  /* pixel corner marks */
  .title-panel::before, .title-panel::after {
    content:''; position:absolute;
    width:8px; height:8px;
    background:var(--orange);
  }

  .excite {
    font-size:clamp(2rem,9vw,5rem);
    line-height:.85; letter-spacing:.05em;
    color:var(--white);
    text-shadow:4px 4px 0 var(--red), 0 0 20px rgba(245,106,0,.6);
    animation:excitePop .5s .2s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes excitePop { from{transform:scale(.7) skewX(-8deg);opacity:0} to{transform:scale(1) skewX(0);opacity:1} }

  .bike {
    font-size:clamp(1.2rem,5vw,2.6rem);
    line-height:1; letter-spacing:.3em;
    color:var(--orange);
    text-shadow:3px 3px 0 var(--red), 0 0 15px var(--orange);
    animation:bikeSlide .5s .35s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes bikeSlide { from{transform:translateX(-40px);opacity:0} to{transform:translateX(0);opacity:1} }

  .title-sub {
    font-size:.35rem; letter-spacing:.35em;
    color:rgba(255,255,255,.3); margin-top:8px;
    font-family:'Rajdhani',sans-serif; font-weight:600; text-transform:uppercase;
  }

  /* lap / time */
  .race-hud {
    margin-top:12px;
    display:flex; gap:8px; align-items:center;
    animation:hudIn .5s .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes hudIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .hud-cell {
    background:rgba(0,0,0,.8);
    border:2px solid rgba(245,106,0,.3);
    padding:5px 12px; text-align:center;
  }
  .hud-lbl { font-size:.35rem; letter-spacing:.2em; color:rgba(255,255,255,.4); margin-bottom:3px; }
  .hud-val { font-size:clamp(.7rem,2.5vw,1rem); color:var(--orange2); text-shadow:0 0 8px var(--orange); }

  /* heat gauge */
  .heat-row {
    margin-top:8px; display:flex; align-items:center; gap:6px;
    animation:heatIn .5s .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes heatIn { from{opacity:0} to{opacity:1} }
  .heat-lbl { font-size:.35rem; letter-spacing:.15em; color:rgba(255,255,255,.4); }
  .heat-track {
    width:clamp(80px,20vw,140px); height:8px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,60,0,.3);
  }
  .heat-fill {
    height:100%; width:72%;
    background:linear-gradient(90deg,#ff6600,#ff2200);
    box-shadow:0 0 6px #ff4400;
    animation:heatPulse 1s ease-in-out infinite;
  }
  @keyframes heatPulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .heat-warn { font-size:.35rem; color:#ff2200; animation:warnBlink .8s step-start infinite; }
  @keyframes warnBlink { 50%{opacity:0} }

  /* play button — pixel style */
  .play-btn {
    margin-top:14px;
    padding:12px 36px;
    font-family:'Press Start 2P', monospace;
    font-size:clamp(.5rem,1.8vw,.72rem);
    letter-spacing:.08em; text-transform:uppercase;
    color:#000;
    background:var(--orange);
    border:none; cursor:pointer;
    box-shadow:
      4px 0 0 var(--red), -4px 0 0 var(--red),
      0 4px 0 var(--red), 0 -4px 0 var(--orange2),
      0 0 30px rgba(245,106,0,.45);
    transition:transform .1s;
    position:relative; overflow:hidden;
    animation:btnRev 3.5s ease-in-out infinite;
  }
  @keyframes btnRev {
    0%,80%,100%{ box-shadow:4px 0 0 var(--red),-4px 0 0 var(--red),0 4px 0 var(--red),0 -4px 0 var(--orange2),0 0 30px rgba(245,106,0,.45); }
    85%        { box-shadow:4px 0 0 var(--red),-4px 0 0 var(--red),0 4px 0 var(--red),0 -4px 0 var(--orange2),0 0 60px rgba(245,106,0,.9); }
  }
  .play-btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transform:translateX(-100%); animation:shine 2.5s 1s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(200%)}}
  .play-btn:hover { transform:scale(1.06); }
  .play-btn:active { transform:scale(.93) translate(2px,2px); }

  /* start light blink */
  .start-light {
    margin-top:10px;
    font-size:.38rem; letter-spacing:.25em;
    color:var(--orange2);
    animation:startBlink 1s step-start infinite;
  }
  @keyframes startBlink { 50%{opacity:0} }

  .controls-hint {
    margin-top:10px;
    font-family:'Rajdhani',sans-serif; font-size:.7rem;
    letter-spacing:.22em; color:rgba(255,255,255,.25);
    text-align:center; line-height:2;
  }
  .key {
    display:inline-block; border:1px solid rgba(245,106,0,.25);
    border-radius:2px; padding:0 5px;
    color:rgba(245,106,0,.5); margin:0 2px; font-size:.65rem;
  }

  /* ── EMULATOR ── */
  #emu-wrapper {
    position:fixed; inset:0; background:#000;
    display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #emu-wrapper.active { display:flex; }

  #emu-header {
    width:100%; padding:7px 14px;
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(90deg,#0a0808,#181008);
    border-bottom:2px solid var(--orange);
  }
  #emu-header .logo {
    font-family:'Press Start 2P',monospace; font-size:.7rem; letter-spacing:.06em;
    color:var(--orange); text-shadow:2px 2px 0 var(--red), 0 0 10px var(--orange);
  }
  .hdr-btn {
    font-family:'Rajdhani',sans-serif; font-size:.72rem; letter-spacing:.18em;
    color:rgba(255,255,255,.35); background:none;
    border:1px solid rgba(255,255,255,.12); border-radius:3px;
    padding:4px 10px; cursor:pointer; transition:all .2s;
  }
  .hdr-btn:hover { color:var(--orange2); border-color:var(--orange2); }
  .ml { margin-left:auto; }
  #game-container { flex:1; width:100%; position:relative; }
</style>
</head>
<body>

<div id="splash">
  <img id="bg-img" alt="Excitebike">
  <canvas id="track-canvas"></canvas>
  <canvas id="dust-canvas"></canvas>

  <div class="ui">

    <!-- speed bar -->
    <div class="speed-bar">
      <div class="speed-label">SPEED</div>
      <div class="speed-track"><div class="speed-fill"></div></div>
      <div class="speed-val" id="speed-num">000</div>
    </div>

    <div class="title-panel">
      <div class="excite">EXCITE</div>
      <div class="bike">BIKE</div>
      <div class="title-sub">Nintendo Entertainment System · 1984</div>
    </div>

    <!-- race HUD -->
    <div class="race-hud">
      <div class="hud-cell">
        <div class="hud-lbl">LAP</div>
        <div class="hud-val">3/3</div>
      </div>
      <div class="hud-cell">
        <div class="hud-lbl">TIME</div>
        <div class="hud-val" id="timer">00'00</div>
      </div>
      <div class="hud-cell">
        <div class="hud-lbl">RANK</div>
        <div class="hud-val">#&nbsp;1</div>
      </div>
    </div>

    <!-- heat gauge -->
    <div class="heat-row">
      <div class="heat-lbl">ENGINE</div>
      <div class="heat-track"><div class="heat-fill"></div></div>
      <div class="heat-warn">!! HOT !!</div>
    </div>

    <button class="play-btn" onclick="launchGame()">▶ INICIAR JUEGO</button>
    <div class="start-light">— REV YOUR ENGINE —</div>

    <div class="controls-hint">
      <span class="key">←→</span> Mover &nbsp;|&nbsp;
      <span class="key">Z</span> A (turbo) &nbsp;<span class="key">X</span> B (acelerar)<br>
      <span class="key">↑↓</span> Inclinarse &nbsp;|&nbsp;
      <span class="key">Enter</span> Start &nbsp;|&nbsp; <span class="key">F</span> Fullscreen
    </div>
  </div>
</div>

<!-- EMULATOR -->
<div id="emu-wrapper">
  <div id="emu-header">
    <span class="logo">🏍 EXCITEBIKE</span>
    <span style="font-family:'Rajdhani',sans-serif;font-size:.68rem;color:rgba(255,255,255,.25);letter-spacing:.15em;">NES</span>
    <button class="hdr-btn ml" onclick="toggleFS()">⛶ FULLSCREEN</button>
    <button class="hdr-btn" onclick="goBack()">← VOLVER</button>
  </div>
  <div id="game-container"></div>
</div>

/* ── SPEEDOMETER COUNTER ── */
(function(){
  const el = document.getElementById('speed-num');
  let v=0, target=188;
  const iv = setInterval(()=>{
    v = Math.min(v + 4 + Math.floor(Math.random()*3), target);
    el.textContent = String(v).padStart(3,'0');
    if(v>=target) clearInterval(iv);
  }, 22);
})();

/* ── RACE TIMER (counting up) ── */
(function(){
  const el = document.getElementById('timer');
  let cs=0;
  setInterval(()=>{
    cs++;
    const m = Math.floor(cs/100);
    const s = cs%100;
    el.textContent = `${String(m).padStart(2,'0')}'${String(s).padStart(2,'0')}`;
  }, 80);
})();

/* ── SCROLLING TRACK LANES ── */
(function(){
  const c = document.getElementById('track-canvas');
  const ctx = c.getContext('2d');
  let W, H, offset=0;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  /* ramp bumps */
  const bumps = Array.from({length:6}, (_, i)=>({
    x: i*(W/5)+Math.random()*60,
    w: 40+Math.random()*60,
    h: 12+Math.random()*20,
  }));

  function frame(){
    ctx.clearRect(0,0,W,H);
    offset = (offset+3.5) % W;

    const groundY = H*.78;

    /* ground line */
    ctx.save();
    ctx.globalAlpha=.18;
    ctx.fillStyle='#888';
    ctx.fillRect(0,groundY,W,3);

    /* track lane stripes */
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.5;
    ctx.setLineDash([30,20]);
    ctx.lineDashOffset=-offset;
    ctx.beginPath(); ctx.moveTo(0,groundY-28); ctx.lineTo(W,groundY-28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,groundY+28); ctx.lineTo(W,groundY+28); ctx.stroke();
    ctx.setLineDash([]);

    /* scrolling pixel bumps */
    ctx.globalAlpha=.22;
    for(const b of bumps){
      const bx = ((b.x - offset*1.8) % (W+100) + W+100) % (W+100) - 100;
      ctx.fillStyle='#cc6600';
      ctx.fillRect(bx, groundY-b.h, b.w, b.h);
      /* pixel highlight */
      ctx.fillStyle='rgba(255,180,60,.4)';
      ctx.fillRect(bx, groundY-b.h, b.w, 4);
    }
    ctx.restore();

    /* speed lines from center-left */
    ctx.save();
    ctx.globalAlpha=.12;
    for(let i=0;i<8;i++){
      const y = H*.3 + i*(H*.06);
      const len = 60+i*20;
      ctx.strokeStyle=i%2===0?'#ff6600':'#ffffff';
      ctx.lineWidth=1+i*.3;
      ctx.beginPath();
      ctx.moveTo(((offset*2+i*80)%(W+len))-len, y);
      ctx.lineTo(((offset*2+i*80)%(W+len)), y);
      ctx.stroke();
    }
    ctx.restore();

    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── DUST & DIRT PARTICLES ── */
(function(){
  const c = document.getElementById('dust-canvas');
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);

  const dust = [];
  function mkDust(){
    const groundY = innerHeight*.78;
    return {
      x: Math.random()*innerWidth*.6,
      y: groundY - Math.random()*8,
      vx: -(2+Math.random()*4),
      vy: -(1+Math.random()*3),
      r: 2+Math.random()*5,
      color: Math.random()<.5?'#cc6600':Math.random()<.5?'#ff4400':'#ddaa66',
      alpha:.5+Math.random()*.4,
      life:1, decay:.02+Math.random()*.03,
    };
  }
  for(let i=0;i<20;i++){ const d=mkDust(); d.y-=Math.random()*60; d.life=Math.random(); dust.push(d); }

  function frame(){
    ctx.clearRect(0,0,W,H);
    if(dust.length<30&&Math.random()<.4) dust.push(mkDust());
    for(let i=dust.length-1;i>=0;i--){
      const d=dust[i];
      d.x+=d.vx; d.y+=d.vy; d.vy+=.08;
      d.r*=.97; d.life-=d.decay;
      if(d.life<=0||d.r<.3){ dust.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha=d.alpha*d.life;
      ctx.fillStyle=d.color;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ── LAUNCH ── */
let emuLoaded=false;
function launchGame(){
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('emu-wrapper').classList.add('active');
    if(!emuLoaded) loadEmulator();
  },700);
}
function goBack(){
  const s=document.getElementById('splash');
  document.getElementById('emu-wrapper').classList.remove('active');
  s.style.display=''; setTimeout(()=>s.classList.remove('hidden'),10);
}
function toggleFS(){
  const el=document.getElementById('emu-wrapper');
  if(!document.fullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  else(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
function loadEmulator(){
  emuLoaded=true;
  const romBytes=Uint8Array.from(atob(ROM_B64),c=>c.charCodeAt(0));
  const romUrl=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  const imgBytes=Uint8Array.from(atob(IMG_B64),c=>c.charCodeAt(0));
  const coverUrl=URL.createObjectURL(new Blob([imgBytes],{type:'image/jpeg'}));
  window.EJS_player='#game-container';
  window.EJS_core='fceumm';
  window.EJS_gameUrl=romUrl;
  window.EJS_gameID='excitebike';
  window.EJS_gameName='Excitebike';
  window.EJS_coverURL=coverUrl;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color='#f56a00';
  window.EJS_backgroundColor='#111111';
  window.EJS_startOnLoaded=true;
  window.EJS_language='es';
  window.EJS_Buttons={
    playPause:true,restart:true,mute:true,settings:true,
    fullscreen:true,saveState:true,loadState:true,
    screenRecord:false,gamepad:true,cheat:false,
    volume:true,saveSavFiles:true
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.head.appendChild(s);
}
</script>
