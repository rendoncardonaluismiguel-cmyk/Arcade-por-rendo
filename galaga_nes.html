@keyframes cover-pulse{
  from{transform:scale(1);background-position:center 45%}
  to{transform:scale(1.04);background-position:center 40%}
}

/* Overlays — the art is bright, darken top/bottom more */
.cover-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(0,0,16,0.92) 0%,
      rgba(0,0,16,0.55) 14%,
      rgba(0,0,16,0.1) 28%,
      transparent 40%,
      transparent 60%,
      rgba(0,0,16,0.2) 74%,
      rgba(0,0,16,0.88) 88%,
      rgba(0,0,16,0.98) 100%
    ),
    linear-gradient(90deg,
      rgba(0,0,16,0.55) 0%,transparent 18%,transparent 82%,rgba(0,0,16,0.55) 100%
    );
}

/* Star field */
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:star-tw var(--d,2s) ease-in-out infinite var(--del,0s);
}
@keyframes star-tw{0%,100%{opacity:var(--lo,.04);transform:scale(1)}50%{opacity:var(--hi,.8);transform:scale(1.5)}}

/* Enemy formation flying in */
.enemy{
  position:absolute;z-index:3;pointer-events:none;
  font-size:clamp(10px,2.8vw,16px);
  image-rendering:pixelated;
  animation:enemy-patrol var(--ep,4s) ease-in-out infinite var(--epd,0s);
  filter:drop-shadow(0 0 4px var(--red2));
}
@keyframes enemy-patrol{
  0%,100%{transform:translateX(0) translateY(0)}
  25%{transform:translateX(12px) translateY(-6px)}
  50%{transform:translateX(0) translateY(-10px)}
  75%{transform:translateX(-12px) translateY(-6px)}
}

/* Dive bomber path */
.diver{
  position:absolute;z-index:3;pointer-events:none;
  font-size:clamp(12px,3.5vw,20px);
  opacity:0;
  animation:dive-attack var(--da,4s) ease-in var(--dad,0s) infinite;
  filter:drop-shadow(0 0 6px var(--red));
}
@keyframes dive-attack{
  0%{opacity:0;transform:translate(var(--dsx,0),var(--dsy,-30px)) rotate(0deg)}
  8%{opacity:1}
  60%{opacity:1;transform:translate(var(--dex,30px),var(--dey,60vh)) rotate(var(--drot,180deg))}
  65%,100%{opacity:0;transform:translate(var(--dex,30px),var(--dey,80vh)) rotate(var(--drot,180deg))}
}

/* Player ship at bottom */
.player-ship{
  position:absolute;bottom:28%;left:50%;transform:translateX(-50%);
  z-index:3;pointer-events:none;
  font-size:clamp(16px,4.5vw,26px);
  filter:drop-shadow(0 0 6px var(--yellow),0 0 12px rgba(255,204,0,0.4));
  animation:player-bob 2s ease-in-out infinite alternate;
}
@keyframes player-bob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-5px)}}

/* Bullets */
.bullet{
  position:absolute;z-index:3;pointer-events:none;
  width:3px;border-radius:1px;
  background:var(--yellow2);
  box-shadow:0 0 5px var(--yellow);
  opacity:0;
  animation:bullet-up var(--bu,0.8s) linear infinite var(--bud,0s);
}
@keyframes bullet-up{
  0%{opacity:0;height:0;transform:translateY(0)}
  5%{opacity:1;height:clamp(15px,4vw,25px)}
  100%{opacity:0;height:clamp(15px,4vw,25px);transform:translateY(-70vh)}
}

/* Enemy bullet */
.ebullet{
  position:absolute;z-index:3;pointer-events:none;
  width:2px;border-radius:1px;
  background:var(--red3);
  box-shadow:0 0 4px var(--red2);
  opacity:0;
  animation:ebullet-down var(--ebu,1.2s) linear infinite var(--ebud,0s);
}
@keyframes ebullet-down{
  0%{opacity:0;height:0;transform:translateY(0)}
  5%{opacity:1;height:clamp(12px,3.5vw,20px)}
  100%{opacity:0;height:clamp(12px,3.5vw,20px);transform:translateY(60vh)}
}

/* Explosion flashes */
.kaboom{
  position:absolute;z-index:4;pointer-events:none;
  border-radius:50%;
  animation:kaboom-pop var(--kp,3.5s) ease-out infinite var(--kd,0s);opacity:0;
}
@keyframes kaboom-pop{
  0%,90%,100%{opacity:0;transform:scale(0.2)}
  91%{opacity:1;transform:scale(0.6)}
  93%{opacity:0.7;transform:scale(1.4)}
  95%{opacity:0;transform:scale(1.8)}
}

/* Scanlines */
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.18) 2px,rgba(0,0,0,0.18) 4px);animation:scan-fl 6s ease-in-out infinite;}
@keyframes scan-fl{0%,95%,100%{opacity:1}96%{opacity:0.7}97.5%{opacity:1}99%{opacity:0.82}}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 25%,rgba(0,0,20,0.8) 100%);}

/* ── TITLE TOP ── */
.title-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.5vw,10px);
  animation:title-in 0.8s cubic-bezier(0.22,1,0.36,1) forwards;opacity:0;
}
@keyframes title-in{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:none}}

.title-galaga{
  font-family:'Press Start 2P',monospace;
  font-size:clamp(28px,9.5vw,58px);
  line-height:1;
  text-align:center;
  color:var(--yellow2);
  text-shadow:
    4px 4px 0 var(--red),
    6px 6px 0 #660000,
    0 0 20px var(--glow-yellow),
    0 0 50px rgba(255,204,0,0.3);
  animation:galaga-flash 2s ease-in-out infinite;
}
@keyframes galaga-flash{
  0%,100%{text-shadow:4px 4px 0 var(--red),6px 6px 0 #660000,0 0 16px var(--glow-yellow);}
  50%{text-shadow:4px 4px 0 var(--red),6px 6px 0 #660000,0 0 34px rgba(255,220,0,0.9),0 0 65px rgba(255,204,0,0.35);}
}

/* Score display */
.score-row{
  display:flex;align-items:center;gap:clamp(8px,2.5vw,16px);
  background:rgba(0,0,16,0.8);
  border:2px solid rgba(255,204,0,0.3);
  padding:clamp(4px,1.2vw,7px) clamp(10px,3vw,18px);
}
.sc-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
.sc-label{font-family:'Press Start 2P',monospace;font-size:clamp(4px,1vw,6px);color:var(--red3);letter-spacing:1px;}
.sc-val{font-family:'Press Start 2P',monospace;font-size:clamp(8px,2.2vw,12px);color:var(--yellow2);text-shadow:0 0 6px var(--yellow);animation:sc-blink 1.2s steps(1) infinite;}
@keyframes sc-blink{0%,49%{opacity:1}50%,100%{opacity:0.6}}
.sc-sep{width:2px;height:clamp(22px,5vw,32px);background:rgba(255,204,0,0.2);}

.meta-row{
  display:flex;align-items:center;gap:clamp(6px,2vw,10px);
  background:rgba(0,0,16,0.75);
  border:1px solid rgba(34,85,255,0.3);
  padding:clamp(4px,1vw,5px) clamp(10px,2.5vw,16px);
}
.meta-dot{width:5px;height:5px;border-radius:50%;background:var(--red2);box-shadow:0 0 5px var(--red2);animation:dot-bl 1.5s ease-in-out infinite;}
.meta-dot.b{background:var(--blue3);box-shadow:0 0 5px var(--blue2);animation-delay:0.75s;}
@keyframes dot-bl{0%,100%{opacity:0.3}50%{opacity:1}}
.meta-text{font-size:clamp(7px,1.8vw,9px);letter-spacing:4px;color:rgba(100,140,255,0.65);text-transform:uppercase;}

/* ── PLAY BUTTON BOTTOM ── */
.btn-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:btn-in 0.8s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;opacity:0;
}
@keyframes btn-in{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}

#play-btn{
  position:relative;overflow:hidden;
  padding:clamp(13px,3.2vw,17px) clamp(28px,8vw,52px);
  background:rgba(0,0,16,0.75);
  border:2px solid var(--yellow);
  border-top:1px solid var(--yellow2);
  cursor:pointer;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(10px,2.8vw,13px);
  color:var(--yellow2);
  letter-spacing:clamp(2px,1vw,4px);
  text-shadow:0 0 8px var(--yellow),2px 2px 0 rgba(0,0,0,0.8);
  box-shadow:0 0 18px var(--glow-yellow),inset 0 0 12px rgba(255,204,0,0.04);
  animation:btn-lock 2s ease-in-out infinite;
  text-transform:uppercase;
}
@keyframes btn-lock{
  0%,100%{box-shadow:0 0 14px var(--glow-yellow),inset 0 0 10px rgba(255,204,0,0.03);}
  50%{box-shadow:0 0 32px rgba(255,220,0,0.65),0 0 60px rgba(255,204,0,0.18),inset 0 0 18px rgba(255,204,0,0.07);}
}
#play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,220,0,0.12),transparent);
  transform:translateX(-100%);animation:lock-sw 2.2s ease-in-out infinite;
}
@keyframes lock-sw{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ct{position:absolute;border-style:solid;opacity:0.9;}
.ct.tl{top:-1px;left:-1px;width:9px;height:9px;border-color:var(--red2);border-width:2px 0 0 2px;}
.ct.tr{top:-1px;right:-1px;width:9px;height:9px;border-color:var(--blue2);border-width:2px 2px 0 0;}
.ct.bl{bottom:-1px;left:-1px;width:9px;height:9px;border-color:var(--blue2);border-width:0 0 2px 2px;}
.ct.br{bottom:-1px;right:-1px;width:9px;height:9px;border-color:var(--red2);border-width:0 2px 2px 0;}
#play-btn:active{background:rgba(255,204,0,0.08);}

.creds{font-size:clamp(5px,1.3vw,7px);letter-spacing:3px;color:rgba(80,110,200,0.2);text-transform:uppercase;}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{height:36px;min-height:36px;background:#000010;border-bottom:2px solid var(--red);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;}
#topbar .logo{color:var(--yellow);font-size:11px;letter-spacing:4px;font-family:'Press Start 2P',monospace;text-shadow:0 0 8px var(--yellow),2px 2px 0 var(--red);}
.tbtn{background:none;border:1px solid rgba(255,204,0,0.25);color:rgba(255,220,100,0.8);font-size:15px;padding:3px 9px;cursor:pointer;border-radius:2px;}
.tbtn:active{background:rgba(255,204,0,0.1);}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);}
#game{width:100%;height:100%;display:block;}
#loader{position:absolute;inset:0;z-index:10;background:#000010;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.llogo{font-family:'Press Start 2P',monospace;color:var(--yellow);font-size:14px;letter-spacing:6px;text-shadow:2px 2px 0 var(--red),0 0 10px var(--yellow);}
#lbar-wrap{width:clamp(180px,55vw,260px);height:6px;background:#000020;overflow:hidden;border:2px solid rgba(255,204,0,0.2);}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--blue2));transition:width 0.3s;box-shadow:0 0 8px var(--yellow);}
#lmsg{color:rgba(255,200,50,0.4);font-size:9px;letter-spacing:3px;text-align:center;}
#lerr{display:none;color:#ff4444;font-size:9px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>

<script>
// Stars
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;
      --lo:${(Math.random()*0.06+0.02).toFixed(2)};--hi:${(Math.random()*0.7+0.15).toFixed(2)};
      --d:${(Math.random()*3+1.5).toFixed(1)}s;--del:${(Math.random()*5).toFixed(1)}s;`;
    c.appendChild(s);
  }
})();

// Enemy formation grid
(function(){
  const c=document.getElementById('enemies');
  const icons=['👾','🛸','👾'];
  const rows=3, cols=8;
  for(let r=0;r<rows;r++){
    for(let col=0;col<cols;col++){
      const e=document.createElement('div');e.className='enemy';
      const icon=icons[r%icons.length];
      e.textContent=icon;
      const left=15+col*(70/cols);
      const top=8+r*5;
      const dur=3+Math.random()*2;
      const delay=Math.random()*2+col*0.1;
      e.style.cssText=`left:${left}%;top:${top}%;--ep:${dur.toFixed(1)}s;--epd:${delay.toFixed(1)}s;font-size:clamp(8px,2vw,12px);`;
      c.appendChild(e);
    }
  }
})();

// Score animation
(function(){
  const hi=document.getElementById('hiScore');
  const p1=document.getElementById('p1Score');
  let h=30000,p=0;
  setInterval(()=>{
    p+=Math.floor(Math.random()*160+40);
    if(p>h)h=p;
    hi.textContent=String(h).padStart(6,'0');
    p1.textContent=String(p).padStart(6,'0');
  },400);
})();

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function boot(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';loadEmulator();}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}
function loadEmulator(){
  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}
  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);
  setProgress(40,'CARGANDO EMULADOR NES...');
  window.EJS_player='#game';
  window.EJS_core='nes';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Galaga';
  window.EJS_color='#ffcc00';
  window.EJS_backgroundColor='#000010';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,zoom:false,crt:false,ratio:false,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE NES... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'👾 ¡ATTACK! GOOD LUCK!');
    setTimeout(()=>{document.getElementById('loader').style.display='none';},600);
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión a internet.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE NES...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
