<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f380f">
<title>Snake for GBA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --gb0:#0f380f; --gb1:#306230; --gb2:#8bac0f; --gb3:#9bbc0f; --gb4:#c4d4a0;
  --topbar:44px;
}
html,body{width:100%;height:100%;background:var(--gb0);overflow:hidden;font-family:'Press Start 2P',monospace;touch-action:none;}

#topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;height:var(--topbar);
  background:var(--gb0);border-bottom:3px solid var(--gb1);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
}
#topbar .title{font-size:.62rem;letter-spacing:.04em;color:var(--gb3);text-shadow:1px 1px 0 var(--gb0);}
#topbar .badge{font-size:.4rem;background:var(--gb1);color:var(--gb4);border:1px solid var(--gb2);border-radius:2px;padding:2px 6px;margin-left:8px;letter-spacing:.06em;}
#topbar .controls{display:flex;gap:8px;}
#topbar button{background:var(--gb1);border:2px solid var(--gb2);color:var(--gb4);border-radius:2px;padding:4px 10px;font-family:'Press Start 2P',monospace;font-size:.4rem;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .12s;}
#topbar button:hover{background:var(--gb2);color:var(--gb0);}

#cover{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;transition:opacity .5s ease;}
#cover.hide{opacity:0;pointer-events:none;}

#cover-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;
  filter:grayscale(.8) contrast(1.15) brightness(1.1) sepia(.35) hue-rotate(42deg) saturate(5);
}
#cover-bg::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0,rgba(0,0,0,.07) 1px,transparent 1px,transparent 4px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0,rgba(0,0,0,.04) 1px,transparent 1px,transparent 4px);
  pointer-events:none;
}
#cover-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,56,15,.45) 0%,transparent 25%,transparent 50%,rgba(15,56,15,.97) 100%);
}
#cover-fade{position:absolute;bottom:0;left:0;right:0;height:52%;background:linear-gradient(transparent,rgba(15,56,15,1) 100%);pointer-events:none;}

/* canvas snake game preview */
#snake-canvas{position:absolute;top:calc(var(--topbar) + 10px);left:50%;transform:translateX(-50%);opacity:.55;image-rendering:pixelated;border:2px solid var(--gb1);}

/* GBA wide-screen frame */
.gba-frame{
  position:absolute;top:calc(var(--topbar) + 6px);left:50%;transform:translateX(-50%);
  width:min(200px,55vw);height:min(130px,35vw);
  border:3px solid var(--gb1);
  box-shadow:inset 2px 2px 0 var(--gb2),inset -2px -2px 0 var(--gb0),4px 4px 0 rgba(0,0,0,.5);
  background:var(--gb3);overflow:hidden;pointer-events:none;
}

#cover-info{position:relative;z-index:5;text-align:center;padding-bottom:62px;padding-inline:20px;}

.cover-eyebrow{font-size:.42rem;letter-spacing:.18em;color:var(--gb2);text-transform:uppercase;margin-bottom:10px;}

.pixel-box{
  display:inline-block;border:3px solid var(--gb1);
  box-shadow:inset 2px 2px 0 var(--gb2),inset -2px -2px 0 var(--gb0),3px 3px 0 var(--gb0);
  padding:10px 18px;margin-bottom:12px;background:var(--gb3);
}
#cover-info h1{font-size:clamp(.9rem,5vw,2.2rem);letter-spacing:.04em;line-height:1.3;color:var(--gb0);text-shadow:2px 2px 0 var(--gb1);}
#cover-info h1 span{display:block;font-size:.5em;color:var(--gb1);letter-spacing:.15em;margin-top:3px;}

.score-row{font-size:.4rem;color:var(--gb2);letter-spacing:.1em;margin:8px 0 4px;}
.tap-hint{font-size:.4rem;color:var(--gb2);letter-spacing:.1em;margin-top:10px;animation:blink .9s step-end infinite;}
@keyframes blink{0%,100%{opacity:.7;}50%{opacity:0;}}
.cover-platform{font-size:.38rem;color:var(--gb1);letter-spacing:.14em;margin-top:8px;}

#play-btn{
  margin-top:22px;display:inline-flex;align-items:center;gap:10px;
  background:var(--gb1);color:var(--gb4);border:3px solid var(--gb0);border-radius:2px;
  padding:12px 32px;font-family:'Press Start 2P',monospace;font-size:.62rem;letter-spacing:.06em;cursor:pointer;
  box-shadow:4px 4px 0 var(--gb0);transition:transform .08s,box-shadow .08s;
}
#play-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--gb0);}
#play-btn:hover{background:var(--gb2);color:var(--gb0);}

#emu-wrap{position:fixed;top:var(--topbar);left:0;right:0;bottom:0;display:none;background:var(--gb0);}
#emu-wrap.visible{display:block;}
#game{width:100%;height:100%;}

#loader{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--gb0);}
#loader.gone{display:none;}
.gb-boot{border:4px solid var(--gb1);box-shadow:inset 2px 2px 0 var(--gb2),4px 4px 0 rgba(0,0,0,.4);padding:26px 28px;background:var(--gb3);display:flex;flex-direction:column;align-items:center;gap:14px;min-width:min(270px,80vw);}
.boot-snake{font-size:2rem;animation:wiggle .6s ease-in-out infinite alternate;}
@keyframes wiggle{from{transform:rotate(-10deg);}to{transform:rotate(10deg);}}
.boot-logo{font-size:1rem;letter-spacing:.05em;color:var(--gb0);text-shadow:2px 2px 0 var(--gb1);}
.boot-sub{font-size:.36rem;letter-spacing:.18em;color:var(--gb1);}
.load-bar-wrap{width:100%;height:10px;background:var(--gb2);border:2px solid var(--gb0);border-radius:1px;overflow:hidden;}
#lbar{height:100%;width:0%;background:var(--gb0);transition:width .3s ease;}
#lmsg{font-size:.36rem;color:var(--gb1);letter-spacing:.12em;text-align:center;}
#lerr{display:none;font-size:.55rem;color:#c00;text-align:center;max-width:260px;white-space:pre-line;line-height:1.6;}
</style>
</head>
<body>

<div id="topbar">
  <div class="title">Snake for GBA <span class="badge">GBA</span></div>
  <div class="controls">
    <button id="muteBtn" onclick="toggleMute()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      MUTE
    </button>
    <button onclick="toggleFS()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      FULL
    </button>
  </div>
</div>

<div id="cover" onclick="startGame()">
  <div id="cover-bg"></div>
  <div id="cover-fade"></div>

  <!-- live mini snake preview in GBA frame -->
  <div class="gba-frame">
    <canvas id="snake-canvas" width="194" height="124"></canvas>
  </div>

  <div id="cover-info">
    <p class="cover-eyebrow">HOMEBREW · GAME BOY ADVANCE · 2003</p>
    <div class="pixel-box">
      <h1>SNAKE<span>FOR GBA</span></h1>
    </div>
    <div class="score-row">SCORE: 00000 &nbsp;|&nbsp; HI: 00000</div>
    <p class="tap-hint">&#9658; PRESS START &#9668;</p>
    <p class="cover-platform">GBA · HOMEBREW · 161KB</p>
    <button id="play-btn">&#9658; START</button>
  </div>
</div>

<div id="emu-wrap">
  <div id="loader">
    <div class="gb-boot">
      <div class="boot-snake">&#128013;</div>
      <div class="boot-logo">SNAKE FOR GBA</div>
      <div class="boot-sub">GAME BOY ADVANCE</div>
      <div class="load-bar-wrap"><div id="lbar"></div></div>
      <p id="lmsg">LOADING...</p>
      <p id="lerr"></p>
    </div>
  </div>
  <div id="game"></div>
</div>

// ── Mini snake game on canvas ──────────────────────────────────
(function(){
  const C = document.getElementById('snake-canvas');
  const ctx = C.getContext('2d');
  const W = C.width, H = C.height;
  const CELL = 8, COLS = Math.floor(W/CELL), ROWS = Math.floor(H/CELL);
  const GB0='#0f380f', GB1='#306230', GB2='#8bac0f', GB3='#9bbc0f';

  let snake, dir, food, score, tick;

  function rand(n){return Math.floor(Math.random()*n);}
  function placeFood(){food={x:rand(COLS),y:rand(ROWS)};}
  function init(){
    snake=[{x:6,y:5},{x:5,y:5},{x:4,y:5}];
    dir={x:1,y:0};score=0;placeFood();
  }

  function step(){
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    // wrap
    head.x=(head.x+COLS)%COLS; head.y=(head.y+ROWS)%ROWS;
    // self collision -> reset
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){init();return;}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score++;placeFood();}
    else snake.pop();
    // auto steer: simple AI that chases food
    const dx=food.x-head.x, dy=food.y-head.y;
    if(Math.abs(dx)>=Math.abs(dy)){
      if(dx>0&&dir.x!=-1)dir={x:1,y:0};
      else if(dx<0&&dir.x!=1)dir={x:-1,y:0};
      else if(dy>0&&dir.y!=-1)dir={x:0,y:1};
      else dir={x:0,y:-1};
    } else {
      if(dy>0&&dir.y!=-1)dir={x:0,y:1};
      else if(dy<0&&dir.y!=1)dir={x:0,y:-1};
      else if(dx>0&&dir.x!=-1)dir={x:1,y:0};
      else dir={x:-1,y:0};
    }
  }

  function draw(){
    ctx.fillStyle=GB3;ctx.fillRect(0,0,W,H);
    // grid
    ctx.fillStyle='rgba(15,56,15,0.12)';
    for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)if((x+y)%2===0)ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    // food
    ctx.fillStyle=GB0;ctx.fillRect(food.x*CELL+1,food.y*CELL+1,CELL-2,CELL-2);
    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?GB0:GB1;
      ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    });
  }

  init();
  setInterval(()=>{step();draw();},120);
})();

// ── Emulator ──────────────────────────────────────────────────
let started=false, muted=false;
function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}

function startGame(){
  if(started)return; started=true;
  document.getElementById('cover').classList.add('hide');
  document.getElementById('emu-wrap').classList.add('visible');
  setProgress(10,'READING ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK \u2014 '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('ROM Error: '+e.message);return;}
  const romURL=URL.createObjectURL(new Blob([romBytes],{type:'application/octet-stream'}));
  setProgress(40,'LOADING CORE...');
  window.EJS_player='#game';
  window.EJS_core='mgba';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Snake for GBA';
  window.EJS_color='#8bac0f';
  window.EJS_backgroundColor='#0f380f';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'LOADING... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){setProgress(100,'READY!');setTimeout(()=>document.getElementById('loader').classList.add('gone'),600);};
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{const s2=document.createElement('script');s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';s2.onerror=()=>showError('Could not load EmulatorJS.\nCheck your internet.');document.head.appendChild(s2);};
  document.head.appendChild(s);
  setTimeout(()=>document.getElementById('loader').classList.add('gone'),15000);
}

document.getElementById('cover').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{
  if(!started&&(e.key==='Enter'||e.key===' '))startGame();
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='m'||e.key==='M')toggleMute();
});

function toggleMute(){
  muted=!muted;
  const btn=document.getElementById('muteBtn');
  btn.innerHTML=muted
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg> UNMUTE'
    : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> MUTE';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else document.exitFullscreen?.();
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
