<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#1a0030">
<title>IndestructoTank! — GB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}

#splash{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:flex-end;justify-content:center;
  background:#1a0030;
  padding-bottom:clamp(22px,6.5vw,48px);
}

/* Dark purple/smoke bg behind the banner image */
.bg{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 50% 60%, rgba(80,20,120,0.5) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(200,80,0,0.3) 0%, transparent 60%),
    linear-gradient(180deg,#0a0015 0%,#1a0030 40%,#2a0040 70%,#1a1000 100%);
}

/* Cover image — banner is landscape so fill width, crop vertically */
.cover-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 35%;
}

/* Fire glow overlay at bottom */
.fire-glow{
  position:absolute;bottom:0;left:0;right:0;
  height:55%;pointer-events:none;
  background:linear-gradient(180deg,
    transparent 0%,
    rgba(80,20,0,0.35) 40%,
    rgba(40,10,0,0.88) 100%
  );
}

.scanlines{
  position:absolute;inset:0;pointer-events:none;opacity:0.1;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.3) 3px,rgba(0,0,0,0.3) 4px);
}

/* GB badge */
.gb-badge{
  position:absolute;top:clamp(10px,3vw,20px);right:clamp(10px,3vw,20px);
  background:rgba(10,0,20,0.82);
  border:2px solid rgba(160,80,255,0.6);
  padding:4px 14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(11px,3vw,16px);
  font-weight:800;
  color:#c080ff;
  letter-spacing:4px;
  box-shadow:0 0 10px rgba(140,60,255,0.25),2px 2px 0 rgba(0,0,0,0.6);
  pointer-events:none;
}

/* Play button */
#play-btn{
  position:relative;z-index:10;overflow:hidden;
  padding:clamp(13px,3.5vw,20px) clamp(28px,8.5vw,62px);
  background:linear-gradient(180deg,#9020e0 0%,#6010b0 50%,#380880 100%);
  border:none;
  border-top:3px solid rgba(220,140,255,0.35);
  border-bottom:4px solid rgba(0,0,0,0.55);
  cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  font-size:clamp(18px,5vw,30px);
  color:#fff;
  letter-spacing:clamp(3px,1.2vw,7px);
  text-transform:uppercase;
  text-shadow:1px 2px 4px rgba(0,0,0,0.5);
  border-radius:4px;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  box-shadow:
    0 0 28px rgba(144,32,224,0.75),
    0 0 60px rgba(144,32,224,0.25),
    0 6px 0 rgba(0,0,0,0.55);
  animation:btn-tank 1.8s ease-in-out infinite;
}
@keyframes btn-tank{
  0%,100%{box-shadow:0 0 28px rgba(144,32,224,0.75),0 0 60px rgba(144,32,224,0.25),0 6px 0 rgba(0,0,0,0.55);}
  50%{box-shadow:0 0 50px rgba(180,60,255,0.9),0 0 100px rgba(200,80,0,0.3),0 6px 0 rgba(0,0,0,0.55);}
}
#play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,transparent 50%);
}
#play-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,0.5);}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{
  height:36px;min-height:36px;
  background:linear-gradient(90deg,#0a0015,#150025,#0a0015);
  border-bottom:2px solid #9020e0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;flex-shrink:0;
  box-shadow:0 2px 12px rgba(144,32,224,0.25);
}
#topbar .logo{color:#c080ff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:3px;text-shadow:0 0 8px rgba(144,32,224,0.6);}
.tbtn{background:#0a0015;border:1px solid rgba(144,32,224,0.4);color:#c080ff;font-size:14px;padding:4px 10px;cursor:pointer;border-radius:2px;}
.tbtn:active{transform:translate(1px,1px);}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.05) 2px,rgba(0,0,0,.05) 4px);}
#game{width:100%;height:100%;display:block;}
#loader{
  position:absolute;inset:0;z-index:10;
  background:linear-gradient(180deg,#060010,#0f0020);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.llogo{font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#c080ff;font-size:20px;letter-spacing:5px;text-shadow:0 0 10px rgba(144,32,224,0.6);}
#lbar-wrap{width:clamp(180px,60vw,280px);height:12px;background:rgba(0,0,0,0.5);overflow:hidden;border:2px solid rgba(144,32,224,0.45);box-shadow:0 0 8px rgba(144,32,224,0.2);}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,#380880,#9020e0,#c080ff,#ff8020);background-size:300% 100%;transition:width 0.3s;animation:lbar-shift 1s linear infinite;}
@keyframes lbar-shift{0%{background-position:0%}100%{background-position:100%}}
#lmsg{color:#c080ff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;letter-spacing:3px;text-align:center;}
#lerr{display:none;color:#ff6040;font-size:8px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>
</head>

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function boot(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';loadEmulator();}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}
function loadEmulator(){
  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}
  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);
  setProgress(40,'CARGANDO EMULADOR GB...');
  window.EJS_player='#game';
  window.EJS_core='gambatte';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='IndestructoTank!';
  window.EJS_color='#9020e0';
  window.EJS_backgroundColor='#0f0020';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE GB... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'💥 INDESTRUCTIBLE! — GO!');
    setTimeout(()=>{document.getElementById('loader').style.display='none';},600);
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE GB...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
