/* Overlay */
.cover-overlay{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(0,0,16,0.85) 0%,
      rgba(0,0,16,0.45) 13%,
      rgba(0,0,16,0.08) 28%,
      transparent 42%,
      transparent 60%,
      rgba(0,0,16,0.28) 74%,
      rgba(0,0,16,0.88) 88%,
      rgba(0,0,16,0.98) 100%
    ),
    linear-gradient(90deg,
      rgba(0,0,16,0.6) 0%,transparent 20%,transparent 80%,rgba(0,0,16,0.6) 100%
    );
}

/* Stars field */
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:star-tw var(--d,2s) ease-in-out infinite var(--del,0s);
}
@keyframes star-tw{0%,100%{opacity:var(--lo,.05);transform:scale(1)}50%{opacity:var(--hi,.7);transform:scale(1.4)}}

/* Portal / wormhole effect (references the squares in the art) */
.portal{
  position:absolute;top:12%;left:50%;transform:translateX(-50%);
  z-index:2;pointer-events:none;
  animation:portal-pulse 4s ease-in-out infinite;
}
.portal-ring{
  position:absolute;border:1px solid;border-radius:4px;
  left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);
  animation:portal-spin 8s linear infinite;
}
@keyframes portal-pulse{0%,100%{opacity:0.25}50%{opacity:0.5}}
@keyframes portal-spin{from{transform:translate(-50%,-50%) rotate(45deg)}to{transform:translate(-50%,-50%) rotate(405deg)}}

/* Laser shots */
.laser{
  position:absolute;z-index:3;pointer-events:none;
  height:2px;border-radius:1px;
  animation:laser-fire var(--lf,1.5s) ease-out infinite var(--ld,0s);opacity:0;
}
@keyframes laser-fire{
  0%{opacity:0;width:0;left:50%}8%{opacity:1}
  100%{opacity:0;width:clamp(50px,18vw,120px);left:var(--lt,60%)}
}

/* Explosions */
.explosion{
  position:absolute;z-index:3;pointer-events:none;
  border-radius:50%;
  animation:explode var(--ef,3s) ease-out infinite var(--ed,0s);opacity:0;
}
@keyframes explode{
  0%{opacity:0;transform:scale(0.2)}5%{opacity:0.9}20%{opacity:0.5}35%,100%{opacity:0;transform:scale(2)}
}

/* Shield/energy ring around ship */
.shield-ring{
  position:absolute;border-radius:50%;border:1px solid rgba(68,170,255,0.4);
  z-index:3;pointer-events:none;
  animation:shield-pulse 3s ease-in-out infinite var(--sd,0s);
}
@keyframes shield-pulse{
  0%,100%{transform:translate(-50%,-50%) scale(0.8);opacity:0}
  50%{transform:translate(-50%,-50%) scale(1.2);opacity:0.6}
}

/* Scanlines */
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.14) 2px,rgba(0,0,0,0.14) 4px);}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse 82% 82% at 50% 50%,transparent 22%,rgba(0,0,16,0.82) 100%);}

/* ── TITLE TOP ── */
.title-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(5px,1.3vw,9px);
  animation:title-in 1s cubic-bezier(0.22,1,0.36,1) forwards;opacity:0;
}
@keyframes title-in{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:none}}

.title-defender{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(32px,10.5vw,64px);
  font-weight:900;
  line-height:0.88;
  letter-spacing:clamp(2px,1vw,6px);
  text-align:center;
  background:linear-gradient(135deg,
    var(--cyan2) 0%,var(--cyan) 20%,
    var(--white) 35%,
    var(--blue3) 50%,var(--blue2) 65%,
    var(--purple3) 82%,var(--purple2) 100%
  );
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.95)) drop-shadow(0 0 20px var(--glow-blue));
  animation:def-glow 3s ease-in-out infinite;
}
@keyframes def-glow{
  0%,100%{filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.95)) drop-shadow(0 0 18px var(--glow-blue));}
  50%{filter:drop-shadow(3px 3px 0 rgba(0,0,0,0.95)) drop-shadow(0 0 38px rgba(68,170,255,0.75)) drop-shadow(0 0 72px rgba(153,51,255,0.2));}
}
.title-ii{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(18px,5.5vw,34px);
  font-weight:700;
  letter-spacing:clamp(8px,3.5vw,18px);
  color:var(--purple3);
  text-shadow:0 0 14px var(--glow-purple),2px 2px 0 rgba(0,0,0,0.9);
  animation:ii-pulse 2.5s ease-in-out infinite 0.5s;
}
@keyframes ii-pulse{
  0%,100%{text-shadow:0 0 10px var(--glow-purple),2px 2px 0 rgba(0,0,0,0.9);}
  50%{text-shadow:0 0 26px rgba(153,51,255,0.8),0 0 55px rgba(102,0,204,0.25),2px 2px 0 rgba(0,0,0,0.9);}
}

.meta-row{
  display:flex;align-items:center;gap:clamp(6px,2vw,12px);
  background:rgba(0,0,16,0.78);
  border:1px solid rgba(26,111,255,0.3);
  padding:clamp(4px,1.2vw,6px) clamp(12px,3vw,20px);
  box-shadow:0 0 10px rgba(26,111,255,0.1);
}
.meta-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 5px var(--cyan);animation:dot-bl 1.5s ease-in-out infinite;}
.meta-dot.p{background:var(--purple3);box-shadow:0 0 5px var(--purple2);animation-delay:0.75s;}
@keyframes dot-bl{0%,100%{opacity:0.3}50%{opacity:1}}
.meta-text{font-size:clamp(7px,1.8vw,9px);letter-spacing:4px;color:rgba(68,170,255,0.65);text-transform:uppercase;}

/* ── PLAY BUTTON BOTTOM ── */
.btn-wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  animation:btn-in 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;opacity:0;
}
@keyframes btn-in{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}

#play-btn{
  position:relative;overflow:hidden;
  padding:clamp(13px,3.2vw,17px) clamp(28px,8vw,52px);
  background:rgba(0,0,16,0.72);
  border:1px solid var(--blue2);
  border-top:1px solid var(--cyan);
  cursor:pointer;
  font-family:'Orbitron',sans-serif;
  font-size:clamp(12px,3.2vw,16px);
  font-weight:700;
  color:var(--cyan2);
  letter-spacing:clamp(3px,1.5vw,6px);
  text-transform:uppercase;
  text-shadow:0 0 10px var(--glow-cyan);
  box-shadow:0 0 20px var(--glow-blue),inset 0 0 14px rgba(26,111,255,0.04);
  animation:btn-thrust 2s ease-in-out infinite;
}
@keyframes btn-thrust{
  0%,100%{box-shadow:0 0 15px var(--glow-blue),inset 0 0 10px rgba(26,111,255,0.03);border-color:rgba(68,170,255,0.6);}
  50%{box-shadow:0 0 35px rgba(68,170,255,0.6),0 0 65px rgba(153,51,255,0.15),inset 0 0 20px rgba(26,111,255,0.07);border-color:var(--cyan);}
}
#play-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(0,221,255,0.1),rgba(153,51,255,0.07),transparent);
  transform:translateX(-100%);animation:warp-sw 2.5s ease-in-out infinite;
}
@keyframes warp-sw{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ct{position:absolute;border-style:solid;opacity:0.9;}
.ct.tl{top:-1px;left:-1px;width:9px;height:9px;border-color:var(--cyan);border-width:2px 0 0 2px;}
.ct.tr{top:-1px;right:-1px;width:9px;height:9px;border-color:var(--purple2);border-width:2px 2px 0 0;}
.ct.bl{bottom:-1px;left:-1px;width:9px;height:9px;border-color:var(--purple2);border-width:0 0 2px 2px;}
.ct.br{bottom:-1px;right:-1px;width:9px;height:9px;border-color:var(--cyan);border-width:0 2px 2px 0;}
#play-btn:active{background:rgba(26,111,255,0.08);}

.creds{font-size:clamp(5px,1.3vw,7px);letter-spacing:3px;color:rgba(40,100,200,0.2);text-transform:uppercase;}

/* ===== APP ===== */
#app{display:none;flex-direction:column;width:100%;height:100%;}
#topbar{height:36px;min-height:36px;background:linear-gradient(90deg,#000010,#00001a,#000010);border-bottom:1px solid rgba(26,111,255,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;}
#topbar .logo{color:var(--blue2);font-size:12px;letter-spacing:4px;font-family:'Orbitron',sans-serif;font-weight:700;text-shadow:0 0 8px var(--glow-blue);}
.tbtn{background:none;border:1px solid rgba(26,111,255,0.25);color:rgba(68,170,255,0.8);font-size:15px;padding:3px 9px;cursor:pointer;border-radius:2px;}
.tbtn:active{background:rgba(26,111,255,0.1);}
#screen{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0;}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);}
#game{width:100%;height:100%;display:block;}
#loader{position:absolute;inset:0;z-index:10;background:#000010;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.llogo{font-family:'Orbitron',sans-serif;font-weight:900;color:var(--blue2);font-size:14px;letter-spacing:5px;text-shadow:0 0 12px var(--glow-blue);}
#lbar-wrap{width:clamp(180px,55vw,260px);height:3px;background:#000020;overflow:hidden;border:1px solid rgba(26,111,255,0.2);}
#lbar{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));transition:width 0.3s;box-shadow:0 0 8px var(--blue2);}
#lmsg{color:rgba(68,170,255,0.4);font-size:9px;letter-spacing:3px;text-align:center;}
#lerr{display:none;color:#ff4444;font-size:9px;letter-spacing:2px;text-align:center;white-space:pre-line;}
</style>

(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<120;i++){

      --lo:${(Math.random()*0.08+0.02).toFixed(2)};--hi:${(Math.random()*0.6+0.15).toFixed(2)};

    c.appendChild(r);
  });
})();

function b64ToBytes(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function boot(){document.getElementById('splash').style.display='none';document.getElementById('app').style.display='flex';loadEmulator();}
function setProgress(pct,msg){document.getElementById('lbar').style.width=pct+'%';document.getElementById('lmsg').textContent=msg;}
function showError(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';setProgress(100,'ERROR');}
function loadEmulator(){
  setProgress(10,'DECODIFICANDO ROM...');
  let romBytes;
  try{romBytes=b64ToBytes(ROM_B64);setProgress(30,'ROM OK — '+(romBytes.length/1024).toFixed(0)+'KB');}
  catch(e){showError('Error ROM: '+e.message);return;}
  const romBlob=new Blob([romBytes],{type:'application/octet-stream'});
  const romURL=URL.createObjectURL(romBlob);
  setProgress(40,'CARGANDO EMULADOR NES...');
  window.EJS_player='#game';
  window.EJS_core='nes';
  window.EJS_gameUrl=romURL;
  window.EJS_gameName='Defender II';
  window.EJS_color='#1a6fff';
  window.EJS_backgroundColor='#000010';
  window.EJS_startOnLoaded=true;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_VirtualGamepad=true;
  window.EJS_Buttons={gamepad:true,mute:true,settings:true,fullscreen:false,save:true,load:true,screenshot:false,cheat:false,volume:true,quickSave:true,quickLoad:true,zoom:false,crt:false,ratio:false,reset:true};
  window.EJS_defaultOptions={'save-state-slot':1,'video-smooth':false};
  window.EJS_onLoadProgress=function(p){setProgress(40+p*55,'CARGANDO CORE NES... '+Math.round(p*100)+'%');};
  window.EJS_onGameStart=function(){
    setProgress(100,'🚀 ¡DEFEND THE GALAXY!');
    setTimeout(()=>{document.getElementById('loader').style.display='none';},600);
  };
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{
    const s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/emulatorjs@latest/data/loader.js';
    s2.onerror=()=>showError('No se pudo cargar EmulatorJS.\nVerifica tu conexión a internet.');
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
  let fake=40;
  const iv=setInterval(()=>{
    if(document.getElementById('loader').style.display==='none'){clearInterval(iv);return;}
    fake=Math.min(fake+1.5,94);
    if(fake<94)setProgress(fake,'CARGANDO CORE NES...');
  },300);
}
function toggleFS(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
  if(screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});}
  else{document.exitFullscreen?.();}
}
let muted=false;
function toggleMute(){
  muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  if(window.EJS_emulator?.setVolume)EJS_emulator.setVolume(muted?0:1);
  document.querySelectorAll('audio,video').forEach(a=>a.muted=muted);
}
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
